<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4b34">
<title>よつば週間予定|予定を組む</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
/* ============ 配色(日報アプリと共通トーン) ============ */
:root{
  --midori:#1c4b34;      /* 深緑 */
  --kinari:#f5f1e8;      /* 生成り */
  --ji:#e8e4d8;          /* 地色 */
  --moji:#2b2a26;
  --usu:#8a877c;
  --usu2:#6b675c;
  --keisen:#d9d3c4;
  --keisen2:#e6e1d3;
  --kyoryoku:#4a7c9b;    /* 協力会社の文字色 */
  --shokucho:#3fae6a;    /* ◎ */
  --aka:#b3402e;         /* 重複・警告 */
  --ki:#b07d1e;          /* 余 */
  --kiji:#fdf3dd;
  --kiwaku:#ecd9ac;
  --yasumi:#eceae2;
  --kyo:#eef3ee;         /* きょうの列 */
}
*{box-sizing:border-box}
/* iPhoneのノッチ(カメラの出っぱり)やホームバーで隠れる幅です。
   縦向きや、ノッチのない端末では 0 になるので、見た目は変わりません */
:root{
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
html,body{margin:0;padding:0}
body{
  background:var(--ji);font-family:'Noto Sans JP',sans-serif;color:var(--moji);
  font-size:16px;word-break:keep-all;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;white-space:nowrap;cursor:pointer}
input{font-family:inherit}

/* ============ 全体の枠 ============ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--kinari)}
/* 予定を組むタブだけ、表そのものをスクロールさせます(見出しを固定するため) */
#body{
  flex:1;min-height:0;overflow-y:auto;
  overscroll-behavior:contain;      /* 端で引っぱっても外側が動かないように */
}
#body.plan{overflow:hidden;display:flex;flex-direction:column}
.head{
  background:var(--midori);color:#fff;padding:14px 16px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.head .t{font-size:17px;font-weight:700}
.head .s{font-size:12px;opacity:.75;margin-left:auto}
/* PC版ツールバー */
.head .shukei{
  min-height:34px;padding:5px 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,.5);color:#fff;text-decoration:none;
  font-size:13px;font-weight:700;margin-left:14px;
}
.head .tool{
  min-height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;
  border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;margin-left:8px;
}
.head .tool.xls{background:#fff;color:var(--midori);border:none;font-weight:900}
.head .tool.line{background:#06c755;color:#fff;border:none;font-weight:900}
/* 曜日を選ぶ小さなパネル */
.daymask{position:fixed;inset:0;z-index:44;display:none;background:transparent}
.daymask.on{display:block}
.daypop{
  position:fixed;z-index:45;display:none;background:#fff;width:max-content;
  border:1px solid var(--keisen);border-radius:12px;
  box-shadow:0 12px 32px rgba(43,42,38,.3);
}
.daypop.on{display:block}
.daypop .arrow{
  position:absolute;top:-7px;width:12px;height:12px;background:#fff;transform:rotate(45deg);
  border-left:1px solid var(--keisen);border-top:1px solid var(--keisen);
}
.daypop .in{position:relative;padding:12px 14px}
.daypop .ttl2{font-size:13px;font-weight:900;color:var(--midori);margin-bottom:8px}
.daypop .row2{display:flex;gap:6px}
.daypop .row2 button{
  min-width:56px;min-height:52px;border-radius:8px;border:1px solid var(--keisen);
  background:#fff;line-height:1.25;padding:4px 2px;
}
.daypop .row2 button .w{font-size:14px;font-weight:700;display:block}
.daypop .row2 button .d{font-size:11px;color:var(--usu);display:block}
.daypop .row2 button .n2{font-size:10px;color:var(--midori);font-weight:700;display:block}
.daypop .row2 button.today{border-color:var(--midori);background:var(--kyo)}
.daypop .row2 button:disabled{background:#f4f1e9;color:#b9b3a2;cursor:default}
.daypop .row2 button:disabled .n2{color:#b9b3a2}
.daypop .hint3{font-size:11px;color:var(--usu);margin-top:8px}

/* 帯(オフライン・名簿エラー) */
.obi{padding:8px 14px;font-size:14px;font-weight:700;text-align:center;display:none}
.obi.on{display:block}
.obi.offline{background:#4a4844;color:#fff}
.obi.master{background:#fbe9e5;color:var(--aka);border-bottom:1px solid #e5b8ae}

/* 週ナビ */
.weeknav{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:#fff;border-bottom:1px solid var(--keisen);
}
.weeknav button{
  min-width:48px;min-height:44px;border:1px solid var(--keisen);background:#fff;
  border-radius:8px;font-size:18px;color:var(--midori);font-weight:700;flex-shrink:0;
}
.weeknav button.now{min-width:0;padding:0 12px;border-color:var(--midori);font-size:15px}
.weeknav .lbl{flex:1;text-align:center;line-height:1.2}
.weeknav .lbl b{font-size:17px;font-weight:900;display:block}
.weeknav .lbl span{font-size:12px;color:var(--usu)}

/* カテゴリタブ */
.cats{display:flex;gap:8px;padding:12px 12px 10px;overflow-x:auto}
.cats::-webkit-scrollbar{display:none}
.cats button{
  min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--keisen);
  background:#fff;color:var(--moji);font-size:15px;font-weight:600;
}
.cats button.on{background:var(--midori);color:#fff;border-color:var(--midori);font-weight:700}

/* ============ 使う工事だけ / すべて ============ */
.filterbar{
  display:flex;align-items:center;gap:10px;padding:0 12px 10px;flex-wrap:wrap;
}
.filterbar .seg{display:flex;flex-shrink:0}
.filterbar .seg button{
  min-height:40px;padding:0 14px;border:1px solid var(--keisen);background:#fff;
  font-size:14px;font-weight:700;color:var(--usu2);
}
.filterbar .seg button:first-child{border-radius:20px 0 0 20px}
.filterbar .seg button:last-child{border-radius:0 20px 20px 0;border-left:0}
.filterbar .seg button.on{background:var(--midori);color:#fff;border-color:var(--midori)}
.filterbar .seg button.on + button{border-left-color:var(--midori)}
.filterbar .fmsg{font-size:12px;color:var(--usu);line-height:1.5}
.filterbar .fmsg b{color:var(--ki);font-weight:900}
/* 3つ目:パネルを開くボタン(表示の切り替えではありません) */
.filterbar .pick2{
  min-height:40px;padding:0 14px;border-radius:20px;flex-shrink:0;
  border:1.5px dashed var(--midori);background:#fff;color:var(--midori);
  font-size:14px;font-weight:700;
}
/* 前に使った工事のパネル */
.pastmask{position:fixed;inset:0;background:rgba(43,42,38,.45);z-index:46;display:none}
.pastmask.on{display:block}
.pastpop{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:47;
  width:560px;max-width:calc(100vw - 24px);max-height:86vh;max-height:86dvh;display:none;
  flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 16px 44px rgba(43,42,38,.35);
}
.pastpop.on{display:flex}
.pastpop .ph{background:var(--midori);color:#fff;padding:14px 16px}
.pastpop .ph .t2{font-size:17px;font-weight:900}
.pastpop .ph .s2{font-size:12px;opacity:.85;margin-top:2px}
.pastpop .pbar{
  display:flex;gap:8px;padding:10px 16px;background:var(--kinari);
  border-bottom:1px solid var(--keisen);align-items:center;flex-wrap:wrap;
}
.pastpop .pbar button{
  min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--keisen);
  background:#fff;font-size:13px;font-weight:700;color:var(--usu2);
}
.pastpop .pbar .cnt4{margin-left:auto;font-size:13px;font-weight:700;color:var(--midori)}
.pastpop .pb{overflow-y:auto;padding:6px 0 10px}
.pastpop .prow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 16px;border-bottom:1px solid var(--keisen2);background:#fff;
  border-left:0;border-right:0;border-top:0;min-height:56px;
}
.pastpop .prow.locked{background:var(--kyo);cursor:default}
.pastpop .prow .box{
  width:24px;height:24px;flex-shrink:0;border:2px solid var(--keisen);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;
}
.pastpop .prow.on .box,.pastpop .prow.locked .box{background:var(--midori);border-color:var(--midori)}
.pastpop .prow .jn2{font-size:16px;font-weight:700;line-height:1.35;word-break:break-all}
.pastpop .prow .sub3{font-size:11px;color:var(--usu);margin-top:2px}
.pastpop .prow .tag2{margin-left:auto;flex-shrink:0;font-size:11px;font-weight:700;color:var(--midori)}
.pastpop .pf{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--keisen)}
.pastpop .pf button{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--keisen);background:#fff;font-size:15px;font-weight:700;color:var(--usu2)}
.pastpop .pf .ok2{background:var(--midori);color:#fff;border-color:var(--midori);font-weight:900}
.pastpop .none2{padding:40px 20px;text-align:center;color:var(--usu);font-size:15px;line-height:1.9}

@media (min-width:1024px){
  .filterbar{padding:0 10px 6px;gap:8px}
  .filterbar .seg button{min-height:28px;padding:0 12px;font-size:13px}
  .filterbar .seg button:first-child{border-radius:14px 0 0 14px}
  .filterbar .seg button:last-child{border-radius:0 14px 14px 0}
  .filterbar .fmsg{font-size:11px}
}

/* ============ 予定グリッド ============ */
.gridwrap{
  overflow:auto;padding-bottom:4px;
  overscroll-behavior:contain;      /* 端での跳ね返りを抑えます */
  transform:translateZ(0);          /* 描画をGPUに任せて、固定した行と列のブレを抑えます */
}
#body.plan .gridwrap{flex:1;min-height:0}
.grid{display:grid;grid-template-columns:112px repeat(7,86px);font-size:15px;min-width:min-content}
/* 工事名の列は左に固定。横スワイプしても、どの工事か分かるようにします */
.grid .job,.grid .rest,.grid .yohd{
  position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--keisen);
  backface-visibility:hidden;        /* スクロール中のにじみ・ズレを抑えます */
}
.grid .cathd{position:sticky;left:0;z-index:3}
/* 曜日の見出しは上に固定。縦にスクロールしても残ります */
.grid .hd{position:sticky;top:0;z-index:4;backface-visibility:hidden}
/* 左上の角は、上にも左にも固定します */
.grid .corner{
  position:sticky;top:0;left:0;z-index:6;
  box-shadow:1px 0 0 var(--keisen),0 1px 0 var(--keisen);
  backface-visibility:hidden;
}
.grid .hd{
  padding:8px 4px;text-align:center;border-bottom:1px solid var(--keisen);
  border-left:1px solid var(--keisen2);background:#fff;
}
.grid .hd b{font-weight:700}
.grid .hd span{font-size:12px;color:var(--usu)}
.grid .hd.today{border-bottom:2px solid var(--midori);background:var(--kyo)}
.grid .hd.today b,.grid .hd.today span{color:var(--midori);font-weight:900}
.grid .hd.sat b{color:var(--kyoryoku)}
.grid .hd.sun b{color:var(--aka)}
.grid .corner{
  padding:8px 10px;background:var(--kinari);border-bottom:1px solid var(--keisen);
  font-size:12px;color:var(--usu);
}
/* 工事名の列 */
.grid .job{padding:10px;background:#fff;border-bottom:1px solid var(--keisen)}
/* 長い名前でも日本語の途中で折り返せるようにします(body は keep-all のため) */
.grid .job .n{font-weight:700;line-height:1.3;word-break:break-all;overflow-wrap:anywhere}
.grid .job .no{font-size:11px;color:var(--usu)}
/* セル */
.grid .cell{
  padding:8px 6px;background:#fff;border-bottom:1px solid var(--keisen);
  border-left:1px solid var(--keisen2);line-height:1.55;font-weight:600;
  min-height:44px;text-align:left;color:inherit;font-size:15px;width:100%;
  border-top:0;border-right:0;
}
.grid .cell.today{background:#fdfcf8}
.grid .cell .cnt{font-size:11px;color:var(--usu);font-weight:400}
.grid .cell .more{
  font-size:12px;color:var(--midori);font-weight:700;background:var(--kyo);
  border-radius:8px;text-align:center;margin-top:3px;padding:2px 0;
}
.grid .cell.empty{text-align:center;color:#b9b3a2;font-size:22px}
.nm{white-space:nowrap}
.nm.coop{color:var(--kyoryoku)}
.nm.dup{text-decoration:underline wavy var(--aka);text-underline-offset:3px;font-weight:700}
/* しるし。記号でも打った文字でも、名前と別の色・少し小さめで出します */
.sc{color:var(--shokucho);font-weight:900;margin-right:1px;font-size:.85em}
/* 名前どうしの区切り(中点)。名前より薄くします */
.sep{color:#c2bcab;font-weight:400}
/* 休み行 */
.grid .rest{background:var(--yasumi);border-bottom:1px solid var(--keisen);font-weight:700;color:var(--usu);padding:10px}
.grid .cell.rest{background:var(--yasumi);border-left:1px solid #ddd8cb;color:var(--usu);text-align:center;font-weight:700}
.grid .cell.rest.empty{color:#b9b3a2;font-size:15px}
/* 余 行(PCのみ・読み取り専用) */
.grid .yohd{background:var(--kiji);border-bottom:1px solid var(--kiwaku);font-weight:900;color:var(--ki);padding:10px 12px}
.grid .yo{
  padding:8px 6px;background:var(--kiji);border-bottom:1px solid var(--kiwaku);
  border-left:1px solid #f0e3c2;line-height:1.6;font-weight:600;color:#8a6516;
}
.grid .yo .cnt{font-size:11px;color:var(--ki);font-weight:700}
.grid .yo .none{text-align:center;color:#d8c391}
.grid .yo .plus{border:none;background:#f3e2b6;color:#8a6516;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
/* カテゴリ見出し(PCの「すべて」) */
.grid .cathd{
  grid-column:1/-1;padding:6px 12px;background:var(--kinari);
  border-bottom:1px solid var(--keisen);font-size:12px;font-weight:900;color:var(--midori);
}
.guide{padding:8px 12px 0;font-size:12px;color:var(--usu);text-align:center}
.legend{display:flex;justify-content:center;gap:14px;padding:6px 12px 10px;font-size:12px;font-weight:700}

/* ============ 工事の追加・編集 ============ */
.grid .job{cursor:pointer}
/* カテゴリごとの一番下に置く「＋ 工事を追加」 */
.addjob{background:var(--kinari);border-bottom:1px solid var(--keisen);padding:6px 10px}
.addjob button{
  min-height:44px;padding:0 16px;border-radius:10px;border:1.5px dashed var(--midori);
  background:#fff;color:var(--midori);font-size:15px;font-weight:700;
}
.addjob button span{font-size:12px;font-weight:600;color:var(--usu)}
/* 「隠す」にしたのに、予定があるので表に残っている工事 */
.grid .job .kept{
  margin-top:4px;background:var(--yasumi);border:1px solid var(--keisen);
  border-radius:6px;padding:3px 6px;
}
.grid .job .kept .badge{font-size:11px;font-weight:700;color:var(--usu2);line-height:1.3}
.grid .job .kept .why{font-size:10px;color:var(--usu);line-height:1.3;margin-top:1px}
/* 開始日が来ているのに、まだ人が入っていない工事 */
.grid .job .waiting{
  margin-top:3px;display:inline-block;background:var(--kiji);border:1px solid var(--kiwaku);
  border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--ki);line-height:1.4;
}
.popmask{position:fixed;inset:0;z-index:39;display:none;background:transparent}
.popmask.on{display:block}
.jobpop{
  position:fixed;z-index:40;width:420px;max-width:calc(100vw - 24px);
  /* 画面からはみ出さないよう、高さに上限をつけて中身をスクロールさせます */
  max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);
  background:#fff;border:1px solid var(--keisen);border-radius:12px;
  box-shadow:0 12px 32px rgba(43,42,38,.28);display:none;
  flex-direction:column;overflow:hidden;
}
.jobpop.on{display:flex}
.jobpop .in{overflow-y:auto}
.jobpop .arrow{
  position:absolute;width:14px;height:14px;background:#fff;transform:rotate(45deg);
}
.jobpop.below .arrow{top:-8px;border-left:1px solid var(--keisen);border-top:1px solid var(--keisen)}
.jobpop.above .arrow{bottom:-8px;border-right:1px solid var(--keisen);border-bottom:1px solid var(--keisen)}
.jobpop .in{position:relative;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
/* 画面に収まりきらず、位置をずらしたときは三角を出しません */
.jobpop.noarrow .arrow{display:none}
.jobpop .ttl{font-size:15px;font-weight:900;color:var(--midori)}
.jobpop hr{border:0;border-top:1px solid var(--keisen);margin:2px 0}
/* ラベルは左、入力は右 */
.jobpop .fld{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center}
.jobpop .fld .lb{font-size:14px;font-weight:700;color:var(--usu2);line-height:1.3}
.jobpop .fld .lb small{display:block;font-size:11px;font-weight:600;color:var(--usu)}
.jobpop input{
  width:100%;min-height:48px;border:1.5px solid var(--midori);border-radius:8px;
  padding:0 12px;font-size:16px;background:#fff;font-family:inherit;
}
.jobpop input.sub{border-color:var(--keisen)}
.jobpop .cats2{display:flex;gap:6px;flex-wrap:wrap}
.jobpop .cats2 button{
  min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--keisen);
  background:#fff;font-size:14px;font-weight:600;color:var(--moji);
}
.jobpop .cats2 button.on{background:var(--midori);color:#fff;border-color:var(--midori);font-weight:700}
.jobpop .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jobpop .tools button{
  min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--keisen);
  background:#fff;font-size:14px;font-weight:700;color:var(--usu2);
}
.jobpop .tools button:disabled{color:#cfc9ba;cursor:default}
.jobpop .tools .hide.on{border-color:var(--ki);color:var(--ki);background:var(--kiji)}
.jobpop .copyw{
  width:100%;min-height:44px;border-radius:8px;border:1.5px solid var(--midori);
  background:var(--kyo);color:var(--midori);font-size:15px;font-weight:700;
}
.jobpop .copyw:disabled{border-color:var(--keisen);background:#f4f1e9;color:#b9b3a2;cursor:default}
.jobpop .copyw span{font-size:12px;font-weight:600;color:var(--usu2)}
.jobpop .copyw:disabled span{color:#b9b3a2}
.jobpop .err{font-size:13px;font-weight:700;color:var(--aka)}
.jobpop .btns{
  display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;
  padding:10px 16px;border-top:1px solid var(--keisen);background:#fff;
}
.jobpop .btns button{
  min-height:44px;padding:0 20px;border-radius:8px;font-size:15px;font-weight:700;
  border:1px solid var(--keisen);background:#fff;color:var(--usu2);
}
.jobpop .btns .ok{background:var(--midori);color:#fff;border-color:var(--midori);font-weight:900}

/* ============ 下タブ ============ */
.tabs{
  margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:#fff;border-top:1px solid var(--keisen);
  padding:6px 4px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:20;
}
.tabs button{border:none;background:none;text-align:center;padding:6px 0;color:var(--usu);min-height:44px}
.tabs button .i{font-size:20px}
.tabs button .l{font-size:12px;font-weight:600}
.tabs button.on{color:var(--midori)}
.tabs button.on .l{font-weight:900}

/* ============ 選択シート ============ */
.mask{position:fixed;inset:0;background:rgba(43,42,38,.38);z-index:30;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
  z-index:31;display:none;flex-direction:column;max-height:92vh;max-height:92dvh;
  box-shadow:0 -8px 30px rgba(0,0,0,.25);
}
.sheet.on{display:flex}
.sheet .sh{background:var(--midori);color:#fff;padding:14px 16px;border-radius:18px 18px 0 0}
.sheet .sh .j{font-size:18px;font-weight:900}
.sheet .sh .d{font-size:15px;opacity:.9;margin-top:2px}
.sheet .sb{padding:14px 14px 8px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.sheet .sf{
  display:flex;gap:10px;padding:12px 14px calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--keisen);
}
.sheet .sf button{min-height:50px;border-radius:10px;font-size:15px;font-weight:700;flex-shrink:0;padding:0 14px}
.btn-clear{border:1px solid var(--aka);background:#fff;color:var(--aka)}
.btn-cancel{border:1px solid var(--keisen);background:#fff;color:var(--usu2)}
.btn-ok{flex:1;border:none;background:var(--midori);color:#fff;font-size:18px;font-weight:900}
.copyprev{
  min-height:48px;border-radius:10px;border:1.5px solid var(--midori);background:var(--kyo);
  color:var(--midori);font-size:15px;font-weight:700;text-align:left;padding:0 14px;
}
.copyprev:disabled{border-color:var(--keisen);background:#f4f1e9;color:#b9b3a2;cursor:default}
.copyprev span{font-size:13px;font-weight:600;color:var(--usu2)}
.grp{}
.grp.yo{background:var(--kiji);border:1px solid var(--kiwaku);border-radius:12px;padding:12px}
.grp .gt{font-size:15px;font-weight:900;color:var(--ki);margin-bottom:10px}
.grp .gt.sub{font-size:14px;font-weight:700;color:var(--usu);margin-bottom:8px}
.grp .gt .sum{margin-left:8px;font-size:13px;font-weight:700;color:#8a6516}
.grp .ghint{margin-top:10px;font-size:12px;color:#8a6516;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--keisen);
  background:#fff;font-size:16px;font-weight:700;
}
.chip.on{background:var(--midori);color:#fff;border-color:var(--midori)}
.chip.coop{color:var(--kyoryoku)}
.chip.on.coop{color:#fff}
/* 配置ずみ・休みは「名前だけ + 色」で見分けます(行き先は出しません) */
.chip.placed{border:1.5px dashed #b9b3a2;background:#f4f1e9;color:var(--usu2)}
.chip.rest{background:var(--yasumi);color:var(--usu)}
.extra-row{display:flex;gap:8px}
.extra-row input{
  flex:1;min-height:44px;border:1px solid var(--keisen);border-radius:10px;
  padding:0 12px;font-size:16px;background:#fff;
}
.extra-row button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--midori);background:#fff;color:var(--midori);font-size:15px;font-weight:700}
/* しるし選択の吹き出し(押したチップのすぐ横に出ます) */
.markmask{position:fixed;inset:0;z-index:44;display:none;background:transparent}
.markmask.on{display:block}
.markpop{
  position:fixed;z-index:45;display:none;background:#fff;
  border:1px solid var(--keisen);border-radius:12px;
  box-shadow:0 12px 32px rgba(43,42,38,.3);width:max-content;max-width:calc(100vw - 24px);
  max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);flex-direction:column;overflow:hidden;
}
.markpop.on{display:flex}
.markpop .in{overflow-y:auto}
.markpop.noarrow .arrow{display:none}
.markpop .arrow{position:absolute;width:12px;height:12px;background:#fff;transform:rotate(45deg)}
.markpop.below .arrow{top:-7px;border-left:1px solid var(--keisen);border-top:1px solid var(--keisen)}
.markpop.above .arrow{bottom:-7px;border-right:1px solid var(--keisen);border-bottom:1px solid var(--keisen)}
.markpop .in{position:relative;padding:10px 12px}
.markpop .who{font-size:13px;font-weight:700;color:var(--usu);margin-bottom:8px}
.markpop .row{display:flex;gap:6px}
.markpop .row button{
  min-height:48px;min-width:56px;border-radius:10px;border:1px solid var(--keisen);
  background:#fff;font-size:18px;font-weight:700;
}
.markpop .row button.on{background:var(--midori);color:#fff;border-color:var(--midori);font-weight:900}
.markpop .row button.none{font-size:14px}
.markpop .hint2{font-size:11px;color:var(--usu);margin-top:6px;line-height:1.6}
/* その他:自由に打てるしるし */
.markpop .freemark{display:flex;align-items:center;gap:6px;margin-top:8px}
.markpop .freemark .lb3{font-size:12px;font-weight:700;color:var(--usu2);flex-shrink:0}
.markpop .freemark input{
  flex:1;min-width:90px;min-height:44px;border:1px solid var(--keisen);border-radius:8px;
  padding:0 10px;font-size:16px;background:#fff;
}
.markpop .freemark .ok3{
  min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--midori);
  background:#fff;color:var(--midori);font-size:14px;font-weight:700;flex-shrink:0;
}
.markpop .off{
  display:block;width:100%;margin-top:8px;min-height:44px;border-radius:10px;
  border:1px solid var(--aka);background:#fff;color:var(--aka);font-size:14px;font-weight:700;
}
.nowsel{font-size:15px;font-weight:700;color:var(--midori);text-align:center;background:var(--kyo);border-radius:8px;padding:8px}
.nowsel b{font-size:18px;font-weight:900}

/* ============ 設定(職長) ============ */
/* ============ メンバー(名簿)============ */
.setbar{padding:12px;background:#fff;border-bottom:1px solid var(--keisen);display:flex;flex-direction:column;gap:10px}
.setbar input{width:100%;min-height:44px;border:1px solid var(--keisen);border-radius:10px;padding:0 12px;font-size:16px}
.setbar .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setbar .cnt{font-size:15px;font-weight:700;color:var(--midori);margin-left:auto}
.toggle{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--keisen);background:#fff;font-size:14px;font-weight:700}
.toggle.on{background:var(--midori);color:#fff;border-color:var(--midori)}
.toggle.add{border-color:var(--midori);color:var(--midori);border-style:dashed;border-width:1.5px}
.wlist{display:flex;flex-direction:column;gap:8px;padding:12px}
.wrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--keisen);border-radius:12px;padding:10px 12px;min-height:60px;
}
.wrow.off{background:var(--yasumi);border-style:dashed}
.wrow .nm2{font-size:18px;font-weight:700}
.wrow .nm2.coop{color:var(--kyoryoku)}
.wrow .sub{font-size:12px;color:var(--usu);margin-top:2px}
.wrow .ord{
  font-size:11px;color:#c2bcab;font-weight:700;width:26px;flex-shrink:0;text-align:right;
}
.wrow .tag{
  margin-left:auto;flex-shrink:0;font-size:11px;font-weight:700;color:var(--usu);
  background:var(--yasumi);border:1px solid var(--keisen);border-radius:10px;padding:2px 8px;
}
/* まとめて追加 */
.bulk{padding:12px;display:flex;flex-direction:column;gap:10px}
.bulk textarea{
  width:100%;min-height:200px;border:1.5px solid var(--midori);border-radius:10px;
  padding:10px 12px;font-size:16px;font-family:inherit;line-height:1.7;background:#fff;
}
.bulk .ex{
  font-size:12px;color:var(--usu);line-height:1.7;background:#fff;
  border:1px solid var(--keisen);border-radius:10px;padding:10px 12px;
}
.bulk .ex b{color:var(--moji)}
.bulk .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk .row .lb{font-size:14px;font-weight:700;color:var(--usu2)}
.bulk .btns{display:flex;gap:10px;justify-content:flex-end}
.bulk .btns button{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--keisen);background:#fff;font-size:15px;font-weight:700;color:var(--usu2)}
.bulk .btns .ok{background:var(--midori);color:#fff;border-color:var(--midori);font-weight:900}
/* 選択シートの「名簿を直す」 */
.fixlink{
  margin-top:10px;font-size:13px;color:var(--midori);font-weight:700;
  background:none;border:none;text-decoration:underline;padding:6px 0;min-height:36px;
}
.chip.unknown{border:1.5px dashed var(--ki);background:#fffaf0;color:#8a6516}
.chip.unknown.on{background:var(--midori);color:#fff;border-style:solid;border-color:var(--midori)}

/* ============ 配信 ============ */
.wknav2{
  padding:10px 12px;background:#fff;border-bottom:1px solid var(--keisen);
  text-align:center;font-weight:900;font-size:17px;
}
.wknav2 span{font-size:12px;color:var(--usu);font-weight:400}
.daypills{display:flex;gap:6px;padding:12px 10px}
.daypills button{
  flex:1;min-height:52px;border-radius:10px;border:1px solid var(--keisen);
  background:#fff;line-height:1.2;position:relative;padding:0;
}
.daypills button .w{font-size:14px;font-weight:700}
.daypills button .d{font-size:11px;color:var(--usu)}
.daypills button.sat .w{color:var(--kyoryoku)}
.daypills button.sun .w{color:var(--aka)}
.daypills button.on{background:var(--midori);border-color:var(--midori)}
.daypills button.on .w{color:#fff;font-weight:900}
.daypills button.on .d{color:#fff;opacity:.85}
.daypills button.on.sat .w,.daypills button.on.sun .w{color:#fff}
.daypills button .dot{
  position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;
  background:#e5604a;border:1.5px solid #fff;
}
/* ============ チェック ============ */
.checks{display:flex;flex-direction:column;gap:12px;padding:2px 12px 14px}
.card{border-radius:12px;padding:14px}
.card .ct{display:flex;align-items:center;gap:8px}
.card .ct .t{font-size:16px;font-weight:900}
.card .ct .n{
  margin-left:auto;color:#fff;border-radius:14px;padding:3px 12px;
  font-size:14px;font-weight:900;white-space:nowrap;
}
.card.dup{background:#fbe9e5;border:1px solid #e5b8ae}
.card.dup .ct .t{color:var(--aka)}
.card.dup .ct .n{background:var(--aka)}
.card.yo2{background:var(--kiji);border:1px solid var(--kiwaku)}
.card.yo2 .ct .t{color:var(--ki)}
.card.yo2 .ct .n{background:var(--ki)}
.card.rest2{background:var(--yasumi);border:1px solid var(--keisen)}
.card.rest2 .ct .t{color:var(--usu)}
.card.rest2 .ct .n{background:var(--usu)}
.card .body2{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.card .msg{font-size:14px;color:var(--usu);margin-top:6px}
.card.dup .msg{color:var(--aka)}
.card.yo2 .msg{color:#8a6516}
/* 重複した人 */
.dupitem{
  display:inline-flex;flex-direction:column;background:#fff;border:1px solid #e5b8ae;
  border-radius:12px;padding:8px 16px;text-align:left;
}
.dupitem .nm3{font-size:17px;font-weight:700;white-space:nowrap}
.dupitem .nm3 .wv{text-decoration:underline wavy var(--aka);text-underline-offset:3px}
.dupitem .to{font-size:12px;color:var(--aka);font-weight:600;margin-top:2px}
/* 余・休みの名前 */
.pill2{
  background:#fff;border:1px solid var(--kiwaku);border-radius:20px;
  padding:8px 16px;font-size:16px;font-weight:700;
}
.pill2.coop{color:var(--kyoryoku)}
.card.rest2 .pill2{border-color:var(--keisen);color:var(--usu2)}
.sumcard{
  background:#fff;border:1px solid var(--keisen);border-radius:12px;padding:12px;
  text-align:center;font-size:16px;font-weight:700;
}
.sumcard b{color:var(--midori);font-size:20px;font-weight:900}
.sumcard .sub2{font-size:12px;color:var(--usu);font-weight:400;margin-top:4px}

.linebox{
  margin:2px 12px 0;background:#fff;border:1px solid var(--keisen);border-radius:12px;
  padding:16px;font-size:16px;line-height:1.9;white-space:pre-wrap;word-break:break-all;
}
.linebox .head{font-weight:900}
.linebox .job{font-weight:700;margin-top:6px}
.linebox .job:first-of-type{margin-top:0}
.linebox .foot{color:var(--usu2)}
.copywrap{padding:14px 12px 8px}
.copybtn{
  width:100%;min-height:56px;border-radius:12px;border:none;
  background:#06c755;color:#fff;font-size:18px;font-weight:900;
}
.copyfall{margin:0 12px 12px}
.copyfall textarea{
  width:100%;min-height:160px;border:1px solid var(--keisen);border-radius:10px;
  padding:10px;font-size:15px;font-family:inherit;line-height:1.8;background:#fff;
}
.copyfall .t{font-size:13px;color:var(--aka);font-weight:700;margin-bottom:6px}

@media (min-width:1024px){
  .wknav2{padding:5px 12px;font-size:15px}
  .daypills{padding:6px 10px;gap:6px}
  .daypills button{min-height:44px}
  .checks{max-width:760px;margin:0 auto;padding:6px 12px 14px}
  .card{padding:12px}
  .card .ct .t{font-size:15px}
  .pill2{padding:6px 14px;font-size:15px}
  .linebox{font-size:15px;line-height:1.8;padding:14px;max-width:640px;margin:2px auto 0}
  .copywrap{max-width:640px;margin:0 auto}
  .copyfall{max-width:640px;margin:0 auto 12px}
}

/* ============ これから作る画面 ============ */
.soon{padding:60px 24px;text-align:center;color:var(--usu);line-height:1.9}
.soon .e{font-size:40px}

/* ============ トースト ============ */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:#2b2a26;color:#fff;border-radius:16px;padding:10px 18px;
  font-size:14px;font-weight:700;z-index:50;display:none;max-width:90vw;text-align:center;
}
.toast.on{display:block}
/* ノッチで隠れる幅を測るための、目に見えない箱です(JavaScriptから読みます) */
#safeprobe{
  position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-left:var(--sal);padding-right:var(--sar);
}

/* =====================================================================
   PC(1024px以上)= 一覧性優先。画面いっぱい・行を詰める
   ※ スマホ(1023px以下)は上の指定のまま。大きさは変えていません
   ===================================================================== */
@media (min-width:1024px){
  body{background:var(--kinari)}
  /* 最大幅・外枠・影をやめて画面いっぱいに */
  #app{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;min-height:100vh}

  /* --- 上まわりを薄く(だいたい半分の高さ) --- */
  .head{padding:3px 12px}
  .head .t{font-size:14px;font-weight:900}
  .head .s{font-size:11px}
  .obi{padding:4px 12px;font-size:12px}

  .weeknav{padding:3px 10px;gap:6px}
  .weeknav button{min-width:32px;min-height:26px;font-size:13px;border-radius:6px}
  .weeknav button.now{padding:0 10px;font-size:13px}
  .weeknav .lbl{line-height:1.1}
  .weeknav .lbl b{font-size:15px}
  .weeknav .lbl span{font-size:11px}

  .cats{padding:4px 10px;gap:6px;overflow:visible}
  .cats button{min-height:26px;padding:0 12px;font-size:13px;border-radius:13px}

  /* --- 表 --- */
  .gridwrap{overflow-x:visible}
  /* 平日1に対して 土日0.7。工事名の列は読める幅を確保します */
  .grid{
    grid-template-columns:240px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.7fr));
    font-size:13px;min-width:0;
  }
  .grid .corner{padding:4px 8px;font-size:11px}
  .grid .hd{padding:4px 3px}
  .grid .hd span{font-size:11px}

  /* 工事名。3行まで折り返し、入らないものだけ … 。縦は中央ぞろえ */
  .grid .job{padding:4px 10px;display:flex;flex-direction:column;justify-content:center}
  /* 3行まで折り返し、それでも入らないときだけ … で省略(全文はマウスオーバー) */
  .grid .job .n{
    font-size:14px;line-height:1.28;font-weight:700;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;text-overflow:ellipsis;
    word-break:break-all;overflow-wrap:anywhere;
  }
  .grid .job .no{font-size:10px;line-height:1.2}

  /* セルは行の高さを下げる */
  .grid .cell{padding:4px 5px;line-height:1.38;font-size:13px;min-height:0}
  .grid .cell .cnt{font-size:10px;line-height:1.2}
  .grid .cell.empty{font-size:15px;padding:2px}
  .grid .cell .more{font-size:11px;padding:0;margin-top:1px}
  .grid .rest{padding:4px 8px;font-size:13px}
  .grid .cell.rest{padding:4px 5px}
  .grid .cathd{padding:3px 8px;font-size:11px}

  /* --- 🟡余 行:たたんだ状態を既定に。ふつうの行と同じ高さ --- */
  .grid .yohd{
    padding:4px 6px 4px 4px;font-size:13px;
    display:flex;align-items:center;gap:6px;
  }
  .grid .yohd .tg{
    order:-1;flex-shrink:0;                 /* 左端に小さく */
    min-height:20px;padding:0 6px;border-radius:10px;
    border:1px solid var(--kiwaku);background:#fff;color:var(--ki);
    font-size:11px;font-weight:700;line-height:18px;
  }
  .grid .yo{padding:4px 5px;line-height:1.38}
  .grid .yo .cnt{font-size:10px}
  /* たたんでいるとき = 人数だけ大きく1行 */
  .grid .yo.closed{text-align:center;padding:4px 5px}
  .grid .yo.closed .big{font-size:15px;font-weight:900;color:var(--ki);line-height:1.3}
  .grid .yo.closed .none{font-size:13px;line-height:1.3}

  .guide{display:none}
  .legend{padding:4px 12px 6px;font-size:11px;gap:12px}

  /* --- 下タブも薄く --- */
  .tabs{grid-template-columns:repeat(4,1fr);padding:1px 4px 3px}
  .tabs button{min-height:30px;padding:1px 0}
  .tabs button .i{font-size:13px;line-height:1.15}
  .tabs button .l{font-size:10px}

  /* --- 選択シートは中央のモーダル(大きさは触りません) --- */
  .sheet{
    left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:520px;max-height:86vh;border-radius:14px;
  }
  .sheet .sh{border-radius:14px 14px 0 0}
  .sheet .sf{padding:12px 14px 16px}

  .wlist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
}
@media (max-width:1023px){
  .pconly{display:none !important}
}

/* =====================================================================
   スマホを横向きにしたとき(幅1023px以下 かつ 横長)
     ・PC版には切り替えず、スマホ用のレイアウトのまま使います
     ・縦が狭くなるので、上まわりと下タブを薄くします
     ・横が広くなるので、日付の列を伸ばして7日ぶん見えるようにします
   ===================================================================== */
@media (max-width:1023px) and (orientation:landscape){

  /* ---- 上まわりを薄く ---- */
  .head{padding:5px 12px}
  .head .t{font-size:14px;font-weight:900}
  .head .s{font-size:11px}
  .obi{padding:4px 12px;font-size:12px}

  .weeknav{padding:4px 10px;gap:6px}
  .weeknav button{min-width:40px;min-height:32px;font-size:15px;border-radius:7px}
  .weeknav button.now{padding:0 10px;font-size:13px}
  .weeknav .lbl{line-height:1.15}
  .weeknav .lbl b{font-size:15px}
  .weeknav .lbl span{font-size:11px}

  .cats{padding:5px 10px 4px;gap:6px}
  .cats button{min-height:32px;padding:0 12px;font-size:13px;border-radius:16px}

  .filterbar{padding:0 10px 5px;gap:8px}
  .filterbar .seg button{min-height:30px;padding:0 12px;font-size:13px}
  .filterbar .seg button:first-child{border-radius:15px 0 0 15px}
  .filterbar .seg button:last-child{border-radius:0 15px 15px 0}
  .filterbar .pick2{min-height:30px;padding:0 12px;font-size:13px;border-radius:15px}
  .filterbar .fmsg{font-size:11px}

  /* ---- 表 ----
     日付の列を「最低84px・余った幅は山分け」にします。
     画面が広ければ7日ぶんが一度に見え、狭ければ今までどおり横スクロールします。
     工事名の列と曜日の行の固定は、縦向きと同じしくみのまま効きます      */
  .grid{grid-template-columns:104px repeat(7,minmax(84px,1fr))}
  .grid .job{padding:8px}
  .grid .cell{padding:6px 5px}

  /* ---- 下タブ:絵文字と文字を横に並べて薄くします ---- */
  .tabs{padding:2px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabs button{
    min-height:38px;padding:2px 0;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tabs button .i{font-size:16px}
  .tabs button .l{font-size:12px}

  /* ---- 名前を選ぶシート:縦が狭いので上下を詰めます ---- */
  .sheet{max-height:96vh;max-height:96dvh}
  .sheet .sh{padding:8px 14px}
  .sheet .sh .j{font-size:16px}
  .sheet .sh .d{font-size:13px}
  .sheet .sb{padding:10px 12px 6px;gap:10px}
  .sheet .sf{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
  .sheet .sf button{min-height:42px;font-size:14px}
  .sheet .sf .btn-ok{font-size:16px}

  /* ---- 表に使える高さをかせぎます ----
     ・カテゴリと絞り込みを、同じ行に横に並べます
     ・「◀ 横にスワイプ ◀」の案内は、横向きでは7日ぶん全部見えるので消します
     ・下の色の説明は薄くします                                        */
  #body.plan{
    display:grid;
    grid-template-columns:minmax(0,auto) minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto;
  }
  #body.plan .weeknav{grid-column:1 / -1;grid-row:1}
  #body.plan .cats{grid-column:1;grid-row:2;padding:5px 4px 4px 10px}
  #body.plan .filterbar{
    grid-column:2;grid-row:2;align-self:center;
    justify-content:flex-end;padding:0 10px 0 6px;
  }
  /* 絞り込みのボタンは1行に。件数の文は、入りきらないときだけ下の行に回します
     (日本語は途中で折り返さない設定にしているため、無理に押し込むと切れてしまいます) */
  #body.plan .filterbar{flex-wrap:wrap;row-gap:2px;column-gap:8px}
  #body.plan .filterbar .fmsg{flex:1 1 100%;text-align:right;line-height:1.25}
  /* ボタンが行の高さいっぱいに伸びないようにします */
  #body.plan .cats{align-items:center}
  #body.plan .gridwrap{grid-column:1 / -1;grid-row:3}
  #body.plan .guide{display:none}
  #body.plan .legend{grid-column:1 / -1;grid-row:4;padding:3px 12px 4px;font-size:11px;gap:12px}

  /* 週の見出しは1行にまとめます */
  .weeknav .lbl b{display:inline;font-size:14px}
  .weeknav .lbl span{margin-left:6px}

  /* ---- 配信の文面 ----
     横向きだと1行が長くなりすぎて、LINEでの見え方と離れてしまうため、
     幅を抑えて中央に置きます。コピーする中身は変わりません        */
  .linebox{max-width:620px;margin:2px auto 0;padding:14px;font-size:15px;line-height:1.8}
  .copywrap{max-width:620px;margin:0 auto;padding:10px 12px 8px}
  .copyfall{max-width:620px;margin:0 auto 12px}
  .copyfall textarea{min-height:120px}

  /* ---- メンバー一覧は、横に広いので2列に ---- */
  .wlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 12px}

  /* =============== ノッチ(カメラの出っぱり)よけ ===============
     iPhoneを横向きにすると、画面の左右どちらかがカメラの出っぱりに隠れます。
     隠れる幅ぶんだけ、中身を内側に寄せます。背景は端まで伸ばしたままにして、
     帯が途中で切れて見えないようにしています。                            */
  .head{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
  .obi{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
  .weeknav{padding-left:calc(10px + var(--sal));padding-right:calc(10px + var(--sar))}
  .tabs{padding-left:calc(4px + var(--sal));padding-right:calc(4px + var(--sar))}

  /* 予定を組むタブ(カテゴリは左はし、絞り込みは右はしに置いてあります) */
  #body.plan .cats{padding-left:calc(10px + var(--sal))}
  #body.plan .filterbar{padding-right:calc(10px + var(--sar))}
  #body.plan .legend{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
  /* そのほかのタブ(チェック・配信・メンバー)は、まとめて内側に寄せます */
  #body:not(.plan){padding-left:var(--sal);padding-right:var(--sar)}

  /* 表。スクロールする枠ごと内側に寄せます。こうすると、左に固定している
     工事名の列は枠の左はし(=ノッチの外側)で止まります。枠の内側に余白を
     取るやり方だと、ブラウザによって固定位置の数え方が違うため避けました */
  .gridwrap{margin-left:var(--sal);margin-right:var(--sar)}

  /* 名前を選ぶシート */
  .sheet .sh{padding-left:calc(14px + var(--sal));padding-right:calc(14px + var(--sar))}
  .sheet .sb{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
  .sheet .sf{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}

  /* 吹き出し。置く場所はJavaScript側でも避けています */
  .jobpop,.markpop,.daypop,.pastpop{
    max-width:calc(100vw - 24px - var(--sal) - var(--sar));
  }
  /* まん中に出すものは、ノッチのぶんだけ中心をずらします */
  .pastpop{margin-left:calc((var(--sal) - var(--sar)) / 2)}
  .toast{margin-left:calc((var(--sal) - var(--sar)) / 2);max-width:calc(90vw - var(--sal) - var(--sar))}
}
</style>
</head>
<body>

<div id="app">
  <div class="head">
    <div class="t" id="headTitle">📅 予定を組む</div>
    <a class="shukei pconly" href="shukei.html">📊 集計</a>
    <button class="tool xls pconly" id="btnXls">📥 Excel書き出し</button>
    <button class="tool line pconly" id="btnLine">💬 LINE用にコピー</button>
    <div class="s">よつば建設工業</div>
  </div>

  <div class="obi offline" id="obiOffline">電波が届いていません。編集はできません</div>
  <div class="obi master" id="obiMembers">
    メンバーが登録されていません。下の「👥 メンバー」から登録してください
  </div>

  <div id="body"></div>

  <div class="tabs">
    <button data-tab="plan" class="on"><div class="i">📅</div><div class="l">予定を組む</div></button>
    <button data-tab="check"><div class="i">🔍</div><div class="l">チェック</div></button>
    <button data-tab="line"><div class="i">💬</div><div class="l">配信</div></button>
    <button data-tab="members"><div class="i">👥</div><div class="l">メンバー</div></button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div id="safeprobe"></div>
<div class="popmask" id="popmask"></div>
<div class="jobpop" id="jobpop"></div>
<div class="markmask" id="markmask"></div>
<div class="markpop" id="markpop"></div>
<div class="pastmask" id="pastmask"></div>
<div class="pastpop" id="pastpop"></div>
<div class="daymask" id="daymask"></div>
<div class="daypop" id="daypop"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';

  /* =================================================================
     状態
     ================================================================= */
  var S = {
    tab: 'plan',
    monday: YY.thisMonday(),
    cat: 1,              // 1 / 2 / 3 / 'all'(PCのみ)
    week: { assign: {} },
    online: true,
    yoOpen: false,       // PCの「余」行をひらいているか
    unsubWeek: null,
    prevMonday: null,    // 先週の月曜(コピー元)
    prevWeek: null,      // 先週のデータ。読めるまでは null
    nearBase: null,      // 直近の週を読んだときの基準
    nearWeeks: {},       // 直近4週ぶん(最後に人が入った日を調べます)
    nearLoaded: false,
    sheet: null,         // 選択シートの作業中の中身
    pickDate: null,      // チェック・配信で選んでいる日(共通)
    onlyUsed: true,
    past: null,          // 「前に使った工事」パネルの作業中の中身      // 予定を組む:その週に人が入っている工事だけ出すか
    markChip: null,      // しるしの吹き出しを出しているチップ
    editJob: null,       // 吹き出しで開いている工事id('__new__' なら新規)
    editCat: 1,          // その吹き出しで選んでいるカテゴリ
    editNewCat: null     // 新規追加のとき、どのカテゴリの「＋」から開いたか
  };

  var $ = function (id) { return document.getElementById(id); };
  var isPC = function () { return window.matchMedia('(min-width:1024px)').matches; };

  /** iPhoneのノッチで隠れる左右の幅(px)。縦向きやノッチのない端末では 0 です。
      目に見えない箱に余白として描かせ、その幅を読み取っています。 */
  function safeLR() {
    var p = $('safeprobe');
    if (!p) return { l: 0, r: 0 };
    var cs = window.getComputedStyle(p);
    return { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
  }
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  };

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  /* =================================================================
     起動
     ================================================================= */
  function boot() {
    // PWA(manifest と ホーム画面アイコン)
    var icon = YY.iconDataUri(180);
    var link = document.createElement('link');
    link.rel = 'apple-touch-icon'; link.href = icon;
    document.head.appendChild(link);
    var fav = document.createElement('link');
    fav.rel = 'icon'; fav.href = YY.iconDataUri(64);
    document.head.appendChild(fav);
    var mf = {
      name: 'よつば週間予定(編集)', short_name: 'よつば予定',
      display: 'standalone', background_color: '#f5f1e8', theme_color: '#1c4b34',
      icons: [{ src: icon, sizes: '180x180', type: 'image/svg+xml' }]
    };
    var ml = document.createElement('link');
    ml.rel = 'manifest';
    ml.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/json' }));
    document.head.appendChild(ml);

    YY.init();

    // 接続の見張り
    YY.onConnection(function (on) {
      S.online = on;
      $('obiOffline').classList.toggle('on', !on);
    });

    // 工事とメンバー(追加・編集が全端末にその場で反映されます)
    YY.subscribeJobs(function () { render(); });
    YY.subscribeMembers(function () { render(); });

    watchWeek();

    // 下タブ
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.addEventListener('click', function () {
        S.tab = b.getAttribute('data-tab');
        Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
          x.classList.toggle('on', x === b);
        });
        closeSheet();
        render();
      });
    });

    $('mask').addEventListener('click', closeSheet);

    // PC版ツールバー
    $('btnXls').addEventListener('click', exportExcel);
    $('btnLine').addEventListener('click', function (e) {
      e.stopPropagation();
      openDayPop($('btnLine'));
    });

    // 吹き出し:外側をクリック / Esc で閉じます(保存しません)
    $('popmask').addEventListener('click', closeJobPop);
    $('markmask').addEventListener('click', closeMarkPop);
    $('daymask').addEventListener('click', closeDayPop);
    $('pastmask').addEventListener('click', closePastPop);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (S.past) closePastPop();
      else if (S.markChip) closeMarkPop();
      else if (S.editJob) closeJobPop();
      else closeDayPop();
    });
    // 画面が動いても、指している相手を追いかけます
    window.addEventListener('scroll', function () {
      positionJobPop();
      positionMarkPop();
    }, true);

    // スマホ⇔PCの切り替わりで組み直します
    window.addEventListener('resize', function () { render(); positionJobPop(); });
    var mq = window.matchMedia('(min-width:1024px)');
    if (mq.addEventListener) mq.addEventListener('change', function () { render(); });
    else if (mq.addListener) mq.addListener(function () { render(); });

    render();
  }

  /**
   * 表示中の週を購読しなおします。
   * あわせて直近の週を1回読みます。使いみちは2つです。
   *   ・先週からのコピー元、継続中の工事の判定
   *   ・「前に使った工事」パネルの一覧
   */
  function watchWeek() {
    if (S.unsubWeek) S.unsubWeek();
    S.unsubWeek = YY.subscribeWeek(S.monday, function (w) {
      S.week = w;
      render();
      if (S.sheet) refreshSheet();   // シートを開いたまま他の人が編集したとき
    });

    var base = S.monday;
    var keys = [];
    for (var i = 1; i <= YY.JOB_KEEP_WEEKS; i++) keys.push(YY.addWeeks(base, -i));
    S.nearBase = base;
    S.nearWeeks = {};
    S.nearLoaded = false;
    S.prevWeek = null;
    S.prevMondayKey = YY.addWeeks(base, -1);
    S._prevUsedCache = null;
    S._prevUsedFor = null;

    Promise.all(keys.map(function (k) {
      return YY.loadWeek(k).then(function (w) { return { k: k, w: w }; });
    })).then(function (list) {
      if (S.nearBase !== base) return;   // 読んでいる間に週が動いたら捨てます
      var m = {};
      list.forEach(function (x) { m[x.k] = x.w; });
      S.nearWeeks = m;
      S.nearLoaded = true;
      S.prevWeek = m[S.prevMondayKey] || null;
      S._prevUsedCache = null;
      render();
      if (S.sheet) refreshSheet();
    });
  }

  /** 判定に使う週のまとまり(表示中の週 + 直近の週) */
  function nearWeeksAll() {
    var m = {};
    Object.keys(S.nearWeeks || {}).forEach(function (k) { m[k] = S.nearWeeks[k]; });
    m[S.monday] = S.week;
    return m;
  }

  function goWeek(n) {
    S.monday = (n === 0) ? YY.thisMonday() : YY.addWeeks(S.monday, n);
    closeSheet();
    watchWeek();
    render();
  }

  /* =================================================================
     画面の描き分け
     ================================================================= */
  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-tab') === S.tab);
    });

    var head = {
      plan: '📅 予定を組む', check: '🔍 チェック',
      line: '💬 配信', members: '👥 メンバー'
    };
    $('headTitle').textContent = head[S.tab] || '';

    // メンバーが1人もいなければ、その旨を出します
    $('obiMembers').classList.toggle('on',
      YY.master.membersLoaded && !YY.master.workers.length && S.tab !== 'members');

    var b = $('body');
    b.innerHTML = '';
    b.className = (S.tab === 'plan') ? 'plan' : '';
    if (S.tab === 'check') renderCheck(b);
    else if (S.tab === 'line') renderLine(b);
    else if (S.tab === 'members') renderMembers(b);
    else renderPlan(b);

    // 工事やメンバーの吹き出しを開いている最中に描き直しが入ったら、位置を合わせ直します
    if (S.editJob) {
      if (S.tab === 'plan' || S.editJob === '__member__') positionJobPop();
      else closeJobPop();
    }
  }

  /* =================================================================
     画面1「予定を組む」
     ================================================================= */
  function renderPlan(b) {
    b.appendChild(weekNav());
    b.appendChild(catTabs());
    b.appendChild(filterBar());

    var days = YY.weekDates(S.monday);
    var st = {};    // 日付 → 状態(余/重複/休み)
    days.forEach(function (d) { st[d] = YY.computeDay(S.week, d); });

    var wrap = document.createElement('div');
    wrap.className = 'gridwrap';
    var g = document.createElement('div');
    g.className = 'grid';

    // 見出しの行
    g.appendChild(el('div', 'corner', '工事' + (isPC() ? '(注番)' : '')));
    days.forEach(function (d, i) {
      var c = 'hd' + (YY.isToday(d) ? ' today' : '') + (i === 5 ? ' sat' : '') + (i === 6 ? ' sun' : '');
      var dt = YY.parseKey(d);
      g.appendChild(el('div', c, '<b>' + YY.DOW[i] + '</b> <span>' +
        (dt.getMonth() + 1) + '/' + dt.getDate() + '</span>'));
    });

    // 休み行(いちばん上に固定)
    g.appendChild(el('div', 'rest', '休み'));
    days.forEach(function (d) { g.appendChild(restCell(d, st[d])); });

    // 🟡 余 行(PCのみ・読み取り専用)
    if (isPC()) {
      var yh = el('div', 'yohd', '<span>🟡 余</span>');
      var tg = document.createElement('button');
      tg.className = 'tg';
      tg.textContent = S.yoOpen ? '▴' : '▾';
      tg.title = S.yoOpen ? '余っている人をたたむ' : '余っている人をひらく';
      tg.addEventListener('click', function () { S.yoOpen = !S.yoOpen; render(); });
      yh.appendChild(tg);
      g.appendChild(yh);
      days.forEach(function (d) { g.appendChild(yoCell(st[d])); });
    }

    // 工事の行
    var used = usedJobIds();
    var cats = (S.cat === 'all') ? YY.CATEGORIES.order : [S.cat];
    var any = false;
    cats.forEach(function (cat) {
      var jobs = YY.jobsByCat(cat, used);
      // 「使う工事だけ」= その週に1人でも入っている工事だけ
      if (S.onlyUsed) jobs = jobs.filter(function (j) { return jobInUse(j, used); });
      if (S.cat === 'all') {
        g.appendChild(el('div', 'cathd', esc(YY.CATEGORIES.labels[cat])));
      }
      jobs.forEach(function (j, i) {
        any = true;
        g.appendChild(jobCell(j, i, jobs.length, used));
        days.forEach(function (d) { g.appendChild(planCell(j.id, d, st[d])); });
      });
      // カテゴリごとの一番下に置きます(絞り込みに関わらず、いつでも出します)
      g.appendChild(addJobRow(cat));
    });

    wrap.appendChild(g);
    b.appendChild(wrap);

    if (!any) {
      if (S.onlyUsed && YY.master.jobs.length) {
        // 工事はあるが、この週は誰も入っていないので隠れている状態
        var msg = el('div', 'soon',
          '<div class="e">📋</div>この週は、まだ誰も入っていません<br>' +
          '<span style="font-size:14px">「すべて」に切り替えると工事を選べます</span>');
        var sw = document.createElement('button');
        sw.className = 'toggle add';
        sw.style.marginTop = '14px';
        sw.textContent = 'すべての工事を出す';
        sw.addEventListener('click', function () { S.onlyUsed = false; render(); });
        msg.appendChild(sw);
        b.appendChild(msg);
      } else {
        b.appendChild(el('div', 'soon',
          '<div class="e">📋</div>まだ工事がありません<br>' +
          '<span style="font-size:14px">表の下の「＋ 工事を追加」から起こしてください</span>'));
      }
    }

    if (!isPC()) b.appendChild(el('div', 'guide', '◀ 横にスワイプで 木・金・土・日 ▶'));
    b.appendChild(el('div', 'legend',
      '<span class="nm"><span class="sc">◎</span>=職長</span>' +
      '<span style="color:var(--moji)">■ 自社</span>' +
      '<span style="color:var(--kyoryoku)">■ 協力会社</span>'));
  }

  function weekNav() {
    var lb = YY.weekLabel(S.monday);
    var w = el('div', 'weeknav',
      '<button data-w="-1">◀</button>' +
      '<button class="now" data-w="0">今週</button>' +
      '<div class="lbl"><b>' + lb.range + '</b><span>' + lb.year + '</span></div>' +
      '<button data-w="1">▶</button>');
    Array.prototype.forEach.call(w.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { goWeek(+b.getAttribute('data-w')); });
    });
    return w;
  }

  function catTabs() {
    var c = el('div', 'cats', '');
    var list = [];
    if (isPC()) list.push({ k: 'all', l: 'すべて' });
    YY.CATEGORIES.order.forEach(function (n) {
      list.push({ k: n, l: YY.CATEGORIES.labels[n] });
    });
    list.forEach(function (it) {
      var b = document.createElement('button');
      b.textContent = it.l;
      if (S.cat === it.k) b.className = 'on';
      b.addEventListener('click', function () { S.cat = it.k; render(); });
      c.appendChild(b);
    });
    return c;
  }

  /** 2026-09-01 → 9/1 */
  function mdLabel(dateKey) {
    if (!dateKey) return '';
    var d = YY.parseKey(dateKey);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  /** 「使う工事だけ」で出す条件:その週に人が入っている、または開始日が来ている */
  function jobInUse(j, used) {
    return YY.jobVisible(j, {
      usedNow: !!used[j.id],
      usedPrev: !!prevUsed()[j.id],
      shown: !!(S.week.show || {})[j.id],
      monday: S.monday
    });
  }

  /** 先週に人が入っていた工事id。先週を読めていなければ空です */
  function prevUsed() {
    if (!S.prevWeek) return {};
    if (S._prevUsedCache && S._prevUsedFor === S.prevMondayKey) return S._prevUsedCache;
    S._prevUsedCache = YY.usedJobsInWeek(S.prevWeek);
    S._prevUsedFor = S.prevMondayKey;
    return S._prevUsedCache;
  }

  /**
   * 「使う工事だけ / すべて」の切り替え。
   * 工事が増えると縦に長くなるので、既定はその週に人が入っている工事だけです。
   */
  function filterBar() {
    var used = usedJobIds();
    var cats = (S.cat === 'all') ? YY.CATEGORIES.order : [S.cat];
    var shown = 0, hidden = 0;
    cats.forEach(function (cat) {
      YY.jobsByCat(cat, used).forEach(function (j) {
        if (jobInUse(j, used)) shown++; else hidden++;
      });
    });

    var bar = el('div', 'filterbar', '');
    var seg = el('div', 'seg', '');
    [{ k: true, l: '使う工事だけ' }, { k: false, l: 'すべて' }].forEach(function (it) {
      var b2 = document.createElement('button');
      b2.textContent = it.l;
      if (S.onlyUsed === it.k) b2.className = 'on';
      b2.addEventListener('click', function () { S.onlyUsed = it.k; render(); });
      seg.appendChild(b2);
    });
    bar.appendChild(seg);

    // 3つ目はパネルを開く操作です(表示の切り替えではありません)
    var pk = document.createElement('button');
    pk.className = 'pick2';
    pk.textContent = '⧉ 前に使った工事';
    pk.addEventListener('click', function (e) { e.stopPropagation(); openPastPop(); });
    bar.appendChild(pk);

    var msg = '';
    if (S.onlyUsed) {
      msg = hidden
        ? '<b>' + hidden + '件</b>を隠しています(この週は誰も入っていません)'
        : 'この週に使う工事だけ出ています';
    } else {
      msg = '全' + (shown + hidden) + '件を出しています(この週に人が入っているのは ' + shown + '件)';
    }
    bar.appendChild(el('div', 'fmsg', msg));
    return bar;
  }

  /** 予定に出てくる工事id(非表示にしていても、人が入っていれば表に残すため) */
  function usedJobIds() {
    var u = {};
    var a = S.week.assign || {};
    Object.keys(a).forEach(function (id) {
      // その週のどこかに1人でも入っていれば「使用中」
      var days = a[id] || {};
      var has = Object.keys(days).some(function (d) {
        var c = days[d] || {};
        return Object.keys(c.members || {}).length > 0 || (c.extras || []).length > 0;
      });
      if (has) u[id] = true;
    });
    return u;
  }

  /* --- 工事名のセル(クリックで表示名を直せます) --------------------- */

  /**
   * 工事名のセル。クリックで編集の吹き出しが開きます。
   * 注番は【入っているときだけ】行を出します(空欄で行を使いません)。
   */
  function jobCell(j, idx, total, used) {
    var c = el('div', 'job', '');
    // 開始日が来ているのに、その週まだ誰も入っていない工事
    var waiting = !(used || {})[j.id] && YY.jobStartsInWeek(j, S.monday);
    c.setAttribute('data-job', j.id);
    c.setAttribute('data-idx', idx);
    c.setAttribute('data-total', total);

    c.innerHTML = '<div class="n">' + esc(j.name) + '</div>' +
      (j.no ? '<div class="no">' + esc(j.no) + '</div>' : '') +
      (waiting ? '<div class="waiting">' + esc(mdLabel(j.start)) + ' 開始・まだ人なし</div>' : '') +
      // 「隠す」にしたのに表にある工事は、その理由をはっきり出します
      (!j.active
        ? '<div class="kept">' +
          '<div class="badge">予定が入っているため表示中</div>' +
          '<div class="why">予定を空にすると表から消えます</div>' +
          '</div>'
        : '');
    c.title = j.name + (j.no ? '(' + j.no + ')' : '') +
      (!j.active ? '\nこの工事は「表から隠す」にしていますが、予定が入っているので表示しています' : '') +
      '\nクリックで工事を直せます';
    c.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!S.online) { toast('電波が届いていません'); return; }
      openJobPop(j.id);
    });
    return c;
  }

  /** カテゴリの一番下に置く「＋ 工事を追加」の行 */
  function addJobRow(cat) {
    var c = el('div', 'addjob', '');
    c.style.gridColumn = '1 / -1';
    var b = document.createElement('button');
    b.innerHTML = '＋ 工事を追加' +
      (S.cat === 'all' ? ' <span>' + esc(YY.CATEGORIES.labels[cat]) + '</span>' : '');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!S.online) { toast('電波が届いていません'); return; }
      openJobPop(null, cat);       // 新規。いま見ているカテゴリが初期選択です
    });
    c.appendChild(b);
    return c;
  }

  /* =================================================================
     工事の呼び名を直す吹き出し
     ================================================================= */

  /**
   * 工事の追加・編集の吹き出し。表の幅に縛られません。
   *   jobId が null … 新規追加(cat が初期選択のカテゴリ)
   *   jobId あり     … その工事を直す
   */
  function openJobPop(jobId, cat) {
    var isNew = !jobId;
    var j = isNew ? null : YY.master.jobById[jobId];
    if (!isNew && !j) { toast('その工事が見つかりません'); return; }

    S.editJob = jobId || '__new__';
    S.editCat = isNew ? (cat || (S.cat === 'all' ? 1 : S.cat)) : j.category;
    S.editNewCat = cat || null;

    var pop = $('jobpop');
    pop.innerHTML = '';
    pop.appendChild(el('div', 'arrow', ''));

    var inr = el('div', 'in', '');
    inr.appendChild(el('div', 'ttl', isNew ? '工事の追加' : '工事の編集'));
    inr.appendChild(el('hr', '', ''));

    /* 工事名 */
    var f1 = el('div', 'fld', '<div class="lb">工事名</div>');
    var inName = document.createElement('input');
    inName.type = 'text';
    inName.maxLength = YY.JOB_NAME_MAX;
    inName.value = isNew ? '' : j.name;
    inName.placeholder = '例:チタン調整槽ポンプカップリングカバー';
    f1.appendChild(inName);
    inr.appendChild(f1);
    if (!isNew) {
      inr.appendChild(el('div', 'fld',
        '<div class="lb"></div><div class="note">空にして決定すると、この工事を削除します</div>'));
    }

    /* 注番(任意) */
    var f2 = el('div', 'fld', '<div class="lb">注番<small>(任意)</small></div>');
    var inNo = document.createElement('input');
    inNo.type = 'text';
    inNo.className = 'sub';
    inNo.maxLength = YY.JOB_NO_MAX;
    inNo.value = isNew ? '' : (j.no || '');
    inNo.placeholder = '空のままで登録できます';
    f2.appendChild(inNo);
    inr.appendChild(f2);

    /* 開始日(任意) */
    var f2b = el('div', 'fld', '<div class="lb">開始日<small>(任意)</small></div>');
    var inStart = document.createElement('input');
    inStart.type = 'date';
    inStart.className = 'sub';
    inStart.value = isNew ? '' : (j.start || '');
    f2b.appendChild(inStart);
    inr.appendChild(f2b);
    inr.appendChild(el('div', 'fld',
      '<div class="lb"></div><div class="note">' +
      '入れておくと、その日が来た週から「使う工事だけ」でも表に出ます' +
      '</div>'));

    /* カテゴリ */
    var f3 = el('div', 'fld', '<div class="lb">カテゴリ</div>');
    var cbox = el('div', 'cats2', '');
    YY.CATEGORIES.order.forEach(function (n) {
      var b = document.createElement('button');
      b.textContent = YY.CATEGORIES.labels[n];
      b.className = (S.editCat === n) ? 'on' : '';
      b.addEventListener('click', function () {
        S.editCat = n;
        Array.prototype.forEach.call(cbox.children, function (x) {
          x.className = (x === b) ? 'on' : '';
        });
      });
      cbox.appendChild(b);
    });
    f3.appendChild(cbox);
    inr.appendChild(f3);

    /* 並べ替えと非表示(直すときだけ) */
    if (!isNew) {
      inr.appendChild(el('hr', '', ''));
      var anchor = document.querySelector('.grid .job[data-job="' + jobId + '"]');
      var idx = anchor ? +anchor.getAttribute('data-idx') : 0;
      var total = anchor ? +anchor.getAttribute('data-total') : 1;

      var tools = el('div', 'tools', '');
      var up = document.createElement('button');
      up.innerHTML = '↑ 上へ'; up.disabled = idx <= 0;
      up.addEventListener('click', function () { doMove(jobId, -1); });
      var dn = document.createElement('button');
      dn.innerHTML = '↓ 下へ'; dn.disabled = idx >= total - 1;
      dn.addEventListener('click', function () { doMove(jobId, 1); });
      var hide = document.createElement('button');
      hide.className = 'hide' + (j.active ? '' : ' on');
      hide.textContent = j.active ? '表から隠す' : '表に出す';
      hide.addEventListener('click', function () {
        YY.setJobActive(jobId, !j.active).then(function () {
          toast(j.active ? '表から隠しました' : '表に出しました');
          closeJobPop();
        }).catch(function (e) { toast('切り替えできませんでした:' + e.message); });
      });
      // 先週から1行まるごと持ってきます
      var cp = document.createElement('button');
      var srcN = lastWeekCount(jobId);
      cp.className = 'copyw';
      cp.innerHTML = '⧉ 先週からコピー' +
        (srcN > 0 ? ' <span>' + srcN + 'マス</span>' : srcN === 0 ? ' <span>先週は空</span>' : '');
      cp.disabled = (srcN === 0);
      cp.addEventListener('click', function () { copyRowFromLastWeek(jobId); });

      tools.appendChild(up); tools.appendChild(dn); tools.appendChild(hide);
      inr.appendChild(tools);
      inr.appendChild(cp);
      inr.appendChild(el('div', 'note',
        '隠した工事も、その週に人が入っていれば表に残ります。データは消えません'));
    }

    var err = el('div', 'err', '');
    err.style.display = 'none';
    inr.appendChild(err);

    inr.appendChild(el('hr', '', ''));
    var btns = el('div', 'btns', '');
    var bNo = document.createElement('button');
    bNo.textContent = 'やめる';
    bNo.addEventListener('click', closeJobPop);
    var bOk = document.createElement('button');
    bOk.className = 'ok'; bOk.textContent = '決定';
    bOk.addEventListener('click', submit);
    btns.appendChild(bNo); btns.appendChild(bOk);
    pop.appendChild(inr);
    pop.appendChild(btns);   // ボタンは下に固定します(中身と一緒にスクロールさせません)

    function submit() {
      var nm = (inName.value || '').trim();

      // 工事名を空にして決定 = 削除(新規はまだ何も無いので、いままでどおり注意だけ)
      if (!nm) {
        if (isNew) {
          err.textContent = '工事名を入れてください';
          err.style.display = '';
          inName.focus();
          return;
        }
        removeJob(jobId, j.name);
        return;
      }

      var no = (inNo.value || '').trim();
      var st = (inStart.value || '').trim();
      var cat = S.editCat;
      closeJobPop();
      if (isNew) {
        YY.addJob(nm, cat, no, st).then(function () {
          toast('「' + nm + '」を追加しました');
        }).catch(function (e) { toast('追加できませんでした:' + e.message); });
      } else {
        YY.updateJob(jobId, { name: nm, no: no, start: st, category: cat }).then(function () {
          toast('工事を直しました');
        }).catch(function (e) { toast('直せませんでした:' + e.message); });
      }
    }

    [inName, inNo, inStart].forEach(function (x) {
      x.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        if (e.key === 'Escape') { e.preventDefault(); closeJobPop(); }
      });
    });

    $('popmask').classList.add('on');
    pop.classList.add('on');
    positionJobPop();
    inName.focus();
    inName.setSelectionRange(inName.value.length, inName.value.length);
  }

  /**
   * 工事を消します。予定が入っている場合は、それも消えることを伝えてから。
   * 記録を残したいときは「表から隠す」を案内します。
   */
  function removeJob(jobId, name) {
    YY.jobUsage(jobId).then(function (u) {
      var msg = u.cells
        ? '「' + name + '」には予定が入っています。\n' +
          '削除すると、その予定もすべて消えます。\n' +
          '記録を残したい場合は「表から隠す」を使ってください。\n\n' +
          '本当に削除しますか?'
        : '「' + name + '」を削除しますか?';
      if (!confirm(msg)) return;

      closeJobPop();
      YY.deleteJob(jobId).then(function (res) {
        toast('「' + name + '」を削除しました' +
          (res.cells ? '(予定 ' + res.cells + 'マスも消しました)' : ''));
      }).catch(function (e) {
        toast('削除できませんでした:' + (e && e.message ? e.message : ''));
      });
    }).catch(function (e) {
      toast('調べられませんでした:' + (e && e.message ? e.message : ''));
    });
  }

  /* =================================================================
     先週からのコピー
       ・その日すでに別の工事(や休み)に入っている人は自動で外します
       ・しるし(◎△☆✕)と選んだ順はそのまま持ってきます
     ================================================================= */

  /** 先週の同じ曜日の日付 */
  function prevDate(dateKey) { return YY.toKey(YY.addDays(dateKey, -7)); }

  /**
   * 先週のセルを、この週へ持ってこられる形に整えます。
   * 戻り値 { members, extras, count, dropped:[外した名前] }
   */
  function fromLastWeek(jobId, dateKey) {
    var src = YY.cellOf(S.prevWeek || { assign: {} }, jobId, prevDate(dateKey));
    var day = YY.computeDay(S.week, dateKey);
    var members = {}, dropped = [], n = 0;

    Object.keys(src.members).forEach(function (name) {
      var where = day.placements[name] || [];
      // その日ほかの行(工事・休み)に入っている人は連れてきません
      if (where.some(function (k) { return k !== jobId; })) { dropped.push(name); return; }
      members[name] = {
        mark: (src.members[name] || {}).mark || '',
        ord: (typeof (src.members[name] || {}).ord === 'number') ? src.members[name].ord : n
      };
      n++;
    });

    var extras = src.extras.slice();
    return { members: members, extras: extras, count: n + extras.length, dropped: dropped };
  }

  /** 先週のその工事に、何マス入っているか */
  function lastWeekCount(jobId) {
    if (!S.prevWeek) return -1;                  // まだ読めていません
    var n = 0;
    YY.weekDates(S.monday).forEach(function (d) {
      if (YY.cellCount(S.prevWeek, jobId, prevDate(d))) n++;
    });
    return n;
  }

  /** 【A】工事1行ぶん(月〜日)を先週から持ってきます */
  function copyRowFromLastWeek(jobId) {
    if (!S.online) { toast('電波が届いていません'); return; }
    var name = YY.jobLabel(jobId).name;
    var src = lastWeekCount(jobId);
    if (src < 0) { toast('先週を読み込み中です。少し待ってください'); return; }
    if (src === 0) { alert('先週の「' + name + '」は空です。\nコピーするものがありません。'); return; }

    if (!confirm('先週の「' + name + '」の予定(月〜日 ' + src + 'マス)を、\n' +
      'この週にコピーしますか?\n\n' +
      'すでに入っているセルは、そのまま残します。')) return;

    var jobs = [], copied = 0, kept = 0, dropped = {};
    YY.weekDates(S.monday).forEach(function (d) {
      if (!YY.cellCount(S.prevWeek, jobId, prevDate(d))) return;   // 先週が空の日
      if (YY.cellCount(S.week, jobId, d)) { kept++; return; }      // すでに入っている

      var c = fromLastWeek(jobId, d);
      c.dropped.forEach(function (x) { dropped[x] = true; });
      if (!c.count) return;
      jobs.push(YY.saveCell(S.monday, jobId, d, { members: c.members, extras: c.extras }));
      copied++;
    });

    if (!jobs.length) {
      toast(kept ? kept + 'マスは既に入っていたので、そのままです' : 'コピーするものがありませんでした');
      return;
    }

    closeJobPop();
    Promise.all(jobs).then(function () {
      var msg = copied + 'マスをコピーしました';
      if (kept) msg += '(' + kept + 'マスは既に入っていたのでそのまま)';
      var d2 = Object.keys(dropped);
      if (d2.length) msg += ' / ' + d2.length + '名は既に別の工事に入っていたので外しました';
      toast(msg);
    }).catch(function (e) {
      toast('コピーできませんでした:' + (e && e.message ? e.message : ''));
    });
  }

  function doMove(jobId, dir) {
    YY.moveJob(jobId, dir).then(function (moved) {
      if (moved) toast(dir < 0 ? '上へ動かしました' : '下へ動かしました');
      closeJobPop();
    }).catch(function (e) { toast('動かせませんでした:' + e.message); });
  }

  function closeJobPop() {
    S.editJob = null;
    $('jobpop').classList.remove('on');
    $('popmask').classList.remove('on');
  }

  /** 工事名を指す位置に吹き出しを置きます。画面からはみ出さないよう寄せます */
  function positionJobPop() {
    if (!S.editJob) return;
    var pop = $('jobpop');
    var anchor;
    if (S.editJob === '__member__') {
      anchor = S.memPop && S.memPop.anchor;
      // 一覧が描き直されると要素が入れ替わるので、探し直します
      if (anchor && !document.body.contains(anchor) && S.memPop.id) {
        anchor = document.querySelector('.wrow[data-member="' + S.memPop.id + '"]');
      }
    } else if (S.editJob === '__new__') {
      // 新規は、押した「＋ 工事を追加」を指します
      var rows = document.querySelectorAll('.addjob');
      var n = (S.cat === 'all' && S.editNewCat) ? YY.CATEGORIES.order.indexOf(S.editNewCat) : 0;
      anchor = rows[n] || rows[0];
    } else {
      anchor = document.querySelector('.grid .job[data-job="' + S.editJob + '"]');
    }
    if (!anchor) { closeJobPop(); return; }

    var a = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var pad = 12;
    var vh = window.innerHeight;
    var gap = 10;

    /* 縦の置き場所を、この順で決めます。
         1) 下に入るなら下
         2) 入らなければ上
         3) どちらにも入らなければ、画面に収まる位置へずらす
            (このときは三角が相手を指せないので消します)              */
    var fitsBelow = (a.bottom + gap + ph) <= (vh - pad);
    var fitsAbove = (a.top - gap - ph) >= pad;
    var top, below, noarrow = false;

    if (fitsBelow) {
      below = true; top = a.bottom + gap;
    } else if (fitsAbove) {
      below = false; top = a.top - gap - ph;
    } else {
      below = true;
      top = Math.max(pad, Math.min(a.bottom + gap, vh - ph - pad));
      noarrow = true;
    }

    pop.classList.toggle('below', below);
    pop.classList.toggle('above', !below);
    pop.classList.toggle('noarrow', noarrow);
    pop.style.top = top + 'px';

    // 左ぞろえ。右にはみ出すなら左へ寄せます(ノッチの幅も避けます)
    var sf = safeLR();
    var left = Math.min(a.left, window.innerWidth - pw - pad - sf.r);
    left = Math.max(pad + sf.l, left);
    pop.style.left = left + 'px';

    // 三角は工事名の真ん中を指します
    var ar = pop.querySelector('.arrow');
    if (ar && !noarrow) {
      var cx = a.left + a.width / 2 - left - 7;
      ar.style.left = Math.max(14, Math.min(pw - 28, cx)) + 'px';
    }
  }


  /* --- セル ------------------------------------------------------- */

  function planCell(jobKey, dateKey, day) {
    var b = document.createElement('button');
    b.className = 'cell' + (YY.isToday(dateKey) ? ' today' : '');
    var d = YY.displayCell(S.week, jobKey, dateKey);

    if (d.count === 0) {
      b.classList.add('empty');
      b.innerHTML = '＋';
    } else {
      b.innerHTML = cellInner(d, day, jobKey);
    }
    b.addEventListener('click', function () { openSheet(jobKey, dateKey); });
    return b;
  }

  function restCell(dateKey, day) {
    var b = document.createElement('button');
    b.className = 'cell rest' + (YY.isToday(dateKey) ? ' today' : '');
    var d = YY.displayCell(S.week, YY.REST_KEY, dateKey);
    if (d.count === 0) {
      b.classList.add('empty');
      b.textContent = '—';
    } else {
      b.innerHTML = joinNames(d.rows.map(function (r) { return nameHTML(r, day, YY.REST_KEY); })
        .concat(d.extras.map(function (x) { return '<span class="nm">' + esc(x) + '</span>'; }))) +
        '<div class="cnt">' + d.count + '名</div>';
    }
    b.addEventListener('click', function () { openSheet(YY.REST_KEY, dateKey); });
    return b;
  }

  /**
   * その日の「余」(計算で出すだけ。押しても何も起きません)
   * たたんでいるとき = 人数だけ。ひらいたとき = 名前を並べます
   */
  function yoCell(day) {
    var d = document.createElement('div');
    var names = day.free;

    if (!S.yoOpen) {
      d.className = 'yo closed';
      d.innerHTML = names.length
        ? '<div class="big">' + names.length + '名</div>'
        : '<div class="none">—</div>';
      d.title = names.length ? names.join('・') : '';
      return d;
    }

    d.className = 'yo';
    if (!names.length) { d.innerHTML = '<div class="none">—</div>'; return d; }
    d.innerHTML = joinNames(names.map(function (n) {
      return '<span class="nm' + (YY.isCoop(n) ? ' coop' : '') + '">' + esc(n) + '</span>';
    })) + '<div class="cnt">' + names.length + '名</div>';
    return d;
  }

  /**
   * 名前をつなぎます。
   *   PC   … Excelと同じ「・」区切り(中点は名前より薄い色)
   *   スマホ … 1人1行なので改行のまま
   */
  function joinNames(list) {
    return list.join(isPC() ? '<span class="sep">・</span>' : '<br>');
  }

  function cellInner(d, day, jobKey) {
    var all = d.rows.map(function (r) { return nameHTML(r, day, jobKey); })
      .concat(d.extras.map(function (x) { return '<span class="nm">' + esc(x) + '</span>'; }));
    var lim = 5;
    var shown = all.slice(0, lim);
    var more = all.length - shown.length;
    return joinNames(shown) +
      (more > 0 ? '<div class="more">+ほか' + more + '名</div>' : '') +
      '<div class="cnt">' + d.count + '名</div>';
  }

  /** 1人ぶんの表示。しるしは名前の直前に、色付きで出します */
  function nameHTML(row, day, jobKey) {
    var dup = day && day.placements[row.name] && day.placements[row.name].length >= 2;
    var mk = row.mark ? '<span class="sc">' + esc(row.mark) + '</span>' : '';
    return '<span class="nm' + (row.coop ? ' coop' : '') + '">' + mk +
      '<span class="' + (dup ? 'nm dup' : '') + '">' + esc(row.name) + '</span></span>';
  }

  /* =================================================================
     選択シート
     ================================================================= */

  function openSheet(jobKey, dateKey) {
    if (!S.online) { toast('電波が届いていません'); return; }

    var c = YY.cellOf(S.week, jobKey, dateKey);
    var members = {};
    Object.keys(c.members).forEach(function (n) {
      members[n] = { mark: (c.members[n] || {}).mark || '', ord: (c.members[n] || {}).ord };
    });
    // ord が無い古いデータには、いまの並びで番号を振り直します
    var i = 0;
    Object.keys(members).forEach(function (n) {
      if (typeof members[n].ord !== 'number') members[n].ord = i;
      i++;
    });

    S.sheet = {
      jobKey: jobKey, dateKey: dateKey,
      members: members,
      extras: c.extras.slice(),
      moves: [],       // よそのセルから連れてくる人 [{jobKey,dateKey,name}]
      day: null        // その日の状態(チップの色を決めるのに使います)
    };
    refreshSheet();
    $('mask').classList.add('on');
    $('sheet').classList.add('on');
  }

  function closeSheet() {
    closeMarkPop();
    S.sheet = null;
    $('mask').classList.remove('on');
    $('sheet').classList.remove('on');
  }

  function refreshSheet() {
    var sh = S.sheet; if (!sh) return;
    var day = YY.computeDay(S.week, sh.dateKey);
    var lab = YY.jobLabel(sh.jobKey);
    var box = $('sheet');
    // 組み直すときも、見ていた位置に戻します
    var keepTop = (box.querySelector('.sb') || {}).scrollTop || 0;
    box.innerHTML = '';

    // ヘッダー
    box.appendChild(el('div', 'sh',
      '<div class="j">' + esc(lab.name) + '</div>' +
      '<div class="d">' + YY.dayLabel(sh.dateKey) + ' タップして選んでください</div>'));

    var body = el('div', 'sb', '');

    // 前日と同じにする
    var prev = YY.toKey(YY.addDays(sh.dateKey, -1));
    var pc = YY.displayCell(S.week, sh.jobKey, prev);
    var pb = document.createElement('button');
    pb.className = 'copyprev';
    var pnames = pc.rows.map(function (r) { return YY.nameWithMarks(r); }).concat(pc.extras);
    pb.innerHTML = '⧉ 前日(' + YY.DOW[YY.dowIndex(prev)] + ')と同じにする' +
      (pnames.length ? ' <span>' + esc(pnames.slice(0, 4).join('・')) +
        (pnames.length > 4 ? ' ほか' : '') + '</span>' : '');
    pb.disabled = pc.count === 0;
    pb.addEventListener('click', function () {
      var src = YY.cellOf(S.week, sh.jobKey, prev);
      sh.members = {};
      Object.keys(src.members).forEach(function (n) {
        sh.members[n] = { mark: (src.members[n] || {}).mark || '', ord: (src.members[n] || {}).ord || 0 };
      });
      sh.extras = src.extras.slice();
      sh.moves = [];               // 入れ替わるので、連れてくる予約は取り消します
      refreshSheet();
    });
    body.appendChild(pb);

    /* 【B】先週の同じ曜日から、このセルだけ持ってきます */
    var lwDow = YY.DOW[YY.dowIndex(sh.dateKey)];
    var lwSrc = S.prevWeek ? YY.displayCell(S.prevWeek, sh.jobKey, prevDate(sh.dateKey)) : null;
    var lw = document.createElement('button');
    lw.className = 'copyprev';
    lw.innerHTML = '⧉ 先週の' + lwDow + '曜からコピー' +
      (lwSrc && lwSrc.count
        ? ' <span>' + esc(lwSrc.rows.map(YY.nameWithMarks).concat(lwSrc.extras).slice(0, 4).join('・')) +
          (lwSrc.count > 4 ? ' ほか' : '') + '</span>'
        : (!S.prevWeek ? ' <span>読み込み中…</span>' : ' <span>先週は空</span>'));
    lw.disabled = !lwSrc || !lwSrc.count;
    lw.addEventListener('click', function () {
      var c = fromLastWeek(sh.jobKey, sh.dateKey);
      sh.members = c.members;
      sh.extras = c.extras;
      sh.moves = [];
      refreshSheet();
      if (c.dropped.length) {
        toast(c.dropped.length + '名は既に別の工事に入っていたので外しました:' + c.dropped.join('・'));
      } else {
        toast('先週の' + lwDow + '曜から入れました。「きめる」で確定します');
      }
    });
    body.appendChild(lw);

    /* --- 名前は1か所だけ。状態は見た目で分けます -----------------------
       白      … 余っている(そのまま選べる)
       緑      … いま選んでいる
       灰の破線 … その日ほかの工事に入っている(→行き先)
       灰      … その日休み(→休み)
       並び順は名簿順で固定。選んでもチップは動きません
       ------------------------------------------------------------------- */
    sh.day = day;
    var g1 = el('div', 'grp yo',
      '<div class="gt">🟡 だれを入れますか<span id="yoSum" class="sum"></span></div>');
    var c1 = el('div', 'chips', '');
    var listed = YY.selectableWorkers(sh.members);
    sh.listed = listed;
    listed.forEach(function (w) { c1.appendChild(pickChip(w.name, w.unknown)); });
    if (!listed.length) {
      c1.innerHTML = '<div style="font-size:14px;color:#8a6516">' +
        'メンバーが登録されていません</div>';
    }
    g1.appendChild(c1);

    var unknownN = listed.filter(function (w) { return w.unknown; }).length;
    g1.appendChild(el('div', 'ghint',
      '灰色=その日すでに行き先がある人。タップすると移動を確かめます' +
      (unknownN ? '<br><b style="color:var(--ki)">オレンジの破線=名簿にない人(' +
        unknownN + '名)。同じ名前で登録するとつながります</b>' : '')));

    var fix = document.createElement('button');
    fix.className = 'fixlink';
    fix.textContent = '👥 名簿を直す';
    fix.addEventListener('click', function () {
      closeSheet();
      S.tab = 'members';
      Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
        x.classList.toggle('on', x.getAttribute('data-tab') === 'members');
      });
      render();
    });
    g1.appendChild(fix);
    body.appendChild(g1);

    // 名簿にない人
    var g4 = el('div', 'grp', '<div class="gt sub">名簿にない人(応援・臨時だけ手入力)</div>');
    var row = el('div', 'extra-row', '<input id="exIn" placeholder="例:山口(○○興業)" maxlength="40"><button id="exAdd">＋追加</button>');
    g4.appendChild(row);
    if (sh.extras.length) {
      var c4 = el('div', 'chips', '');
      c4.style.marginTop = '8px';
      sh.extras.forEach(function (x, i) {
        var b = document.createElement('button');
        b.className = 'chip on';
        b.innerHTML = esc(x) + ' ✕';
        b.addEventListener('click', function () { sh.extras.splice(i, 1); refreshSheet(); });
        c4.appendChild(b);
      });
      g4.appendChild(c4);
    }
    body.appendChild(g4);

    // いま何名
    body.appendChild(el('div', 'nowsel', '<span id="nowSel"></span>'));
    box.appendChild(body);

    closeMarkPop();
    updateCount();

    // フッター
    var f = el('div', 'sf',
      '<button class="btn-clear">空にする</button>' +
      '<button class="btn-cancel">やめる</button>' +
      '<button class="btn-ok">きめる</button>');
    f.querySelector('.btn-clear').addEventListener('click', function () {
      // 連れてくる予約も一緒に取り消します(元のセルを触らないため)
      sh.members = {}; sh.extras = []; sh.moves = [];
      refreshSheet();
    });
    f.querySelector('.btn-cancel').addEventListener('click', closeSheet);
    f.querySelector('.btn-ok').addEventListener('click', commitSheet);
    box.appendChild(f);

    // 名簿にない人の追加
    var inp = box.querySelector('#exIn');
    var add = function () {
      var v = (inp.value || '').trim();
      if (!v) return;
      sh.extras.push(v.slice(0, 40));
      refreshSheet();
      var i2 = $('sheet').querySelector('#exIn'); if (i2) i2.focus();
    };
    box.querySelector('#exAdd').addEventListener('click', add);
