<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4b34">
<title>よつば週間予定|予定を組む</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<link rel="stylesheet" href="hyou.css">
</head>
<body>

<div id="app">
  <div class="head">
    <div class="t" id="headTitle">📅 予定を組む</div>
    <a class="shukei pconly" href="shukei.html">📊 集計</a>
    <button class="tool xls pconly" id="btnXls">📥 Excel書き出し</button>
    <button class="tool line pconly" id="btnLine">💬 LINE用にコピー</button>
    <div class="s">よつば建設工業</div>
  </div>

  <div class="foldbar" id="foldBar"></div>

  <div class="obi offline" id="obiOffline">電波が届いていません。編集はできません</div>
  <div class="obi master" id="obiMembers">
    メンバーが登録されていません。下の「👥 メンバー」から登録してください
  </div>
  <div class="obi last" id="obiLast"></div>

  <div id="body"></div>

  <div class="tabs">
    <button data-tab="plan" class="on"><div class="i">📅</div><div class="l">予定を組む</div></button>
    <button data-tab="check"><div class="i">🔍</div><div class="l">チェック</div></button>
    <button data-tab="line"><div class="i">💬</div><div class="l">配信</div></button>
    <button data-tab="members"><div class="i">👥</div><div class="l">メンバー</div></button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div id="safeprobe"></div>
<div class="popmask" id="popmask"></div>
<div class="jobpop" id="jobpop"></div>
<div class="markmask" id="markmask"></div>
<div class="markpop" id="markpop"></div>
<div class="logmask" id="logmask"></div>
<div class="logpop" id="logpop"></div>
<div class="namemask" id="namemask"></div>
<div class="namepop" id="namepop"></div>
<div class="pastmask" id="pastmask"></div>
<div class="pastpop" id="pastpop"></div>
<div class="daymask" id="daymask"></div>
<div class="daypop" id="daypop"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';

  /* =================================================================
     状態
     ================================================================= */
  var S = {
    tab: 'plan',
    monday: YY.thisMonday(),
    cat: 1,              // 1 / 2 / 3 / 'all'(PCのみ)
    week: { assign: {} },
    online: true,
    restOpen: false,     // 「休み」行をひらいているか(既定はたたんだ状態)
    yoOpen: false,       // 「余」行をひらいているか(既定はたたんだ状態)
    unsubWeek: null,
    fold: false,         // スマホで上部をたたんでいるか
    log: null,           // 履歴の画面を開いている間の中身
    billed: {},          // 請求済み { 'YYYY-MM': { 工事id: true } }
    unsubBilled: [],     // 見張りを止める関数(週がまたぐと2つになります)
    prevMonday: null,    // 先週の月曜(コピー元)
    prevWeek: null,      // 先週のデータ。読めるまでは null
    nearBase: null,      // 直近の週を読んだときの基準
    nearWeeks: {},       // 直近4週ぶん(最後に人が入った日を調べます)
    nearLoaded: false,
    sheet: null,         // 選択シートの作業中の中身
    pickDate: null,      // チェック・配信で選んでいる日(共通)
    onlyUsed: true,
    past: null,          // 「前に使った工事」パネルの作業中の中身      // 予定を組む:その週に人が入っている工事だけ出すか
    markChip: null,      // しるしの吹き出しを出しているチップ
    editJob: null,       // 吹き出しで開いている工事id('__new__' なら新規)
    editCat: 1,          // その吹き出しで選んでいるカテゴリ
    editNewCat: null,    // 新規追加のとき、どのカテゴリの「＋」から開いたか
    gridKey: ''          // 表を最後に描いたときの「どの一覧か」。スクロール位置を戻す判定に使います
  };

  var $ = function (id) { return document.getElementById(id); };
  var isPC = function () { return window.matchMedia('(min-width:1024px)').matches; };

  /** iPhoneのノッチで隠れる左右の幅(px)。縦向きやノッチのない端末では 0 です。
      目に見えない箱に余白として描かせ、その幅を読み取っています。 */
  function safeLR() {
    var p = $('safeprobe');
    if (!p) return { l: 0, r: 0 };
    var cs = window.getComputedStyle(p);
    return { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
  }
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  };

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  /* =================================================================
     起動
     ================================================================= */
  function boot() {
    // PWA(manifest と ホーム画面アイコン)
    var icon = YY.iconDataUri(180);
    var link = document.createElement('link');
    link.rel = 'apple-touch-icon'; link.href = icon;
    document.head.appendChild(link);
    var fav = document.createElement('link');
    fav.rel = 'icon'; fav.href = YY.iconDataUri(64);
    document.head.appendChild(fav);
    var mf = {
      name: 'よつば週間予定(編集)', short_name: 'よつば予定',
      display: 'standalone', background_color: '#f5f1e8', theme_color: '#1c4b34',
      icons: [{ src: icon, sizes: '180x180', type: 'image/svg+xml' }]
    };
    var ml = document.createElement('link');
    ml.rel = 'manifest';
    ml.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/json' }));
    document.head.appendChild(ml);

    YY.init();

    // 接続の見張り
    YY.onConnection(function (on) {
      S.online = on;
      $('obiOffline').classList.toggle('on', !on);
    });

    // 工事とメンバー(追加・編集が全端末にその場で反映されます)
    YY.subscribeJobs(function () { render(); });
    YY.subscribeMembers(function () { render(); });

    watchWeek();

    // 下タブ
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.addEventListener('click', function () {
        S.tab = b.getAttribute('data-tab');
        Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
          x.classList.toggle('on', x === b);
        });
        closeSheet();
        render();
      });
    });

    $('mask').addEventListener('click', closeSheet);

    // PC版ツールバー
    $('btnXls').addEventListener('click', exportExcel);
    S.fold = getFold();          // 前に閉じたときの状態を思い出します
    $('logmask').addEventListener('click', closeLogPop);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && S.log) { e.preventDefault(); closeLogPop(); }
    });
    $('namemask').addEventListener('click', function () {
      // 名前がもう決まっているときだけ、外側を押して閉じられます
      if (YY.getOperator()) closeNamePop();
    });
    // まだ名前を決めていなければ、最初に1回だけ聞きます
    if (!YY.getOperator()) setTimeout(function () { openNamePop(true); }, 600);
    $('btnLine').addEventListener('click', function (e) {
      e.stopPropagation();
      openDayPop($('btnLine'));
    });

    // 吹き出し:外側をクリック / Esc で閉じます(保存しません)
    $('popmask').addEventListener('click', closeJobPop);
    $('markmask').addEventListener('click', closeMarkPop);
    $('daymask').addEventListener('click', closeDayPop);
    $('pastmask').addEventListener('click', closePastPop);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (S.past) closePastPop();
      else if (S.markChip) closeMarkPop();
      else if (S.editJob) closeJobPop();
      else closeDayPop();
    });
    // 画面が動いても、指している相手を追いかけます
    window.addEventListener('scroll', function () {
      positionJobPop();
      positionMarkPop();
    }, true);

    // スマホ⇔PCの切り替わりで組み直します
    window.addEventListener('resize', function () { render(); positionJobPop(); });
    var mq = window.matchMedia('(min-width:1024px)');
    if (mq.addEventListener) mq.addEventListener('change', function () { render(); });
    else if (mq.addListener) mq.addListener(function () { render(); });

    render();
  }

  /**
   * 表示中の週を購読しなおします。
   * あわせて直近の週を1回読みます。使いみちは2つです。
   *   ・先週からのコピー元、継続中の工事の判定
   *   ・「前に使った工事」パネルの一覧
   */
  /* --- 請求済み ---------------------------------------------------
     請求済みは「工事 × 月ごと」なので、いま出ている週が入っている月を
     見張ります。週が月をまたぐときは、2つの月ぶんを見ます。
     ----------------------------------------------------------------- */

  /** その週が入っている月。1つか2つ返します */
  function weekMonths() {
    var out = [], seen = {};
    YY.weekDates(S.monday).forEach(function (d) {
      var ym = d.slice(0, 7);
      if (!seen[ym]) { seen[ym] = true; out.push(ym); }
    });
    return out;
  }

  function watchBilled() {
    S.unsubBilled.forEach(function (f) { f(); });
    S.unsubBilled = [];
    S.billed = {};
    weekMonths().forEach(function (ym) {
      var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
      S.unsubBilled.push(YY.subscribeBilled(y, m, function (b) {
        S.billed[ym] = b || {};
        render();
      }));
    });
  }

  /**
   * 工事1件の請求済みの出し方。出さないときは null を返します。
   *   週が1つの月に収まる    … その月が請求ずみなら「請求済」
   *   週が月をまたぐとき
   *     両方とも請求ずみ     … 「請求済」
   *     片方だけ請求ずみ     … 「8月分 請求済」(どちらの分か分かるように)
   * こうすると、ただの「請求済」は「いま見えている週はぜんぶ請求ずみ」の意味
   * になり、月をまたいで半分だけのときと取り違えません。
   */
  function billedInfo(jobId) {
    var ms = weekMonths();
    var done = ms.filter(function (ym) { return (S.billed[ym] || {})[jobId]; });
    if (!done.length) return null;
    var nm = function (ym) { return (+ym.slice(5, 7)) + '月'; };
    if (done.length === ms.length) {
      return {
        label: '請求済',
        title: ms.map(nm).join('と') + 'の分は請求ずみです'
      };
    }
    var rest = ms.filter(function (ym) { return done.indexOf(ym) < 0; });
    return {
      label: nm(done[0]) + '分 請求済',
      title: nm(done[0]) + 'の分は請求ずみです(' + rest.map(nm).join('') + 'の分はまだです)'
    };
  }

  function watchWeek() {
    watchBilled();
    if (S.unsubWeek) S.unsubWeek();
    S.unsubWeek = YY.subscribeWeek(S.monday, function (w) {
      S.week = w;
      render();
      if (S.sheet) refreshSheet();   // シートを開いたまま他の人が編集したとき
    });

    var base = S.monday;
    var keys = [];
    for (var i = 1; i <= YY.JOB_KEEP_WEEKS; i++) keys.push(YY.addWeeks(base, -i));
    S.nearBase = base;
    S.nearWeeks = {};
    S.nearLoaded = false;
    S.prevWeek = null;
    S.prevMondayKey = YY.addWeeks(base, -1);
    S._prevUsedCache = null;
    S._prevUsedFor = null;

    Promise.all(keys.map(function (k) {
      return YY.loadWeek(k).then(function (w) { return { k: k, w: w }; });
    })).then(function (list) {
      if (S.nearBase !== base) return;   // 読んでいる間に週が動いたら捨てます
      var m = {};
      list.forEach(function (x) { m[x.k] = x.w; });
      S.nearWeeks = m;
      S.nearLoaded = true;
      S.prevWeek = m[S.prevMondayKey] || null;
      S._prevUsedCache = null;
      render();
      if (S.sheet) refreshSheet();
    });
  }

  /** 判定に使う週のまとまり(表示中の週 + 直近の週) */
  function nearWeeksAll() {
    var m = {};
    Object.keys(S.nearWeeks || {}).forEach(function (k) { m[k] = S.nearWeeks[k]; });
    m[S.monday] = S.week;
    return m;
  }

  function goWeek(n) {
    S.monday = (n === 0) ? YY.thisMonday() : YY.addWeeks(S.monday, n);
    closeSheet();
    watchWeek();
    render();
  }

  /** 前月(-1)・翌月(+1)の第1週(1日を含む週)へ飛びます */
  function goMonth(step) {
    S.monday = YY.moveMonth(S.monday, step);
    closeSheet();
    watchWeek();
    render();
  }

  /* =================================================================
     画面の描き分け
     ================================================================= */
  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-tab') === S.tab);
    });

    var head = {
      plan: '📅 予定を組む', check: '🔍 チェック',
      line: '💬 配信', members: '👥 メンバー'
    };
    $('headTitle').textContent = head[S.tab] || '';

    // メンバーが1人もいなければ、その旨を出します
    $('obiMembers').classList.toggle('on',
      YY.master.membersLoaded && !YY.master.workers.length && S.tab !== 'members');

    var b = $('body');

    /* 表のスクロール位置。
       予定を保存すると Firebase から届いた新しい中身で表を描き直すため、
       そのままだと毎回いちばん上に戻ってしまいます。
       同じ一覧(同じ週・カテゴリ・絞り込み)を描き直すときだけ、見ていた場所に戻します。
       週やカテゴリを変えたときは、今までどおり先頭から見せます。 */
    var gwKey = S.tab + '|' + S.monday + '|' + S.cat + '|' + S.onlyUsed;
    var gwOld = b.querySelector('.gridwrap');
    var gwPos = (gwOld && gwKey === S.gridKey)
      ? { top: gwOld.scrollTop, left: gwOld.scrollLeft } : null;
    S.gridKey = gwKey;

    b.innerHTML = '';
    b.className = (S.tab === 'plan') ? 'plan' : '';
    drawLastEdit();
    drawFoldBar();

    if (S.tab === 'check') renderCheck(b);
    else if (S.tab === 'line') renderLine(b);
    else if (S.tab === 'members') renderMembers(b);
    else renderPlan(b);

    // 覚えておいたスクロール位置に戻します(中身が短くなっていれば、そのぶん詰めて表示されます)
    if (gwPos) {
      var gwNew = b.querySelector('.gridwrap');
      if (gwNew) { gwNew.scrollTop = gwPos.top; gwNew.scrollLeft = gwPos.left; }
    }

    // 工事やメンバーの吹き出しを開いている最中に描き直しが入ったら、位置を合わせ直します
    if (S.editJob) {
      if (S.tab === 'plan' || S.editJob === '__member__') positionJobPop();
      else closeJobPop();
    }
  }

  /* =================================================================
     画面1「予定を組む」
     ================================================================= */
  function renderPlan(b) {
    b.appendChild(weekNav());
    b.appendChild(catTabs());
    b.appendChild(filterBar());

    var days = YY.weekDates(S.monday);
    var st = {};    // 日付 → 状態(余/重複/休み)
    days.forEach(function (d) { st[d] = YY.computeDay(S.week, d); });

    var wrap = document.createElement('div');
    wrap.className = 'gridwrap';
    var g = document.createElement('div');
    g.className = 'grid';

    // 見出しの行
    g.appendChild(el('div', 'corner', '工事' + (isPC() ? '(注番)' : '')));
    days.forEach(function (d, i) {
      var c = 'hd' + (YY.isToday(d) ? ' today' : '') + (i === 5 ? ' sat' : '') + (i === 6 ? ' sun' : '');
      var dt = YY.parseKey(d);
      g.appendChild(el('div', c, '<b>' + YY.DOW[i] + '</b> <span>' +
        (dt.getMonth() + 1) + '/' + dt.getDate() + '</span>'));
    });

    // 休み行(いちばん上に固定)。たためます
    var rh = el('div', 'rest resthd', '<span>休み</span>');
    rh.appendChild(rowToggle(S.restOpen, '休みの人', function () {
      S.restOpen = !S.restOpen; render();
    }));
    g.appendChild(rh);
    days.forEach(function (d) { g.appendChild(restCell(d, st[d])); });

    // 🟡 余 行(計算で出すだけ・読み取り専用)。たためます
    var yh = el('div', 'yohd', '<span>🟡 余</span>');
    yh.appendChild(rowToggle(S.yoOpen, '余っている人', function () {
      S.yoOpen = !S.yoOpen; render();
    }));
    g.appendChild(yh);
    days.forEach(function (d) { g.appendChild(yoCell(st[d])); });

    // 工事の行
    var used = usedJobIds();
    // 「週のすべて」は ②常駐・工場 → ①東レ工事 → ③外・出張ほか の順に出します
    var cats = (S.cat === 'all') ? YY.ALL_TAB_ORDER : [S.cat];
    var any = false;
    cats.forEach(function (cat) {
      var jobs = YY.jobsByCat(cat, used);
      // 「使う工事だけ」= その週に1人でも入っている工事だけ
      if (S.onlyUsed) jobs = jobs.filter(function (j) { return jobInUse(j, used); });
      if (S.cat === 'all') {
        g.appendChild(el('div', 'cathd', esc(YY.CATEGORIES.labels[cat])));
      }
      jobs.forEach(function (j, i) {
        any = true;
        g.appendChild(jobCell(j, i, jobs.length, used));
        days.forEach(function (d) { g.appendChild(planCell(j.id, d, st[d])); });
      });
      // カテゴリごとの一番下に置きます(絞り込みに関わらず、いつでも出します)
      g.appendChild(addJobRow(cat));
    });

    wrap.appendChild(g);
    b.appendChild(wrap);

    if (!any) {
      if (S.onlyUsed && YY.master.jobs.length) {
        // 工事はあるが、この週は誰も入っていないので隠れている状態
        var msg = el('div', 'soon',
          '<div class="e">📋</div>この週は、まだ誰も入っていません<br>' +
          '<span style="font-size:14px">「すべて」に切り替えると工事を選べます</span>');
        var sw = document.createElement('button');
        sw.className = 'toggle add';
        sw.style.marginTop = '14px';
        sw.textContent = 'すべての工事を出す';
        sw.addEventListener('click', function () { S.onlyUsed = false; render(); });
        msg.appendChild(sw);
        b.appendChild(msg);
      } else {
        b.appendChild(el('div', 'soon',
          '<div class="e">📋</div>まだ工事がありません<br>' +
          '<span style="font-size:14px">表の下の「＋ 工事を追加」から起こしてください</span>'));
      }
    }

    if (!isPC()) b.appendChild(el('div', 'guide', '◀ 横にスワイプで 木・金・土・日 ▶'));
    b.appendChild(el('div', 'legend',
      '<span class="nm"><span class="sc">◎</span>=職長</span>' +
      '<span style="color:var(--moji)">■ 自社</span>' +
      '<span style="color:var(--kyoryoku)">■ 協力会社</span>'));
  }

  function weekNav() {
    var lb = YY.weekLabel(S.monday);
    var w = el('div', 'weeknav',
      '<button data-w="-1" title="1週まえ">◀</button>' +
      '<button class="mv" data-m="-1" title="前の月の1日がある週へ">前月</button>' +
      '<button class="now" data-w="0">今週</button>' +
      '<button class="mv" data-m="1" title="次の月の1日がある週へ">翌月</button>' +
      '<div class="lbl"><b>' + lb.range + '</b><span>' + lb.year + '</span></div>' +
      '<button data-w="1" title="1週さき">▶</button>');
    Array.prototype.forEach.call(w.querySelectorAll('button'), function (b) {
      var m = b.getAttribute('data-m');
      b.addEventListener('click', function () {
        if (m !== null) goMonth(+m); else goWeek(+b.getAttribute('data-w'));
      });
    });
    return w;
  }

  function catTabs() {
    var c = el('div', 'cats', '');
    var list = [];
    YY.CATEGORIES.order.forEach(function (n) {
      list.push({ k: n, l: YY.CATEGORIES.labels[n] });
    });
    /* 4つ目「週のすべて」= ①②③をまとめて1週間ぶん。PC・スマホ両方に出します。
       もとはPCだけの「すべて」でしたが、中身が同じで紛らわしいので
       こちらに置き換えました(並び順は ②→①→③ になります) */
    list.push({ k: 'all', l: '週のすべて' });
    list.forEach(function (it) {
      var b = document.createElement('button');
      b.textContent = it.l;
      if (S.cat === it.k) b.className = 'on';
      b.addEventListener('click', function () { S.cat = it.k; render(); });
      c.appendChild(b);
    });
    return c;
  }

  /** 2026-09-01 → 9/1 */
  function mdLabel(dateKey) {
    if (!dateKey) return '';
    var d = YY.parseKey(dateKey);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  /** 「使う工事だけ」で出す条件:その週に人が入っている、または開始日が来ている */
  function jobInUse(j, used) {
    return YY.jobVisible(j, {
      usedNow: !!used[j.id],
      usedPrev: !!prevUsed()[j.id],
      shown: !!(S.week.show || {})[j.id],
      monday: S.monday
    });
  }

  /** 先週に人が入っていた工事id。先週を読めていなければ空です */
  function prevUsed() {
    if (!S.prevWeek) return {};
    if (S._prevUsedCache && S._prevUsedFor === S.prevMondayKey) return S._prevUsedCache;
    S._prevUsedCache = YY.usedJobsInWeek(S.prevWeek);
    S._prevUsedFor = S.prevMondayKey;
    return S._prevUsedCache;
  }

  /**
   * 「使う工事だけ / すべて」の切り替え。
   * 工事が増えると縦に長くなるので、既定はその週に人が入っている工事だけです。
   */
  function filterBar() {
    var used = usedJobIds();
    var cats = (S.cat === 'all') ? YY.ALL_TAB_ORDER : [S.cat];
    var shown = 0, hidden = 0;
    cats.forEach(function (cat) {
      YY.jobsByCat(cat, used).forEach(function (j) {
        if (jobInUse(j, used)) shown++; else hidden++;
      });
    });

    var bar = el('div', 'filterbar', '');
    var seg = el('div', 'seg', '');
    [{ k: true, l: '使う工事だけ' }, { k: false, l: 'すべての工事' }].forEach(function (it) {
      var b2 = document.createElement('button');
      b2.textContent = it.l;
      if (S.onlyUsed === it.k) b2.className = 'on';
      b2.addEventListener('click', function () { S.onlyUsed = it.k; render(); });
      seg.appendChild(b2);
    });
    bar.appendChild(seg);

    // 3つ目はパネルを開く操作です(表示の切り替えではありません)
    var pk = document.createElement('button');
    pk.className = 'pick2';
    pk.textContent = '⧉ 前に使った工事';
    pk.addEventListener('click', function (e) { e.stopPropagation(); openPastPop(); });
    bar.appendChild(pk);

    var msg = '';
    if (S.onlyUsed) {
      msg = hidden
        ? '<b>' + hidden + '件</b>を隠しています(この週は誰も入っていません)'
        : 'この週に使う工事だけ出ています';
    } else {
      msg = '全' + (shown + hidden) + '件を出しています(この週に人が入っているのは ' + shown + '件)';
    }
    bar.appendChild(el('div', 'fmsg', msg));
    return bar;
  }

  /** 予定に出てくる工事id(非表示にしていても、人が入っていれば表に残すため) */
  function usedJobIds() {
    var u = {};
    var a = S.week.assign || {};
    Object.keys(a).forEach(function (id) {
      // その週のどこかに1人でも入っていれば「使用中」
      var days = a[id] || {};
      var has = Object.keys(days).some(function (d) {
        var c = days[d] || {};
        return Object.keys(c.members || {}).length > 0 || (c.extras || []).length > 0;
      });
      if (has) u[id] = true;
    });
    return u;
  }

  /* --- 工事名のセル(クリックで表示名を直せます) --------------------- */

  /**
   * 工事名のセル。クリックで編集の吹き出しが開きます。
   * 注番は【入っているときだけ】行を出します(空欄で行を使いません)。
   */
  function jobCell(j, idx, total, used) {
    var c = el('div', 'job', '');
    // 開始日が来ているのに、その週まだ誰も入っていない工事
    var waiting = !(used || {})[j.id] && YY.jobStartsInWeek(j, S.monday);
    c.setAttribute('data-job', j.id);
    c.setAttribute('data-idx', idx);
    c.setAttribute('data-total', total);

    var bi = billedInfo(j.id);
    if (bi) c.classList.add('billed');

    c.innerHTML = '<div class="n">' + esc(j.name) + '</div>' +
      (j.no ? '<div class="no">' + esc(j.no) + '</div>' : '') +
      (bi ? '<div class="seitag">' + esc(bi.label) + '</div>' : '') +
      (waiting ? '<div class="waiting">' + esc(mdLabel(j.start)) + ' 開始・まだ人なし</div>' : '') +
      // 「隠す」にしたのに表にある工事は、その理由をはっきり出します
      // 「表から隠す」にしてあるのに予定が入っている工事だけ、その旨を出します。
      // 列が狭いので短く。くわしい説明は、この升に触れたときの吹き出しに入れています
      (!j.active
        ? '<div class="kept"><div class="badge">⊘ 隠す設定・予定あり</div></div>'
        : '');
    c.title = j.name + (j.no ? '(' + j.no + ')' : '') +
      (bi ? '\n' + bi.title + '(集計ページで切り替えます)' : '') +
      (!j.active
        ? '\nこの工事は「表から隠す」にしていますが、予定が入っているので表示しています' +
          '\n予定を空にすると表から消えます'
        : '') +
      '\nクリックで工事を直せます';
    c.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!S.online) { toast('電波が届いていません'); return; }
      openJobPop(j.id);
    });
    return c;
  }

  /** カテゴリの一番下に置く「＋ 工事を追加」の行 */
  function addJobRow(cat) {
    var c = el('div', 'addjob', '');
    c.style.gridColumn = '1 / -1';
    var b = document.createElement('button');
    b.innerHTML = '＋ 工事を追加' +
      (S.cat === 'all' ? ' <span>' + esc(YY.CATEGORIES.labels[cat]) + '</span>' : '');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!S.online) { toast('電波が届いていません'); return; }
      openJobPop(null, cat);       // 新規。いま見ているカテゴリが初期選択です
    });
    c.appendChild(b);
    return c;
  }

  /* =================================================================
     工事の呼び名を直す吹き出し
     ================================================================= */

  /**
   * 工事の追加・編集の吹き出し。表の幅に縛られません。
   *   jobId が null … 新規追加(cat が初期選択のカテゴリ)
   *   jobId あり     … その工事を直す
   */
  function openJobPop(jobId, cat) {
    var isNew = !jobId;
    var j = isNew ? null : YY.master.jobById[jobId];
    if (!isNew && !j) { toast('その工事が見つかりません'); return; }

    S.editJob = jobId || '__new__';
    S.editCat = isNew ? (cat || (S.cat === 'all' ? 1 : S.cat)) : j.category;
    S.editNewCat = cat || null;

    var pop = $('jobpop');
    pop.innerHTML = '';
    pop.appendChild(el('div', 'arrow', ''));

    var inr = el('div', 'in', '');
    inr.appendChild(el('div', 'ttl', isNew ? '工事の追加' : '工事の編集'));
    inr.appendChild(el('hr', '', ''));

    /* 工事名 */
    var f1 = el('div', 'fld', '<div class="lb">工事名</div>');
    var inName = document.createElement('input');
    inName.type = 'text';
    inName.maxLength = YY.JOB_NAME_MAX;
    inName.value = isNew ? '' : j.name;
    inName.placeholder = '例:チタン調整槽ポンプカップリングカバー';
    f1.appendChild(inName);
    inr.appendChild(f1);
    if (!isNew) {
      inr.appendChild(el('div', 'fld',
        '<div class="lb"></div><div class="note">空にして決定すると、この工事を削除します</div>'));
    }

    /* 注番(任意) */
    var f2 = el('div', 'fld', '<div class="lb">注番<small>(任意)</small></div>');
    var inNo = document.createElement('input');
    inNo.type = 'text';
    inNo.className = 'sub';
    inNo.maxLength = YY.JOB_NO_MAX;
    inNo.value = isNew ? '' : (j.no || '');
    inNo.placeholder = '空のままで登録できます';
    f2.appendChild(inNo);
    inr.appendChild(f2);

    /* 開始日(任意) */
    var f2b = el('div', 'fld', '<div class="lb">開始日<small>(任意)</small></div>');
    var inStart = document.createElement('input');
    inStart.type = 'date';
    inStart.className = 'sub';
    inStart.value = isNew ? '' : (j.start || '');
    f2b.appendChild(inStart);
    inr.appendChild(f2b);
    inr.appendChild(el('div', 'fld',
      '<div class="lb"></div><div class="note">' +
      '入れておくと、その日が来た週から「使う工事だけ」でも表に出ます' +
      '</div>'));

    /* 予定日の印(この週のぶん)
       メンバーが決まる前に「何日と何日にやる」と分かるようにするための印です。
       続けた日も、飛び飛びの日も選べます。いま出している週のぶんだけです。 */
    var planPick = null;
    if (!isNew) {
      var lb2 = YY.weekLabel(S.monday);
      var f2c = el('div', 'fld',
        '<div class="lb">予定日<small>(' + lb2.range + ')</small></div>');
      planPick = el('div', 'days2', '');
      var chosen = {};
      YY.planDays(S.week, jobId).forEach(function (d) { chosen[d] = true; });
      YY.weekDates(S.monday).forEach(function (d, i) {
        var dt = YY.parseKey(d);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = (i === 5 ? 'sat' : i === 6 ? 'sun' : '') + (chosen[d] ? ' on' : '');
        b.innerHTML = '<b>' + YY.DOW[i] + '</b>' + (dt.getMonth() + 1) + '/' + dt.getDate();
        b.addEventListener('click', function (e) {
          e.preventDefault();
          if (chosen[d]) delete chosen[d]; else chosen[d] = true;
          b.classList.toggle('on', !!chosen[d]);
        });
        planPick.appendChild(b);
      });
      planPick._chosen = chosen;
      f2c.appendChild(planPick);
      inr.appendChild(f2c);
      inr.appendChild(el('div', 'fld',
        '<div class="lb"></div><div class="note">' +
        'この工事をやる日を押しておくと、その日のマスに色が付きます。' +
        'メンバーが入っても色は残ります' +
        '</div>'));
    }

    /* カテゴリ */
    var f3 = el('div', 'fld', '<div class="lb">カテゴリ</div>');
    var cbox = el('div', 'cats2', '');
    YY.CATEGORIES.order.forEach(function (n) {
      var b = document.createElement('button');
      b.textContent = YY.CATEGORIES.labels[n];
      b.className = (S.editCat === n) ? 'on' : '';
      b.addEventListener('click', function () {
        S.editCat = n;
        Array.prototype.forEach.call(cbox.children, function (x) {
          x.className = (x === b) ? 'on' : '';
        });
      });
      cbox.appendChild(b);
    });
    f3.appendChild(cbox);
    inr.appendChild(f3);

    /* 並べ替えと非表示(直すときだけ) */
    if (!isNew) {
      inr.appendChild(el('hr', '', ''));
      var anchor = document.querySelector('.grid .job[data-job="' + jobId + '"]');
      var idx = anchor ? +anchor.getAttribute('data-idx') : 0;
      var total = anchor ? +anchor.getAttribute('data-total') : 1;

      var tools = el('div', 'tools', '');
      var up = document.createElement('button');
      up.innerHTML = '↑ 上へ'; up.disabled = idx <= 0;
      up.addEventListener('click', function () { doMove(jobId, -1); });
      var dn = document.createElement('button');
      dn.innerHTML = '↓ 下へ'; dn.disabled = idx >= total - 1;
      dn.addEventListener('click', function () { doMove(jobId, 1); });
      var hide = document.createElement('button');
      hide.className = 'hide' + (j.active ? '' : ' on');
      hide.textContent = j.active ? '表から隠す' : '表に出す';
      hide.addEventListener('click', function () {
        YY.setJobActive(jobId, !j.active).then(function () {
          YY.addLog(S.monday, {
            kind: '工事の編集', job: jobId, jn: j.name,
            note: j.active ? '表から隠しました' : '表に出しました'
          });
          toast(j.active ? '表から隠しました' : '表に出しました');
          closeJobPop();
        }).catch(function (e) { toast('切り替えできませんでした:' + e.message); });
      });
      // 先週から1行まるごと持ってきます
      var cp = document.createElement('button');
      var srcN = lastWeekCount(jobId);
      cp.className = 'copyw';
      cp.innerHTML = '⧉ 先週からコピー' +
        (srcN > 0 ? ' <span>' + srcN + 'マス</span>' : srcN === 0 ? ' <span>先週は空</span>' : '');
      cp.disabled = (srcN === 0);
      cp.addEventListener('click', function () { copyRowFromLastWeek(jobId); });

      tools.appendChild(up); tools.appendChild(dn); tools.appendChild(hide);
      inr.appendChild(tools);
      inr.appendChild(cp);
      inr.appendChild(el('div', 'note',
        '隠した工事も、その週に人が入っていれば表に残ります。データは消えません'));
    }

    var err = el('div', 'err', '');
    err.style.display = 'none';
    inr.appendChild(err);

    inr.appendChild(el('hr', '', ''));
    var btns = el('div', 'btns', '');
    var bNo = document.createElement('button');
    bNo.textContent = 'やめる';
    bNo.addEventListener('click', closeJobPop);
    var bOk = document.createElement('button');
    bOk.className = 'ok'; bOk.textContent = '決定';
    bOk.addEventListener('click', submit);
    btns.appendChild(bNo); btns.appendChild(bOk);
    pop.appendChild(inr);
    pop.appendChild(btns);   // ボタンは下に固定します(中身と一緒にスクロールさせません)

    function submit() {
      var nm = (inName.value || '').trim();

      // 工事名を空にして決定 = 削除(新規はまだ何も無いので、いままでどおり注意だけ)
      if (!nm) {
        if (isNew) {
          err.textContent = '工事名を入れてください';
          err.style.display = '';
          inName.focus();
          return;
        }
        removeJob(jobId, j.name);
        return;
      }

      var no = (inNo.value || '').trim();
      var st = (inStart.value || '').trim();
      var cat = S.editCat;
      closeJobPop();
      if (isNew) {
        YY.addJob(nm, cat, no, st).then(function (id) {
          YY.addLog(S.monday, {
            kind: '工事の追加', job: id, jn: nm,
            note: YY.CATEGORIES.labels[cat] + (no ? ' / 注番 ' + no : '') + (st ? ' / 開始 ' + st : '')
          });
          toast('「' + nm + '」を追加しました');
        }).catch(function (e) { toast('追加できませんでした:' + e.message); });
      } else {
        var was = YY.master.jobById[jobId] || {};
        var diff = [];
        if (was.name !== nm) diff.push('名前 ' + (was.name || '') + ' → ' + nm);
        if ((was.no || '') !== no) diff.push('注番 ' + (was.no || '(なし)') + ' → ' + (no || '(なし)'));
        if ((was.start || '') !== st) diff.push('開始 ' + (was.start || '(なし)') + ' → ' + (st || '(なし)'));
        if (was.category !== cat) diff.push('分類 ' + (YY.CATEGORIES.labels[was.category] || '') + ' → ' + YY.CATEGORIES.labels[cat]);
        /* 工事の中身と、予定日の印。どちらも終わってから1回だけお知らせします。
           別々にお知らせすると、あとのお知らせが前のを消してしまい、
           予定日が保存できていないことに気づけません */
        var pd = planPick ? planPick._chosen : null;
        var wasDays = YY.planDays(S.week, jobId);
        var nowDays = pd ? Object.keys(pd).sort() : wasDays;
        var planChanged = pd && (nowDays.join(',') !== wasDays.join(','));

        var jobDone = YY.updateJob(jobId, { name: nm, no: no, start: st, category: cat })
          .then(function () {
            if (diff.length) {
              YY.addLog(S.monday, { kind: '工事の編集', job: jobId, jn: nm, note: diff.join(' / ') });
            }
            return null;
          })
          .catch(function (e) { return '工事:' + (e && e.message ? e.message : e); });

        var planDone = !planChanged ? Promise.resolve(null)
          : YY.setPlanDays(S.monday, jobId, pd)
            .then(function () {
              YY.addLog(S.monday, {
                kind: '予定日の印', job: jobId, jn: nm,
                note: (nowDays.length ? nowDays.map(mdLabel).join('・') : '(なし)') + ' にしました'
              });
              return null;
            })
            .catch(function (e) { return '予定日:' + (e && e.message ? e.message : e); });

        Promise.all([jobDone, planDone]).then(function (errs) {
          var bad = errs.filter(Boolean);
          if (!bad.length) {
            toast(planChanged ? '工事と予定日を直しました' : '工事を直しました');
            return;
          }
          toast('保存できませんでした … ' + bad.join(' / '));
        });
      }
    }

    [inName, inNo, inStart].forEach(function (x) {
      x.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        if (e.key === 'Escape') { e.preventDefault(); closeJobPop(); }
      });
    });

    $('popmask').classList.add('on');
    pop.classList.add('on');
    positionJobPop();
    inName.focus();
    inName.setSelectionRange(inName.value.length, inName.value.length);
  }

  /**
   * 工事を消します。予定が入っている場合は、それも消えることを伝えてから。
   * 記録を残したいときは「表から隠す」を案内します。
   */
  function removeJob(jobId, name) {
    YY.jobUsage(jobId).then(function (u) {
      var msg = u.cells
        ? '「' + name + '」には予定が入っています。\n' +
          '削除すると、その予定もすべて消えます。\n' +
          '記録を残したい場合は「表から隠す」を使ってください。\n\n' +
          '本当に削除しますか?'
        : '「' + name + '」を削除しますか?';
      if (!confirm(msg)) return;

      closeJobPop();
      YY.deleteJob(jobId).then(function (res) {
        YY.addLog(S.monday, {
          kind: '工事の削除', job: jobId, jn: name,
          note: res.cells ? '予定 ' + res.cells + 'マスも消しました' : '予定は入っていませんでした'
        });
        toast('「' + name + '」を削除しました' +
          (res.cells ? '(予定 ' + res.cells + 'マスも消しました)' : ''));
      }).catch(function (e) {
        toast('削除できませんでした:' + (e && e.message ? e.message : ''));
      });
    }).catch(function (e) {
      toast('調べられませんでした:' + (e && e.message ? e.message : ''));
    });
  }

  /* =================================================================
     先週からのコピー
       ・その日すでに別の工事(や休み)に入っている人は自動で外します
       ・しるし(◎△☆✕)と選んだ順はそのまま持ってきます
     ================================================================= */

  /** 先週の同じ曜日の日付 */
  function prevDate(dateKey) { return YY.toKey(YY.addDays(dateKey, -7)); }

  /**
   * 先週のセルを、この週へ持ってこられる形に整えます。
   * 戻り値 { members, extras, count, dropped:[外した名前] }
   */
  /**
   * コピー元の名前のうち、その日すでに別の行(工事・休み)に入っている人を調べます。
   *   { name: 名前, from: 元の工事キー } の配列を返します。
   */
  function clashes(names, jobId, dateKey) {
    var day = YY.computeDay(S.week, dateKey);
    var out = [];
    names.forEach(function (n) {
      var where = (day.placements[n] || []).filter(function (k) { return k !== jobId; });
      if (where.length) out.push({ name: n, from: where[0] });
    });
    return out;
  }

  /**
   * 重複する人をどうするか、まとめて1回だけ確かめます。
   *   戻り値 true  … 移す(呼び出し側で moves に積んでください)
   *          false … 移さない(重複した人はコピーしません)
   * 個別に選ぶときと同じで、行き先をはっきり伝えます。
   */
  function askMove(list, toJobKey) {
    if (!list.length) return false;
    var lines = list.slice(0, 8).map(function (x) {
      return '　・' + x.name + '(いまは「' + YY.jobLabel(x.from).name + '」)';
    });
    if (list.length > 8) lines.push('　・ほか' + (list.length - 8) + '名');
    return confirm(
      list.length + '名は、この日すでに別の工事に入っています。\n' +
      lines.join('\n') + '\n\n' +
      '「' + YY.jobLabel(toJobKey).name + '」に移動しますか?\n' +
      '(いいえ を選ぶと、この人たちはコピーしません)');
  }

  function fromLastWeek(jobId, dateKey) {
    var src = YY.cellOf(S.prevWeek || { assign: {} }, jobId, prevDate(dateKey));
    var day = YY.computeDay(S.week, dateKey);
    var members = {}, dropped = [], n = 0;

    Object.keys(src.members).forEach(function (name) {
      var where = day.placements[name] || [];
      // その日ほかの行(工事・休み)に入っている人は連れてきません
      if (where.some(function (k) { return k !== jobId; })) { dropped.push(name); return; }
      members[name] = {
        mark: (src.members[name] || {}).mark || '',
        ord: (typeof (src.members[name] || {}).ord === 'number') ? src.members[name].ord : n
      };
      n++;
    });

    var extras = src.extras.slice();
    return { members: members, extras: extras, count: n + extras.length, dropped: dropped };
  }

  /** 先週のその工事に、何マス入っているか */
  function lastWeekCount(jobId) {
    if (!S.prevWeek) return -1;                  // まだ読めていません
    var n = 0;
    YY.weekDates(S.monday).forEach(function (d) {
      if (YY.cellCount(S.prevWeek, jobId, prevDate(d))) n++;
    });
    return n;
  }

  /** 【A】工事1行ぶん(月〜日)を先週から持ってきます */
  /** 同じ人が何日も重なるときは、確認の文では1人として出します */
  function dedupeNames(list) {
    var seen = {}, out = [];
    list.forEach(function (x) {
      if (seen[x.name]) return;
      seen[x.name] = true;
      out.push(x);
    });
    return out;
  }

  function copyRowFromLastWeek(jobId) {
    if (!S.online) { toast('電波が届いていません'); return; }
    var name = YY.jobLabel(jobId).name;
    var src = lastWeekCount(jobId);
    if (src < 0) { toast('先週を読み込み中です。少し待ってください'); return; }
    if (src === 0) { alert('先週の「' + name + '」は空です。\nコピーするものがありません。'); return; }

    if (!confirm('先週の「' + name + '」の予定(月〜日 ' + src + 'マス)を、\n' +
      'この週にコピーしますか?\n\n' +
      'すでに入っているセルは、そのまま残します。')) return;

    var kept = 0, moveOut = [];

    /* 先に7日ぶんを組み立てて、重複する人をまとめて調べます。
       1日ずつ聞くと最大7回も確認が出るので、まとめて1回だけ聞きます */
    var plan = [], allClash = [], seen = {};
    YY.weekDates(S.monday).forEach(function (d) {
      if (!YY.cellCount(S.prevWeek, jobId, prevDate(d))) return;   // 先週が空の日
      if (YY.cellCount(S.week, jobId, d)) { kept++; return; }      // すでに入っている

      var c = fromLastWeek(jobId, d);
      var cl = clashes(c.dropped, jobId, d);
      cl.forEach(function (x) {
        var k = x.name + '|' + d;
        if (!seen[k]) { seen[k] = true; allClash.push({ name: x.name, from: x.from, date: d }); }
      });
      plan.push({ date: d, cell: c, clash: cl });
    });

    // 重複する人をどうするか、1回だけ確かめます
    var move = allClash.length ? askMove(dedupeNames(allClash), jobId) : false;

    var jobs = [], copied = 0, moved = 0, skipped = 0;
    plan.forEach(function (p) {
      var members = p.cell.members, extras = p.cell.extras;
      if (move && p.clash.length) {
        var src = YY.cellOf(S.prevWeek || { assign: {} }, jobId, prevDate(p.date));
        p.clash.forEach(function (x) {
          members[x.name] = {
            mark: (src.members[x.name] || {}).mark || '',
            ord: YY.nextOrd(members)
          };
          moveOut.push({ jobKey: x.from, dateKey: p.date, name: x.name });
          moved++;
        });
      } else {
        skipped += p.clash.length;
      }
      if (!Object.keys(members).length && !extras.length) return;
      jobs.push(YY.saveCell(S.monday, jobId, p.date, { members: members, extras: extras }, '前週コピー'));
      copied++;
    });

    // 連れてきた人を、元の工事から外します
    var byCell = {};
    moveOut.forEach(function (mv) {
      var k = mv.jobKey + '|' + mv.dateKey;
      byCell[k] = byCell[k] || { jobKey: mv.jobKey, dateKey: mv.dateKey, names: [] };
      byCell[k].names.push(mv.name);
    });
    Object.keys(byCell).forEach(function (k) {
      var mv = byCell[k];
      var from = YY.cellOf(S.week, mv.jobKey, mv.dateKey);
      var rest = {};
      Object.keys(from.members).forEach(function (n) {
        if (mv.names.indexOf(n) < 0) rest[n] = from.members[n];
      });
      jobs.push(YY.saveCell(S.monday, mv.jobKey, mv.dateKey, { members: rest, extras: from.extras }, '前週コピー'));
    });

    if (!jobs.length) {
      toast(kept ? kept + 'マスは既に入っていたので、そのままです' : 'コピーするものがありませんでした');
      return;
    }

    closeJobPop();
    Promise.all(jobs).then(function () {
      var msg = copied + 'マスをコピーしました';
      if (kept) msg += '(' + kept + 'マスは既に入っていたのでそのまま)';
      if (moved) msg += ' / ' + moved + '名を移動しました';
      if (skipped) msg += ' / ' + skipped + '名は既に別の工事に入っているので入れていません';
      toast(msg);
    }).catch(function (e) {
      toast('コピーできませんでした:' + (e && e.message ? e.message : ''));
    });
  }

  function doMove(jobId, dir) {
    YY.moveJob(jobId, dir).then(function (moved) {
      if (moved) toast(dir < 0 ? '上へ動かしました' : '下へ動かしました');
      closeJobPop();
    }).catch(function (e) { toast('動かせませんでした:' + e.message); });
  }

  function closeJobPop() {
    S.editJob = null;
    $('jobpop').classList.remove('on');
    $('popmask').classList.remove('on');
  }

  /** 工事名を指す位置に吹き出しを置きます。画面からはみ出さないよう寄せます */
  function positionJobPop() {
    if (!S.editJob) return;
    var pop = $('jobpop');
    var anchor;
    if (S.editJob === '__member__') {
      anchor = S.memPop && S.memPop.anchor;
      // 一覧が描き直されると要素が入れ替わるので、探し直します
      if (anchor && !document.body.contains(anchor) && S.memPop.id) {
        anchor = document.querySelector('.wrow[data-member="' + S.memPop.id + '"]');
      }
    } else if (S.editJob === '__new__') {
      // 新規は、押した「＋ 工事を追加」を指します
      var rows = document.querySelectorAll('.addjob');
      var n = (S.cat === 'all' && S.editNewCat) ? YY.CATEGORIES.order.indexOf(S.editNewCat) : 0;
      anchor = rows[n] || rows[0];
    } else {
      anchor = document.querySelector('.grid .job[data-job="' + S.editJob + '"]');
    }
    if (!anchor) { closeJobPop(); return; }

    var a = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var pad = 12;
    var vh = window.innerHeight;
    var gap = 10;

    /* 縦の置き場所を、この順で決めます。
         1) 下に入るなら下
         2) 入らなければ上
         3) どちらにも入らなければ、画面に収まる位置へずらす
            (このときは三角が相手を指せないので消します)              */
    var fitsBelow = (a.bottom + gap + ph) <= (vh - pad);
    var fitsAbove = (a.top - gap - ph) >= pad;
    var top, below, noarrow = false;

    if (fitsBelow) {
      below = true; top = a.bottom + gap;
    } else if (fitsAbove) {
      below = false; top = a.top - gap - ph;
    } else {
      below = true;
      top = Math.max(pad, Math.min(a.bottom + gap, vh - ph - pad));
      noarrow = true;
    }

    pop.classList.toggle('below', below);
    pop.classList.toggle('above', !below);
    pop.classList.toggle('noarrow', noarrow);
    pop.style.top = top + 'px';

    // 左ぞろえ。右にはみ出すなら左へ寄せます(ノッチの幅も避けます)
    var sf = safeLR();
    var left = Math.min(a.left, window.innerWidth - pw - pad - sf.r);
    left = Math.max(pad + sf.l, left);
    pop.style.left = left + 'px';

    // 三角は工事名の真ん中を指します
    var ar = pop.querySelector('.arrow');
    if (ar && !noarrow) {
      var cx = a.left + a.width / 2 - left - 7;
      ar.style.left = Math.max(14, Math.min(pw - 28, cx)) + 'px';
    }
  }


  /* --- セル ------------------------------------------------------- */

  function planCell(jobKey, dateKey, day) {
    var b = document.createElement('button');
    // 予定日の印が付いていれば、人がいてもいなくても色を残します
    b.className = 'cell' + (YY.isToday(dateKey) ? ' today' : '') +
      (YY.hasPlan(S.week, jobKey, dateKey) ? ' planned' : '');
    var d = YY.displayCell(S.week, jobKey, dateKey);

  /** 行をたたむ・ひらくボタン(休み行と余行で共通) */
  function rowToggle(open, what, onClick) {
    var b = document.createElement('button');
    b.className = 'tg';
    b.textContent = open ? '▴' : '▾';
    b.title = what + (open ? 'をたたむ' : 'をひらく');

  }

  function restCell(dateKey, day) {
    var b = document.createElement('button');
    b.className = 'cell rest' + (YY.isToday(dateKey) ? ' today' : '') +
      (S.restOpen ? '' : ' closed');
    var d = YY.displayCell(S.week, YY.REST_KEY, dateKey);

    // たたんでいるとき = 人数だけ。押せば今までどおり直せます
    if (!S.restOpen) {
      b.innerHTML = d.count
        ? '<div class="big">' + d.count + '名</div>'
        : '<div class="none">—</div>';
      b.title = d.count ? d.rows.map(YY.nameWithMarks).concat(d.extras).join('・') : '';
      b.addEventListener('click', function () { openSheet(YY.REST_KEY, dateKey); });
      return b;
    }

    if (d.count === 0) {
      b.classList.add('empty');
      b.textContent = '—';
    } else {
      b.innerHTML = joinNames(d.rows.map(function (r) { return nameHTML(r, day, YY.REST_KEY); })
        .concat(d.extras.map(function (x) { return '<span class="nm">' + esc(x) + '</span>'; }))) +
        '<div class="cnt">' + d.count + '名</div>';
    }
    b.addEventListener('click', function () { openSheet(YY.REST_KEY, dateKey); });
    return b;
  }

  /**
   * その日の「余」(計算で出すだけ。押しても何も起きません)
   * たたんでいるとき = 人数だけ。ひらいたとき = 名前を並べます
   */
  /** 余の行に出す人数の上限。土日はほぼ全員が余になるので、途中で切ります */
  var YO_LIMIT = 8;

  function yoCell(day) {
    var d = document.createElement('div');
    var names = day.free;

    if (!S.yoOpen) {
      d.className = 'yo closed';
      d.innerHTML = names.length
        ? '<div class="big">' + names.length + '名</div>'
        : '<div class="none">—</div>';
      d.title = names.length ? names.join('・') : '';
      return d;
    }

    d.className = 'yo';
    if (!names.length) { d.innerHTML = '<div class="none">—</div>'; return d; }

    /* ひらいたときも「1人1行」にはしません。土日はほぼ全員が余になるため、
       スマホだと74人=1810px の行になってしまいます。
       人数の上限だけ決めて、多い日は「ほか○名」でまとめます。
       つなぎ方は表と同じ(スマホは1人1行、PCは「・」区切り)にしています。 */
    var shown = names.slice(0, YO_LIMIT);
    var more = names.length - shown.length;
    d.innerHTML = joinNames(shown.map(function (n) {
      return '<span class="nm' + (YY.isCoop(n) ? ' coop' : '') + '">' + esc(n) + '</span>';
    })) +
      (more > 0 ? '<span class="more2">ほか' + more + '名</span>' : '') +
      '<div class="cnt">' + names.length + '名</div>';
    d.title = names.join('・');
    return d;
  }

  /**
   * 名前をつなぎます。
   *   PC   … Excelと同じ「・」区切り(中点は名前より薄い色)
   *   スマホ … 1人1行なので改行のまま
   */
  function joinNames(list) {
    /* PCは「・」でつなぎます。このページは日本語を途中で折らない設定
       (word-break:keep-all)なので、そのままだと名前がつながったまま
       横に伸びて、となりの列にはみ出します。
       区切りのうしろに <wbr> を入れて、名前の切れ目でだけ折り返させます
       (名前の途中では折れません)。 */
    return list.join(isPC() ? '<span class="sep">・</span><wbr>' : '<br>');
  }

  /* セルに出す人数の上限。PCは土日の列を平日の0.7倍にしているので、
     土日だけ少なめにします(名前がはみ出したり隠れたりするため)。
     スマホは7日とも同じ幅なので、平日と同じ5名のままです。 */
  var CELL_LIMIT = 5;
  var CELL_LIMIT_WEEKEND = 3;

  function cellInner(d, day, jobKey, dateKey) {
    var all = d.rows.map(function (r) { return nameHTML(r, day, jobKey); })
      .concat(d.extras.map(function (x) { return '<span class="nm">' + esc(x) + '</span>'; }));
    var lim = (isPC() && dateKey && YY.isWeekend(dateKey))
      ? CELL_LIMIT_WEEKEND : CELL_LIMIT;
    var shown = all.slice(0, lim);
    var more = all.length - shown.length;
    return joinNames(shown) +
      (more > 0 ? '<div class="more">+ほか' + more + '名</div>' : '') +
      '<div class="cnt">' + d.count + '名</div>';
  }

  /** 1人ぶんの表示。しるしは名前の直前に、色付きで出します */
  function nameHTML(row, day, jobKey) {
    var dup = day && day.placements[row.name] && day.placements[row.name].length >= 2;
    var mk = row.mark ? '<span class="sc">' + esc(row.mark) + '</span>' : '';
    return '<span class="nm' + (row.coop ? ' coop' : '') + '">' + mk +
      '<span class="' + (dup ? 'nm dup' : '') + '">' + esc(row.name) + '</span></span>';
  }

  /* =================================================================
     選択シート
     ================================================================= */

  function openSheet(jobKey, dateKey) {
    if (!S.online) { toast('電波が届いていません'); return; }

    var c = YY.cellOf(S.week, jobKey, dateKey);
    var members = {};
    Object.keys(c.members).forEach(function (n) {
      members[n] = { mark: (c.members[n] || {}).mark || '', ord: (c.members[n] || {}).ord };
    });
    // ord が無い古いデータには、いまの並びで番号を振り直します
    var i = 0;
    Object.keys(members).forEach(function (n) {
      if (typeof members[n].ord !== 'number') members[n].ord = i;
      i++;
    });

    S.sheet = {
      jobKey: jobKey, dateKey: dateKey,
      members: members,
      extras: c.extras.slice(),
      moves: [],       // よそのセルから連れてくる人 [{jobKey,dateKey,name}]
      day: null        // その日の状態(チップの色を決めるのに使います)
    };
    refreshSheet();
    $('mask').classList.add('on');
    $('sheet').classList.add('on');
  }

  function closeSheet() {
    closeMarkPop();
    S.sheet = null;
    $('mask').classList.remove('on');
    $('sheet').classList.remove('on');
  }

  /**
   * 同じ人のチップは「工場の人」と「名簿」の2か所に出ます。
   * どちらを押しても両方の色が変わるよう、名前ごとに覚えておきます。
   */
  function rememberChip(name, unknown) {
    var sh = S.sheet;
    var b = pickChip(name, unknown);
    sh.chipEls[name] = sh.chipEls[name] || [];
    sh.chipEls[name].push({ el: b, unknown: unknown });
    return b;
  }

  /** その人のチップを、出ている場所すべて塗り替えます */
  function restyleChips(name) {
    var sh = S.sheet; if (!sh) return;
    (sh.chipEls[name] || []).forEach(function (x) {
      if (document.body.contains(x.el)) styleChip(x.el, name, x.unknown);
    });
  }

  /**
   * その日「工場(入場あり/応援入場あり/応援)」に入っている人。
   * 対象の工事は common.js の FACTORY_JOBS で決めています。
   */
  function factoryNames(day) {
    var ids = {};
    YY.master.jobs.forEach(function (j) {
      if (YY.FACTORY_JOBS.indexOf(j.name) >= 0) ids[j.id] = true;
    });
    var order = {};
    YY.master.workers.forEach(function (w, i) { order[w.name] = i; });

    return Object.keys((day && day.placements) || {}).filter(function (nm) {
      return (day.placements[nm] || []).some(function (k) { return ids[k]; });
    }).sort(function (a, b) {                      // 名簿の順に並べます
      var x = (order[a] === undefined) ? 9999 : order[a];
      var y = (order[b] === undefined) ? 9999 : order[b];
      return x - y;
    });
  }

  function refreshSheet() {
    var sh = S.sheet; if (!sh) return;
    var day = YY.computeDay(S.week, sh.dateKey);
    var lab = YY.jobLabel(sh.jobKey);
    var box = $('sheet');
    // 組み直すときも、見ていた位置に戻します
    var keepTop = (box.querySelector('.sb') || {}).scrollTop || 0;
    box.innerHTML = '';

    // ヘッダー
    box.appendChild(el('div', 'sh',
      '<div class="j">' + esc(lab.name) + '</div>' +
      '<div class="d">' + YY.dayLabel(sh.dateKey) + ' タップして選んでください</div>'));

    var body = el('div', 'sb', '');

    // 前日と同じにする
    var prev = YY.toKey(YY.addDays(sh.dateKey, -1));
    var pc = YY.displayCell(S.week, sh.jobKey, prev);
    var pb = document.createElement('button');
    pb.className = 'copyprev';
    var pnames = pc.rows.map(function (r) { return YY.nameWithMarks(r); }).concat(pc.extras);
    pb.innerHTML = '⧉ 前日(' + YY.DOW[YY.dowIndex(prev)] + ')と同じにする' +
      (pnames.length ? ' <span>' + esc(pnames.slice(0, 4).join('・')) +
        (pnames.length > 4 ? ' ほか' : '') + '</span>' : '');
    pb.disabled = pc.count === 0;
    pb.addEventListener('click', function () {
      var src = YY.cellOf(S.week, sh.jobKey, prev);
      var all = Object.keys(src.members);

      // その日すでに別の工事に入っている人は、確かめてから移します
      var cl = clashes(all, sh.jobKey, sh.dateKey);
      var move = cl.length ? askMove(cl, sh.jobKey) : false;
      var skip = {};
      if (!move) cl.forEach(function (x) { skip[x.name] = true; });

      sh.members = {};
      sh.moves = [];               // 入れ替わるので、連れてくる予約は取り消します
      var n = 0;
      all.forEach(function (nm) {
        if (skip[nm]) return;
        sh.members[nm] = { mark: (src.members[nm] || {}).mark || '', ord: n++ };
      });
      if (move) {
        cl.forEach(function (x) {
          sh.moves.push({ jobKey: x.from, dateKey: sh.dateKey, name: x.name });
        });
      }
      sh.extras = src.extras.slice();
      refreshSheet();

      if (cl.length) {
        toast(move ? cl.length + '名を移動しました。「きめる」で確定します'
                   : cl.length + '名は既に別の工事に入っているので入れていません');
      }
    });
    body.appendChild(pb);

    /* 【B】先週の同じ曜日から、このセルだけ持ってきます */
    var lwDow = YY.DOW[YY.dowIndex(sh.dateKey)];
    var lwSrc = S.prevWeek ? YY.displayCell(S.prevWeek, sh.jobKey, prevDate(sh.dateKey)) : null;
    var lw = document.createElement('button');
    lw.className = 'copyprev';
    lw.innerHTML = '⧉ 先週の' + lwDow + '曜からコピー' +
      (lwSrc && lwSrc.count
        ? ' <span>' + esc(lwSrc.rows.map(YY.nameWithMarks).concat(lwSrc.extras).slice(0, 4).join('・')) +
          (lwSrc.count > 4 ? ' ほか' : '') + '</span>'
        : (!S.prevWeek ? ' <span>読み込み中…</span>' : ' <span>先週は空</span>'));
    lw.disabled = !lwSrc || !lwSrc.count;
    lw.addEventListener('click', function () {
      var src = YY.cellOf(S.prevWeek || { assign: {} }, sh.jobKey, prevDate(sh.dateKey));
      var c = fromLastWeek(sh.jobKey, sh.dateKey);
      sh.members = c.members;
      sh.extras = c.extras;
      sh.moves = [];

      // 重複する人は、確かめてから連れてきます
      var cl = clashes(c.dropped, sh.jobKey, sh.dateKey);
      var moved = 0;
      if (cl.length && askMove(cl, sh.jobKey)) {
        cl.forEach(function (x) {
          sh.members[x.name] = {
            mark: (src.members[x.name] || {}).mark || '',
            ord: YY.nextOrd(sh.members)
          };
          sh.moves.push({ jobKey: x.from, dateKey: sh.dateKey, name: x.name });
          moved++;
        });
      }
      refreshSheet();

      if (moved) {
        toast('先週の' + lwDow + '曜から入れました(' + moved + '名は移動)。「きめる」で確定します');
      } else if (c.dropped.length) {
        toast(c.dropped.length + '名は既に別の工事に入っているので入れていません');
      } else {
        toast('先週の' + lwDow + '曜から入れました。「きめる」で確定します');
      }
    });
    body.appendChild(lw);

    /* 予定日の印が付いているマスなら、ここから消せるようにします */
    if (YY.hasPlan(S.week, sh.jobKey, sh.dateKey)) {
      var pc2 = document.createElement('button');
      pc2.className = 'copyprev planoff';
      pc2.innerHTML = '🟡 予定日の印を消す <span>このマスの色を消します</span>';
      pc2.addEventListener('click', function () {
        YY.clearPlanDay(S.monday, sh.jobKey, sh.dateKey).then(function () {
          YY.addLog(S.monday, {
            kind: '予定日の印', job: sh.jobKey, jn: YY.jobLabel(sh.jobKey).name,
            date: sh.dateKey, note: 'この日の印を消しました'
          });
          toast('予定日の印を消しました');
          refreshSheet();
        }).catch(function (e) { toast('消せませんでした:' + (e && e.message ? e.message : '')); });
      });
      body.appendChild(pc2);
    }

    /* 選んでいる人。中身は updateChosen() が組み直します。
       下の名簿には触らないので、選び直しても一覧の位置は動きません */
    var chosen = el('div', 'grp chosen off', '');
    chosen.id = 'chosen';
    body.appendChild(chosen);

    /* --- 名前は1か所だけ。状態は見た目で分けます -----------------------
       白      … 余っている(そのまま選べる)
       緑      … いま選んでいる
       灰の破線 … その日ほかの工事に入っている(→行き先)
       灰      … その日休み(→休み)
       並び順は名簿順で固定。選んでもチップは動きません
       ------------------------------------------------------------------- */
    sh.day = day;
    sh.chipEls = {};        // 名前 → その名前のチップ(2か所に出ることがあります)

    /* --- 🏭 工場の人 -------------------------------------------------
       その日「工場」に入っている人は、そこから抜いて別の工事に回すことが
       多いので、名簿より上にまとめて出します。
       押したときの動き(移動の確かめ)は名簿のチップと同じです。
       ----------------------------------------------------------------- */
    var fac = factoryNames(day);
    if (fac.length) {
      var gf = el('div', 'grp fac',
        '<div class="gt">🏭 工場の人<span class="sum">' + fac.length + '名</span></div>');
      var cf = el('div', 'chips', '');
      fac.forEach(function (nm) {
        cf.appendChild(rememberChip(nm, !YY.isKnown(nm)));
      });
      gf.appendChild(cf);
      gf.appendChild(el('div', 'ghint',

        unknownN + '名)。同じ名前で登録するとつながります</b>' : '')));

    var fix = document.createElement('button');
    fix.className = 'fixlink';
    fix.textContent = '👥 名簿を直す';
    fix.addEventListener('click', function () {
      closeSheet();

    // 名簿にない人

  /* --- 「選んでいる人」の欄 -------------------------------------------
     選んだ順(ord)にチップを並べます。しるしも名前の前に出します。
     タップすると外せます。下の名簿は色を塗り替えるだけなので、
     並びも位置も動きません。誰も選んでいないときは出しません。
     ------------------------------------------------------------------- */

  function drawChosen(wrap) {
    var sh = S.sheet;
    var X = '<span class="x">✕</span>';   // 外す目印
    var names = Object.keys(sh.members).sort(function (a, b) {
      return (sh.members[a].ord || 0) - (sh.members[b].ord || 0);
    });
    var n = names.length + sh.extras.length;

    if (!n) { wrap.className = 'grp chosen off'; wrap.innerHTML = ''; return; }

    wrap.className = 'grp chosen';
    wrap.innerHTML = '<div class="gt">✅ 選んでいる人' +
      '<span class="sum">' + n + '名</span>' +
      '<span class="hint4">タップで外します</span></div>';

    var c = el('div', 'chips', '');
    names.forEach(function (name) {
      var mk = sh.members[name].mark || '';
      var b = document.createElement('button');
      b.className = 'chip on' + (YY.isCoop(name) ? ' coop' : '') +
        (YY.isKnown(name) ? '' : ' unknown');
      b.innerHTML = (mk ? '<span class="sc">' + esc(mk) + '</span>' : '') + esc(name) + X;
      b.title = name + ' … タップすると外します';
      b.addEventListener('click', function () { unpick(name); });
      c.appendChild(b);
    });
    // 名簿にない人(手で入れた人)も、ここにまとめて出します
    sh.extras.forEach(function (x, i) {
      var b = document.createElement('button');
      b.className = 'chip on';
      b.innerHTML = esc(x) + X;
      b.title = x + ' … 名簿にない人。タップすると外します';
      b.addEventListener('click', function () { sh.extras.splice(i, 1); refreshSheet(); });
      c.appendChild(b);
    });
    wrap.appendChild(c);

    // 下に隠れる人がいるかどうかは、並べてみないと分かりません
    var more = el('div', 'more5', '');
    wrap.appendChild(more);
    markChosenOverflow(wrap);
    c.addEventListener('scroll', function () { markChosenOverflow(wrap); });
  }

  /**
   * 欄の中で下に隠れているチップの数を知らせます。
   * スマホの幅では10名で4行を超えることがあり、見えている数だけ数えると
   * 「1人足りない」と思えてしまうためです。
   */
  function markChosenOverflow(wrap) {
    var c = wrap.querySelector('.chips');
    var tag = wrap.querySelector('.more5');
    if (!c || !tag) return;
    var wb = c.getBoundingClientRect();
    var n = 0;
    Array.prototype.forEach.call(c.querySelectorAll('.chip'), function (x) {
      if (x.getBoundingClientRect().bottom > wb.bottom + 1) n++;
    });
    tag.textContent = n ? '▼ 下にあと ' + n + '名(この欄は下にスクロールできます)' : '';
    tag.style.display = n ? '' : 'none';
  }

  /** 欄を作り直します。
      欄が画面の上に隠れているときは、高さが変わったぶんスクロールをずらして
      打ち消します。こうすると、下の名簿が上下に動いて見えません。 */
  function updateChosen() {
    var sh = S.sheet; if (!sh) return;
    var box = $('sheet');
    var wrap = box.querySelector('#chosen');
    var body = box.querySelector('.sb');
    if (!wrap || !body) return;

    var wr = wrap.getBoundingClientRect(), br = body.getBoundingClientRect();
    var hidden = wr.bottom <= br.top + 1;
    var list = box.querySelector('.grp.yo');
    // 欄の高さではなく、名簿そのものが何px動いたかで測ります
    var before = list ? list.getBoundingClientRect().top : 0;

    drawChosen(wrap);

    if (hidden && list) {
      var d = list.getBoundingClientRect().top - before;
      if (d) body.scrollTop += d;
    }
  }

  /** 上の欄から外します。下の名簿は色だけ塗り替えます(位置はそのまま) */
  function unpick(name) {
    var sh = S.sheet;
    if (!sh || !sh.members[name]) return;
    delete sh.members[name];
    // よそのセルから連れてくる予約もしていたら、あわせて取り消します
    sh.moves = sh.moves.filter(function (mv) { return mv.name !== name; });
    restyleChips(name);
    updateCount();
  }

  /**
   * その人がいまどの状態か。
   *   'on'      いま選んでいる
   *   'free'    余っている
   *   'rest'    その日は休み
   *   'to:注番' その日ほかの工事に入っている
   */
  function chipState(name) {
    var sh = S.sheet;
    if (sh.members[name]) return 'on';
    var where = ((sh.day.placements[name] || [])).filter(function (k) { return k !== sh.jobKey; });
    var onJob = where.filter(function (k) { return k !== YY.REST_KEY; });
    if (onJob.length) return 'to:' + onJob[0];
    if (where.indexOf(YY.REST_KEY) >= 0) return 'rest';
    return 'free';
  }

  /** チップの見た目だけを塗り替えます(位置は動かしません) */
  function styleChip(b, name, unknown) {
    var sh = S.sheet;
    var st = chipState(name);
    var coop = YY.isCoop(name) ? ' coop' : '';
    if (unknown) coop += ' unknown';
    /* 名簿のチップには ✓ を付けません。選んでいることは緑と、
       上の「選んでいる人」の欄で分かります。
       こうすると選んでも幅が変わらないので、名簿の折り返しがずれません */
    if (st === 'on') {
      var mk = sh.members[name].mark || '';
      b.className = 'chip on' + coop;
      b.innerHTML = (mk ? '<span class="sc">' + esc(mk) + '</span>' : '') + esc(name);
      b.title = '';
    } else if (st === 'rest') {
      b.className = 'chip rest';
      b.innerHTML = esc(name);
      b.title = name + ' … この日は休み';
    } else if (st.indexOf('to:') === 0) {
      // チップは名前だけ。行き先は色(灰の破線)とツールチップで分かります
      b.className = 'chip placed';
      b.innerHTML = esc(name);
      b.title = name + ' … この日は「' + YY.jobLabel(st.slice(3)).name + '」';
    } else {
      b.className = 'chip' + coop;
      b.innerHTML = esc(name);
      b.title = '';
    }
  }

  /**
   * 名前チップ。押しても並びは変わらず、その場で色だけ変わります。
   *   余っている人   … 1回目で選ぶ / 2回目でしるし / 3回目で外す
   *   行き先がある人 … 確かめてから連れてきます
   */
  function pickChip(name, unknown) {
    var sh = S.sheet;
    var b = document.createElement('button');
    styleChip(b, name, unknown);
    b.addEventListener('click', function () {
      var st = chipState(name);

      if (st === 'on') {
        // 2回目 = しるしを選ぶ吹き出しを、このチップのすぐそばに出します
        openMarkPop(b, name);
        return;
      } else if (st === 'free') {
        sh.members[name] = { mark: '', ord: YY.nextOrd(sh.members) };
      } else {
        var from = (st === 'rest') ? YY.REST_KEY : st.slice(3);
        // 行き先はチップに出していないので、ここではっきり伝えます
        var msg = (st === 'rest')
          ? name + ' さんはこの日「休み」です。\n「' + YY.jobLabel(sh.jobKey).name + '」に入れますか?'
          : name + ' さんはこの日「' + YY.jobLabel(from).name + '」に入っています。\n' +
            '「' + YY.jobLabel(sh.jobKey).name + '」に移動しますか?';
        if (!confirm(msg)) return;
        sh.moves.push({ jobKey: from, dateKey: sh.dateKey, name: name });
        sh.members[name] = { mark: '', ord: YY.nextOrd(sh.members) };
      }

      // 描き直さずに、その人のチップと下の表示だけ更新します(スクロールが動きません)
      restyleChips(name);
      updateCount();
    });
    return b;
  }

  /* --- しるしの吹き出し ------------------------------------------------
     押したチップのすぐ下(入らなければ上)に出します。
     固定の場所ではないので、画面外で気づかない、ということが起きません。
     ------------------------------------------------------------------- */

  function openMarkPop(chip, name) {
    var sh = S.sheet; if (!sh || !sh.members[name]) return;
    var unknown = !YY.isKnown(name);
    var cur = sh.members[name].mark || '';
    var pop = $('markpop');
    pop.innerHTML = '';
    pop.appendChild(el('div', 'arrow', ''));

    var inr = el('div', 'in', '');
    inr.appendChild(el('div', 'who', esc(name) + ' に付けるしるし'));

    var row = el('div', 'row', '');
    YY.MARKS.forEach(function (mk) {
      var b = document.createElement('button');
      b.textContent = mk === '' ? 'なし' : mk;
      b.className = (cur === mk ? 'on' : '') + (mk === '' ? ' none' : '');
      if (mk === YY.FOREMAN_MARK) b.title = 'このマスの職長';
      b.addEventListener('click', function () {
        sh.members[name].mark = mk;
        restyleChips(name);
        closeMarkPop();
        updateCount();
      });
      row.appendChild(b);
    });
    inr.appendChild(row);

    /* その他:自由に打てるしるし(4文字まで) */
    var free = el('div', 'freemark', '<span class="lb3">その他</span>');
    var fi = document.createElement('input');
    fi.type = 'text';
    fi.maxLength = YY.MARK_MAX;
    fi.placeholder = '例:AM・PM・採寸';
    fi.value = (YY.MARKS.indexOf(cur) >= 0) ? '' : cur;   // ボタンに無いしるしなら出しておきます
    fi.addEventListener('click', function (e) { e.stopPropagation(); });
    var apply = function () {
      sh.members[name].mark = YY.cleanMark(fi.value);
      restyleChips(name);
      closeMarkPop();
      updateCount();
    };
    fi.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); apply(); }
      if (e.key === 'Escape') { e.preventDefault(); closeMarkPop(); }
    });
    var fb = document.createElement('button');
    fb.className = 'ok3';
    fb.textContent = 'つける';
    fb.addEventListener('click', apply);
    free.appendChild(fi);
    free.appendChild(fb);
    inr.appendChild(free);

    inr.appendChild(el('div', 'hint2',
      '◎=このマスの職長(何人でも付けられます)<br>そのほかのしるしに決まりはありません'));

    var off = document.createElement('button');
    off.className = 'off';
    off.textContent = 'この人をここから外す';
    off.addEventListener('click', function () {
      delete sh.members[name];
      sh.moves = sh.moves.filter(function (m) { return m.name !== name; });
      restyleChips(name);
      closeMarkPop();
      updateCount();
    });
    inr.appendChild(off);
    pop.appendChild(inr);

    S.markChip = chip;
    $('markmask').classList.add('on');
    pop.classList.add('on');
    positionMarkPop();
  }

  function closeMarkPop() {
    S.markChip = null;
    $('markpop').classList.remove('on');
    $('markmask').classList.remove('on');
  }

  /** 押したチップを指す位置に置きます。画面の端でははみ出さないよう寄せます */
  function positionMarkPop() {
    var chip = S.markChip; if (!chip) return;
    var pop = $('markpop');
    var a = chip.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight, pad = 12;

    // 指している相手が画面から出たら閉じます(吹き出しだけ取り残さないため)
    if (a.bottom < 0 || a.top > window.innerHeight) { closeMarkPop(); return; }

    var vh = window.innerHeight, gap = 8;
    var fitsBelow = (a.bottom + gap + ph) <= (vh - pad);
    var fitsAbove = (a.top - gap - ph) >= pad;
    var top, below, noarrow = false;
    if (fitsBelow) { below = true; top = a.bottom + gap; }
    else if (fitsAbove) { below = false; top = a.top - gap - ph; }
    else { below = true; top = Math.max(pad, Math.min(a.bottom + gap, vh - ph - pad)); noarrow = true; }
    pop.classList.toggle('below', below);
    pop.classList.toggle('above', !below);
    pop.classList.toggle('noarrow', noarrow);
    pop.style.top = top + 'px';

    // チップの中心に合わせ、はみ出す分だけ寄せます
    var sf = safeLR();
    var left = a.left + a.width / 2 - pw / 2;
    left = Math.max(pad + sf.l, Math.min(left, window.innerWidth - pw - pad - sf.r));
    pop.style.left = left + 'px';

    var ar = pop.querySelector('.arrow');
    if (ar) {
      var cx = a.left + a.width / 2 - left - 6;
      ar.style.left = Math.max(12, Math.min(pw - 24, cx)) + 'px';
    }
  }

  /** 「いま選んでいるのは○名」と、上の内訳を書き替えます */
  function updateCount() {
    var sh = S.sheet; if (!sh) return;
    // 人数が変わる場面はすべてここを通るので、上の欄もここで作り直します
    updateChosen();
    var box = $('sheet');
    var n = Object.keys(sh.members).length + sh.extras.length;
    var el1 = box.querySelector('#nowSel');
    if (el1) el1.innerHTML = 'いま選んでいるのは <b>' + n + '名</b>';

    var free = 0, placed = 0, rest = 0;
    YY.selectableWorkers(sh.members).forEach(function (w) {
      var st = chipState(w.name);
      if (st === 'free') free++;
      else if (st === 'rest') rest++;
      else if (st.indexOf('to:') === 0) placed++;
    });
    var el2 = box.querySelector('#yoSum');
    if (el2) {
      el2.innerHTML = '余' + free + '名 / 配置ずみ' + placed + '名' +
        (rest ? ' / 休み' + rest + '名' : '');
    }
  }

  /** 「きめる」。このセルと、連れてきた元のセルだけを書きます */
  function commitSheet() {
    var sh = S.sheet; if (!sh) return;
    if (!S.online) { toast('電波が届いていません'); return; }

    var jobs = [];

    // 元のセルから外す
    var byCell = {};
    sh.moves.forEach(function (mv) {
      var k = mv.jobKey + '|' + mv.dateKey;
      byCell[k] = byCell[k] || { jobKey: mv.jobKey, dateKey: mv.dateKey, names: [] };
      byCell[k].names.push(mv.name);
    });
    Object.keys(byCell).forEach(function (k) {
      var mv = byCell[k];
      var src = YY.cellOf(S.week, mv.jobKey, mv.dateKey);
      var mem = {};
      Object.keys(src.members).forEach(function (n) {
        if (mv.names.indexOf(n) < 0) mem[n] = src.members[n];
      });
      jobs.push(YY.saveCell(S.monday, mv.jobKey, mv.dateKey, { members: mem, extras: src.extras }));
    });

    // このセル
    jobs.push(YY.saveCell(S.monday, sh.jobKey, sh.dateKey, {
      members: sh.members, extras: sh.extras
    }));

    closeSheet();
    Promise.all(jobs).then(function () { toast('保存しました'); })
      .catch(function (e) { toast('保存できませんでした:' + (e && e.message ? e.message : '')); });
  }

  /* =================================================================
     画面4「配信」= LINEに貼る文
     ================================================================= */

  /**
   * 曜日ピル7つ。チェックと配信で共通に使います。
   * ⚠(重複)が1件でもある日には赤い点を付けます。
   * 選んだ日は両方のタブで引き継ぎます(チェックした日をそのまま配信できます)。
   */
  function dayPills() {
    var days = YY.weekDates(S.monday);
    // 開いた直後は、きょう(その週になければ月曜)を選びます
    if (days.indexOf(S.pickDate) < 0) {
      var t = YY.todayKey();
      S.pickDate = (days.indexOf(t) >= 0) ? t : days[0];
    }
    var pills = el('div', 'daypills', '');
    days.forEach(function (d, i) {
      var day = YY.computeDay(S.week, d);
      var dt = YY.parseKey(d);
      var btn = document.createElement('button');
      btn.className = (d === S.pickDate ? 'on ' : '') + (i === 5 ? 'sat' : i === 6 ? 'sun' : '');
      btn.innerHTML = '<div class="w">' + YY.DOW[i] + '</div>' +
        '<div class="d">' + dt.getDate() + '</div>' +
        (day.dup.length ? '<span class="dot"></span>' : '');
      btn.title = day.dup.length ? '⚠ 重複が' + day.dup.length + '件あります' : '';
      btn.addEventListener('click', function () { S.pickDate = d; render(); });
      pills.appendChild(btn);
    });
    return pills;
  }

  /* =================================================================
     画面2「チェック」= 重複・余・休みを見る
     ================================================================= */

  function renderCheck(b) {
    b.appendChild(weekNav());
    b.appendChild(dayPills());

    var st = YY.computeDay(S.week, S.pickDate);
    var box = el('div', 'checks', '');

    /* ⚠ 重複(2か所に入っている) */
    var c1 = el('div', 'card dup',
      '<div class="ct"><div class="t">⚠ 重複(2か所に入っている)</div>' +
      '<span class="n">' + st.dup.length + '名</span></div>');
    if (!st.dup.length) {
      c1.appendChild(el('div', 'msg', 'この日は重複していません'));
    } else {
      var d1 = el('div', 'body2', '');
      st.dup.forEach(function (x) {
        // 行き先を2つとも(3か所以上なら全部)併記します
        var mark = markOf(st, x.name);
        var to = x.jobs.map(function (k) { return YY.jobLabel(k).name; }).join(' と ');
        d1.appendChild(el('div', 'dupitem',
          '<div class="nm3">' + (mark ? '<span class="sc">' + esc(mark) + '</span>' : '') +
          '<span class="wv">' + esc(x.name) + '</span></div>' +
          '<div class="to">' + esc(to) + '</div>'));
      });
      c1.appendChild(d1);
    }
    box.appendChild(c1);

    /* 🟡 余(まだ配置されていない) */
    var c2 = el('div', 'card yo2',
      '<div class="ct"><div class="t">🟡 余(まだ配置されていない)</div>' +
      '<span class="n">' + st.free.length + '名</span></div>');
    if (!st.free.length) {
      c2.appendChild(el('div', 'msg', '全員どこかに入っています'));
    } else {
      var d2 = el('div', 'body2', '');
      st.free.forEach(function (n) {
        d2.appendChild(el('span', 'pill2' + (YY.isCoop(n) ? ' coop' : ''), esc(n)));
      });
      c2.appendChild(d2);
    }
    box.appendChild(c2);

    /* 休み */
    var c3 = el('div', 'card rest2',
      '<div class="ct"><div class="t">休み</div>' +
      '<span class="n">' + st.rest.length + '名</span></div>');
    if (!st.rest.length) {
      c3.appendChild(el('div', 'msg', 'この日は休みの人はいません'));
    } else {
      var d3 = el('div', 'body2', '');
      // 並びは表と同じ(◎が先頭、あとは選んだ順)

  /**
   * クリップボードへ。使えない環境では textarea を出して
   * 手で選べるようにします(古い端末や http のときに起きます)。
   */
  function copyLine(text, b) {
    var done = function () { toast('✅ コピーしました。LINEに貼ってください'); };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
    } else {
      fallback();
    }

    function fallback() {
      // まず昔ながらの方法を試します
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var okd = false;
      try { okd = document.execCommand('copy'); } catch (e) { okd = false; }
      document.body.removeChild(ta);
      if (okd) { done(); return; }

      // それも駄目なら、選んでコピーしてもらう欄を出します
      if (b.querySelector('.copyfall')) return;
      var box = el('div', 'copyfall',
        '<div class="t">この端末では自動でコピーできません。下の文をおしてから、長おし→コピーしてください</div>');
      var t2 = document.createElement('textarea');
      t2.value = text;
      t2.readOnly = true;
      t2.addEventListener('focus', function () { t2.select(); });
      box.appendChild(t2);
      b.appendChild(box);
      t2.focus(); t2.select();
    }
  }
