    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });

    if (keepTop) body.scrollTop = keepTop;
  }

  /**
   * その人がいまどの状態か。
   *   'on'      いま選んでいる
   *   'free'    余っている
   *   'rest'    その日は休み
   *   'to:注番' その日ほかの工事に入っている
   */
  function chipState(name) {
    var sh = S.sheet;
    if (sh.members[name]) return 'on';
    var where = ((sh.day.placements[name] || [])).filter(function (k) { return k !== sh.jobKey; });
    var onJob = where.filter(function (k) { return k !== YY.REST_KEY; });
    if (onJob.length) return 'to:' + onJob[0];
    if (where.indexOf(YY.REST_KEY) >= 0) return 'rest';
    return 'free';
  }

  /** チップの見た目だけを塗り替えます(位置は動かしません) */
  function styleChip(b, name, unknown) {
    var sh = S.sheet;
    var st = chipState(name);
    var coop = YY.isCoop(name) ? ' coop' : '';
    if (unknown) coop += ' unknown';
    if (st === 'on') {
      var mk = sh.members[name].mark || '';
      b.className = 'chip on' + coop;
      b.innerHTML = (mk ? '<span class="sc">' + esc(mk) + '</span>' : '') + esc(name) + ' ✓';
      b.title = '';
    } else if (st === 'rest') {
      b.className = 'chip rest';
      b.innerHTML = esc(name);
      b.title = name + ' … この日は休み';
    } else if (st.indexOf('to:') === 0) {
      // チップは名前だけ。行き先は色(灰の破線)とツールチップで分かります
      b.className = 'chip placed';
      b.innerHTML = esc(name);
      b.title = name + ' … この日は「' + YY.jobLabel(st.slice(3)).name + '」';
    } else {
      b.className = 'chip' + coop;
      b.innerHTML = esc(name);
      b.title = '';
    }
  }

  /**
   * 名前チップ。押しても並びは変わらず、その場で色だけ変わります。
   *   余っている人   … 1回目で選ぶ / 2回目でしるし / 3回目で外す
   *   行き先がある人 … 確かめてから連れてきます
   */
  function pickChip(name, unknown) {
    var sh = S.sheet;
    var b = document.createElement('button');
    styleChip(b, name, unknown);
    b.addEventListener('click', function () {
      var st = chipState(name);

      if (st === 'on') {
        // 2回目 = しるしを選ぶ吹き出しを、このチップのすぐそばに出します
        openMarkPop(b, name);
        return;
      } else if (st === 'free') {
        sh.members[name] = { mark: '', ord: YY.nextOrd(sh.members) };
      } else {
        var from = (st === 'rest') ? YY.REST_KEY : st.slice(3);
        // 行き先はチップに出していないので、ここではっきり伝えます
        var msg = (st === 'rest')
          ? name + ' さんはこの日「休み」です。\n「' + YY.jobLabel(sh.jobKey).name + '」に入れますか?'
          : name + ' さんはこの日「' + YY.jobLabel(from).name + '」に入っています。\n' +
            '「' + YY.jobLabel(sh.jobKey).name + '」に移動しますか?';
        if (!confirm(msg)) return;
        sh.moves.push({ jobKey: from, dateKey: sh.dateKey, name: name });
        sh.members[name] = { mark: '', ord: YY.nextOrd(sh.members) };
      }

      // 描き直さずに、押したチップと下の表示だけ更新します(スクロールが動きません)
      styleChip(b, name, unknown);
      updateCount();
    });
    return b;
  }

  /* --- しるしの吹き出し ------------------------------------------------
     押したチップのすぐ下(入らなければ上)に出します。
     固定の場所ではないので、画面外で気づかない、ということが起きません。
     ------------------------------------------------------------------- */

  function openMarkPop(chip, name) {
    var sh = S.sheet; if (!sh || !sh.members[name]) return;
    var unknown = !YY.isKnown(name);
    var cur = sh.members[name].mark || '';
    var pop = $('markpop');
    pop.innerHTML = '';
    pop.appendChild(el('div', 'arrow', ''));

    var inr = el('div', 'in', '');
    inr.appendChild(el('div', 'who', esc(name) + ' に付けるしるし'));

    var row = el('div', 'row', '');
    YY.MARKS.forEach(function (mk) {
      var b = document.createElement('button');
      b.textContent = mk === '' ? 'なし' : mk;
      b.className = (cur === mk ? 'on' : '') + (mk === '' ? ' none' : '');
      if (mk === YY.FOREMAN_MARK) b.title = 'このマスの職長';
      b.addEventListener('click', function () {
        sh.members[name].mark = mk;
        styleChip(chip, name, unknown);
        closeMarkPop();
        updateCount();
      });
      row.appendChild(b);
    });
    inr.appendChild(row);

    /* その他:自由に打てるしるし(4文字まで) */
    var free = el('div', 'freemark', '<span class="lb3">その他</span>');
    var fi = document.createElement('input');
    fi.type = 'text';
    fi.maxLength = YY.MARK_MAX;
    fi.placeholder = '例:AM・PM・採寸';
    fi.value = (YY.MARKS.indexOf(cur) >= 0) ? '' : cur;   // ボタンに無いしるしなら出しておきます
    fi.addEventListener('click', function (e) { e.stopPropagation(); });
    var apply = function () {
      sh.members[name].mark = YY.cleanMark(fi.value);
      styleChip(chip, name, unknown);
      closeMarkPop();
      updateCount();
    };
    fi.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); apply(); }
      if (e.key === 'Escape') { e.preventDefault(); closeMarkPop(); }
    });
    var fb = document.createElement('button');
    fb.className = 'ok3';
    fb.textContent = 'つける';
    fb.addEventListener('click', apply);
    free.appendChild(fi);
    free.appendChild(fb);
    inr.appendChild(free);

    inr.appendChild(el('div', 'hint2',
      '◎=このマスの職長(何人でも付けられます)<br>そのほかのしるしに決まりはありません'));

    var off = document.createElement('button');
    off.className = 'off';
    off.textContent = 'この人をここから外す';
    off.addEventListener('click', function () {
      delete sh.members[name];
      sh.moves = sh.moves.filter(function (m) { return m.name !== name; });
      styleChip(chip, name, unknown);
      closeMarkPop();
      updateCount();
    });
    inr.appendChild(off);
    pop.appendChild(inr);

    S.markChip = chip;
    $('markmask').classList.add('on');
    pop.classList.add('on');
    positionMarkPop();
  }

  function closeMarkPop() {
    S.markChip = null;
    $('markpop').classList.remove('on');
    $('markmask').classList.remove('on');
  }

  /** 押したチップを指す位置に置きます。画面の端でははみ出さないよう寄せます */
  function positionMarkPop() {
    var chip = S.markChip; if (!chip) return;
    var pop = $('markpop');
    var a = chip.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight, pad = 12;

    // 指している相手が画面から出たら閉じます(吹き出しだけ取り残さないため)
    if (a.bottom < 0 || a.top > window.innerHeight) { closeMarkPop(); return; }

    var vh = window.innerHeight, gap = 8;
    var fitsBelow = (a.bottom + gap + ph) <= (vh - pad);
    var fitsAbove = (a.top - gap - ph) >= pad;
    var top, below, noarrow = false;
    if (fitsBelow) { below = true; top = a.bottom + gap; }
    else if (fitsAbove) { below = false; top = a.top - gap - ph; }
    else { below = true; top = Math.max(pad, Math.min(a.bottom + gap, vh - ph - pad)); noarrow = true; }
    pop.classList.toggle('below', below);
    pop.classList.toggle('above', !below);
    pop.classList.toggle('noarrow', noarrow);
    pop.style.top = top + 'px';

    // チップの中心に合わせ、はみ出す分だけ寄せます
    var sf = safeLR();
    var left = a.left + a.width / 2 - pw / 2;
    left = Math.max(pad + sf.l, Math.min(left, window.innerWidth - pw - pad - sf.r));
    pop.style.left = left + 'px';

    var ar = pop.querySelector('.arrow');
    if (ar) {
      var cx = a.left + a.width / 2 - left - 6;
      ar.style.left = Math.max(12, Math.min(pw - 24, cx)) + 'px';
    }
  }

  /** 「いま選んでいるのは○名」と、上の内訳を書き替えます */
  function updateCount() {
    var sh = S.sheet; if (!sh) return;
    var box = $('sheet');
    var n = Object.keys(sh.members).length + sh.extras.length;
    var el1 = box.querySelector('#nowSel');
    if (el1) el1.innerHTML = 'いま選んでいるのは <b>' + n + '名</b>';

    var free = 0, placed = 0, rest = 0;
    YY.selectableWorkers(sh.members).forEach(function (w) {
      var st = chipState(w.name);
      if (st === 'free') free++;
      else if (st === 'rest') rest++;
      else if (st.indexOf('to:') === 0) placed++;
    });
    var el2 = box.querySelector('#yoSum');
    if (el2) {
      el2.innerHTML = '余' + free + '名 / 配置ずみ' + placed + '名' +
        (rest ? ' / 休み' + rest + '名' : '');
    }
  }

  /** 「きめる」。このセルと、連れてきた元のセルだけを書きます */
  function commitSheet() {
    var sh = S.sheet; if (!sh) return;
    if (!S.online) { toast('電波が届いていません'); return; }

    var jobs = [];

    // 元のセルから外す
    var byCell = {};
    sh.moves.forEach(function (mv) {
      var k = mv.jobKey + '|' + mv.dateKey;
      byCell[k] = byCell[k] || { jobKey: mv.jobKey, dateKey: mv.dateKey, names: [] };
      byCell[k].names.push(mv.name);
    });
    Object.keys(byCell).forEach(function (k) {
      var mv = byCell[k];
      var src = YY.cellOf(S.week, mv.jobKey, mv.dateKey);
      var mem = {};
      Object.keys(src.members).forEach(function (n) {
        if (mv.names.indexOf(n) < 0) mem[n] = src.members[n];
      });
      jobs.push(YY.saveCell(S.monday, mv.jobKey, mv.dateKey, { members: mem, extras: src.extras }));
    });

    // このセル
    jobs.push(YY.saveCell(S.monday, sh.jobKey, sh.dateKey, {
      members: sh.members, extras: sh.extras
    }));

    closeSheet();
    Promise.all(jobs).then(function () { toast('保存しました'); })
      .catch(function (e) { toast('保存できませんでした:' + (e && e.message ? e.message : '')); });
  }

  /* =================================================================
     画面4「配信」= LINEに貼る文
     ================================================================= */

  /**
   * 曜日ピル7つ。チェックと配信で共通に使います。
   * ⚠(重複)が1件でもある日には赤い点を付けます。
   * 選んだ日は両方のタブで引き継ぎます(チェックした日をそのまま配信できます)。
   */
  function dayPills() {
    var days = YY.weekDates(S.monday);
    // 開いた直後は、きょう(その週になければ月曜)を選びます
    if (days.indexOf(S.pickDate) < 0) {
      var t = YY.todayKey();
      S.pickDate = (days.indexOf(t) >= 0) ? t : days[0];
    }
    var pills = el('div', 'daypills', '');
    days.forEach(function (d, i) {
      var day = YY.computeDay(S.week, d);
      var dt = YY.parseKey(d);
      var btn = document.createElement('button');
      btn.className = (d === S.pickDate ? 'on ' : '') + (i === 5 ? 'sat' : i === 6 ? 'sun' : '');
      btn.innerHTML = '<div class="w">' + YY.DOW[i] + '</div>' +
        '<div class="d">' + dt.getDate() + '</div>' +
        (day.dup.length ? '<span class="dot"></span>' : '');
      btn.title = day.dup.length ? '⚠ 重複が' + day.dup.length + '件あります' : '';
      btn.addEventListener('click', function () { S.pickDate = d; render(); });
      pills.appendChild(btn);
    });
    return pills;
  }

  /* =================================================================
     画面2「チェック」= 重複・余・休みを見る
     ================================================================= */

  function renderCheck(b) {
    b.appendChild(weekNav());
    b.appendChild(dayPills());

    var st = YY.computeDay(S.week, S.pickDate);
    var box = el('div', 'checks', '');

    /* ⚠ 重複(2か所に入っている) */
    var c1 = el('div', 'card dup',
      '<div class="ct"><div class="t">⚠ 重複(2か所に入っている)</div>' +
      '<span class="n">' + st.dup.length + '名</span></div>');
    if (!st.dup.length) {
      c1.appendChild(el('div', 'msg', 'この日は重複していません'));
    } else {
      var d1 = el('div', 'body2', '');
      st.dup.forEach(function (x) {
        // 行き先を2つとも(3か所以上なら全部)併記します
        var mark = markOf(st, x.name);
        var to = x.jobs.map(function (k) { return YY.jobLabel(k).name; }).join(' と ');
        d1.appendChild(el('div', 'dupitem',
          '<div class="nm3">' + (mark ? '<span class="sc">' + esc(mark) + '</span>' : '') +
          '<span class="wv">' + esc(x.name) + '</span></div>' +
          '<div class="to">' + esc(to) + '</div>'));

      c1.appendChild(d1);
    }
    box.appendChild(c1);

    /* 🟡 余(まだ配置されていない) */
    var c2 = el('div', 'card yo2',
      '<div class="ct"><div class="t">🟡 余(まだ配置されていない)</div>' +
      '<span class="n">' + st.free.length + '名</span></div>');
    if (!st.free.length) {
      c2.appendChild(el('div', 'msg', '全員どこかに入っています'));
    } else {
      var d2 = el('div', 'body2', '');
      st.free.forEach(function (n) {
        d2.appendChild(el('span', 'pill2' + (YY.isCoop(n) ? ' coop' : ''), esc(n)));
      });
      c2.appendChild(d2);
    }
    box.appendChild(c2);

    /* 休み */

  /**
   * クリップボードへ。使えない環境では textarea を出して
   * 手で選べるようにします(古い端末や http のときに起きます)。
   */
  function copyLine(text, b) {
    var done = function () { toast('✅ コピーしました。LINEに貼ってください'); };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
    } else {
      fallback();
    }

    function fallback() {
      // まず昔ながらの方法を試します
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var okd = false;
      try { okd = document.execCommand('copy'); } catch (e) { okd = false; }
      document.body.removeChild(ta);
      if (okd) { done(); return; }

      // それも駄目なら、選んでコピーしてもらう欄を出します
      if (b.querySelector('.copyfall')) return;
      var box = el('div', 'copyfall',
        '<div class="t">この端末では自動でコピーできません。下の文をおしてから、長おし→コピーしてください</div>');
      var t2 = document.createElement('textarea');
      t2.value = text;
      t2.readOnly = true;
      t2.addEventListener('focus', function () { t2.select(); });
      box.appendChild(t2);
      b.appendChild(box);
      t2.focus(); t2.select();
    }
  }

  /* =================================================================
     「前に使った工事」パネル
       直近の週で使った工事のうち、いま表に出ていないものを並べます。
       選んだ工事は yotei/weeks/{月曜}/show に入れて、その週だけ表に出します。
     ================================================================= */

  function openPastPop() {
    if (!S.online) { toast('電波が届いていません'); return; }
    if (!S.nearLoaded) { toast('前の週を読み込み中です。少し待ってください'); return; }

    var used = usedJobIds();
    var show = S.week.show || {};

    // 直近の週(古い順)に、いつ使ったかを集めます
    var lastAt = {};
    Object.keys(S.nearWeeks).sort().forEach(function (wk) {
      var u = YY.usedJobsInWeek(S.nearWeeks[wk]);
      Object.keys(u).forEach(function (id) { lastAt[id] = wk; });
    });

    // いま表に出ている工事は選ぶ必要がないので、外します
    var rows = Object.keys(lastAt).filter(function (id) {
      if (id === YY.REST_KEY) return false;
      var j = YY.master.jobById[id];
      if (!j) return false;
      return !used[id];                    // 今週すでに人が入っているものは除く
    }).map(function (id) {
      return { job: YY.master.jobById[id], week: lastAt[id] };
    }).sort(function (a, b) {
      if (a.week !== b.week) return a.week < b.week ? 1 : -1;   // 新しい週が上
      return YY.master.jobs.indexOf(a.job) - YY.master.jobs.indexOf(b.job);
    });

    S.past = { rows: rows, checked: {} };
    rows.forEach(function (x) { if (show[x.job.id]) S.past.checked[x.job.id] = true; });

    drawPastPop();
    $('pastmask').classList.add('on');
    $('pastpop').classList.add('on');
  }

  function drawPastPop() {
    var P = S.past; if (!P) return;
    var pop = $('pastpop');
    var lb = YY.weekLabel(S.monday);
    var from = YY.weekLabel(YY.addWeeks(S.monday, -YY.JOB_KEEP_WEEKS));

    var h = ['<div class="ph"><div class="t2">⧉ 前に使った工事</div>' +
      '<div class="s2">' + from.range + ' 〜 ' + YY.weekLabel(S.prevMondayKey).range +
      ' に使った工事から選びます。選んだ工事は ' + lb.range + ' の表に出ます</div></div>'];

    if (!P.rows.length) {
      h.push('<div class="pb"><div class="none2">前の週に使った工事は、すべて今週の表に出ています<br>' +
        '<span style="font-size:13px">ほかの工事を出すときは「すべて」に切り替えてください</span></div></div>');
      h.push('<div class="pf"><button id="pclose">とじる</button></div>');
      pop.innerHTML = h.join('');
      $('pclose').addEventListener('click', closePastPop);
      return;
    }

    h.push('<div class="pbar">' +
      '<button id="pall">全部つける</button>' +
      '<button id="pnone">全部はずす</button>' +
      '<span class="cnt4" id="pcnt"></span></div>');

    h.push('<div class="pb">');
    P.rows.forEach(function (x, i) {
      var j = x.job;
      var on = !!P.checked[j.id];
      h.push('<button class="prow' + (on ? ' on' : '') + '" data-i="' + i + '">' +
        '<div class="box">' + (on ? '✓' : '') + '</div>' +
        '<div><div class="jn2">' + esc(j.name) + '</div>' +
        '<div class="sub3">' + (j.no ? esc(j.no) + '・' : '') +
        YY.weekLabel(x.week).range + ' に使いました</div></div></button>');
    });
    h.push('</div>');

    h.push('<div class="pf"><button id="pcancel">やめる</button>' +
      '<button class="ok2" id="pok">決定</button></div>');
    pop.innerHTML = h.join('');

    Array.prototype.forEach.call(pop.querySelectorAll('.prow'), function (b) {
      b.addEventListener('click', function () {
        var x = P.rows[+b.getAttribute('data-i')];
        if (P.checked[x.job.id]) delete P.checked[x.job.id];
        else P.checked[x.job.id] = true;
        drawPastPop();
      });
    });
    $('pall').addEventListener('click', function () {
      P.rows.forEach(function (x) { P.checked[x.job.id] = true; });
      drawPastPop();
    });
    $('pnone').addEventListener('click', function () {
      P.checked = {};
      drawPastPop();
    });
    $('pcancel').addEventListener('click', closePastPop);
    $('pok').addEventListener('click', savePast);

    var n = Object.keys(P.checked).length;
    $('pcnt').textContent = n + '件を選んでいます';
  }

  function closePastPop() {
    S.past = null;
    $('pastpop').classList.remove('on');
    $('pastmask').classList.remove('on');
  }

  function savePast() {
    var P = S.past; if (!P) return;
    // いま出ている「今週出す工事」に、パネルで選んだものを反映します
    var next = {};
    Object.keys(S.week.show || {}).forEach(function (id) {
      // パネルに出ていない工事(今週人が入っているもの)は、そのまま残します
      var inPanel = P.rows.some(function (x) { return x.job.id === id; });
      if (!inPanel) next[id] = true;
    });
    Object.keys(P.checked).forEach(function (id) { next[id] = true; });

    var n = Object.keys(P.checked).length;
    closePastPop();
    YY.setWeekShow(S.monday, next).then(function () {
      toast(n ? n + '件を今週の表に出しました' : '今週出す工事をなしにしました');
    }).catch(function (e) {
      toast('できませんでした:' + (e && e.message ? e.message : ''));
    });
  }

  /* =================================================================
     PC版ツールバー
     ================================================================= */

  /** セルの中身を1つの文字列に。「◎松平・井谷・本山(3名)」 */
  function cellText(jobKey, dateKey) {
    var c = YY.displayCell(S.week, jobKey, dateKey);
    if (!c.count) return '';
    var names = c.rows.map(YY.nameWithMarks).concat(c.extras).join('・');
    return names + '(' + c.count + '名)';
  }

  /** 画面に出ているとおりの表を、行の配列にします */
  function gridRows() {
    var days = YY.weekDates(S.monday);
    var head = ['工事'];
    days.forEach(function (d, i) {
      var dt = YY.parseKey(d);
      head.push(YY.DOW[i] + ' ' + (dt.getMonth() + 1) + '/' + dt.getDate());
    });
    var rows = [head];

    // 休み行
    var rest = ['休み'];
    days.forEach(function (d) { rest.push(cellText(YY.REST_KEY, d)); });
    rows.push(rest);

    // 余 行(計算で出しているぶん)
    var yo = ['🟡 余'];
    days.forEach(function (d) {
      var free = YY.computeDay(S.week, d).free;
      yo.push(free.length ? free.join('・') + '(' + free.length + '名)' : '');
    });
    rows.push(yo);

    // 工事(いま選んでいるカテゴリのとおり)
    var used = usedJobIds();
    var cats = (S.cat === 'all') ? YY.CATEGORIES.order : [S.cat];
    cats.forEach(function (cat) {
      var jobs = YY.jobsByCat(cat, used);
      if (!jobs.length) return;
      if (S.cat === 'all') rows.push([YY.CATEGORIES.labels[cat]]);
      jobs.forEach(function (j) {
        var r = [j.name + (j.no ? '(' + j.no + ')' : '')];
        days.forEach(function (d) { r.push(cellText(j.id, d)); });
        rows.push(r);
      });
    });
    return rows;
  }

  function exportExcel() {
    var lb = YY.weekLabel(S.monday);
    var rows = gridRows();
    var name = 'よつば_週間予定_' + S.monday + '_' + lb.range.replace('〜', '-');

    if (typeof XLSX === 'undefined') {
      var csv = rows.map(function (r) {
        return r.map(function (c) {
          var s = String(c == null ? '' : c);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',');
      }).join('\r\n');
      download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), name + '.csv');
      toast('Excelの部品を読み込めなかったので、CSVで書き出しました');
      return;
    }

    var ws = XLSX.utils.aoa_to_sheet(rows);
    var w = [{ wch: 30 }];
    for (var i = 0; i < 7; i++) w.push({ wch: 24 });
    ws['!cols'] = w;
    ws['!freeze'] = { xSplit: 1, ySplit: 1 };

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, lb.range.replace(/\//g, '.'));
    XLSX.writeFile(wb, name + '.xlsx');
    toast('Excelに書き出しました');
  }

  function download(blob, filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* --- LINE用にコピー(曜日を選んでから) --------------------------- */

  function openDayPop(anchor) {
    var pop = $('daypop');
    pop.innerHTML = '';
    pop.appendChild(el('div', 'arrow', ''));

    var inr = el('div', 'in', '<div class="ttl2">どの日をコピーしますか?</div>');
    var row = el('div', 'row2', '');
    YY.weekDates(S.monday).forEach(function (d, i) {
      var dt = YY.parseKey(d);
      var st = YY.computeDay(S.week, d);
      var b = document.createElement('button');
      if (YY.isToday(d)) b.className = 'today';
      b.innerHTML = '<span class="w">' + YY.DOW[i] + '</span>' +
        '<span class="d">' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</span>' +
        '<span class="n2">' + (st.placedCount ? st.placedCount + '名' : '—') + '</span>';
      b.addEventListener('click', function () { copyDay(d); });
      row.appendChild(b);
    });
    inr.appendChild(row);
    inr.appendChild(el('div', 'hint3', '配信タブと同じ文面をコピーします'));
    pop.appendChild(inr);

    $('daymask').classList.add('on');
    pop.classList.add('on');

    var a = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth, pad = 12;
    var ph2 = pop.offsetHeight;
    pop.style.top = Math.max(pad, Math.min(a.bottom + 8, window.innerHeight - ph2 - pad)) + 'px';
    var sf = safeLR();
    var left = Math.min(a.left, window.innerWidth - pw - pad - sf.r);
    pop.style.left = Math.max(pad + sf.l, left) + 'px';
    var ar = pop.querySelector('.arrow');
    if (ar) {
      var cx = a.left + a.width / 2 - Math.max(pad + sf.l, left) - 6;
      ar.style.left = Math.max(12, Math.min(pw - 24, cx)) + 'px';
    }
  }

  function closeDayPop() {
    $('daypop').classList.remove('on');
    $('daymask').classList.remove('on');
  }

  function copyDay(dateKey) {
    var text = YY.lineText(S.week, dateKey);
    var lbl = YY.dayLabel(dateKey);

    var done = function () {
      closeDayPop();
      toast('✅ ' + lbl + 'をコピーしました。LINEに貼ってください');
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var okd = false;
      try { okd = document.execCommand('copy'); } catch (e) { okd = false; }
      document.body.removeChild(ta);
      if (okd) { done(); return; }

      // 自動でコピーできない端末では、配信タブを開いて手で取れるようにします
      closeDayPop();
      S.pickDate = dateKey;
      S.tab = 'line';
      Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
        x.classList.toggle('on', x.getAttribute('data-tab') === 'line');
      });
      render();
      toast('この端末では自動でコピーできません。配信タブを開きました');
    }
  }

  /* =================================================================
     小道具
     ================================================================= */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  }

  boot();
})();
</script>
