  /* =================================================================
     「前に使った工事」パネル
       直近の週で使った工事のうち、いま表に出ていないものを並べます。
       選んだ工事は yotei/weeks/{月曜}/show に入れて、その週だけ表に出します。
     ================================================================= */

  function openPastPop() {
    if (!S.online) { toast('電波が届いていません'); return; }
    if (!S.nearLoaded) { toast('前の週を読み込み中です。少し待ってください'); return; }

    var used = usedJobIds();
    var show = S.week.show || {};

    // 直近の週(古い順)に、いつ使ったかを集めます
    var lastAt = {};
    Object.keys(S.nearWeeks).sort().forEach(function (wk) {
      var u = YY.usedJobsInWeek(S.nearWeeks[wk]);
      Object.keys(u).forEach(function (id) { lastAt[id] = wk; });
    });

    // いま表に出ている工事は選ぶ必要がないので、外します
    var rows = Object.keys(lastAt).filter(function (id) {
      if (id === YY.REST_KEY) return false;
      var j = YY.master.jobById[id];
      if (!j) return false;
      return !used[id];                    // 今週すでに人が入っているものは除く
    }).map(function (id) {
      return { job: YY.master.jobById[id], week: lastAt[id] };
    }).sort(function (a, b) {
      if (a.week !== b.week) return a.week < b.week ? 1 : -1;   // 新しい週が上
      return YY.master.jobs.indexOf(a.job) - YY.master.jobs.indexOf(b.job);
    });

    S.past = { rows: rows, checked: {} };
    rows.forEach(function (x) { if (show[x.job.id]) S.past.checked[x.job.id] = true; });

    drawPastPop();
    $('pastmask').classList.add('on');
    $('pastpop').classList.add('on');
  }

  function drawPastPop() {
    var P = S.past; if (!P) return;
    var pop = $('pastpop');
    var lb = YY.weekLabel(S.monday);
    var from = YY.weekLabel(YY.addWeeks(S.monday, -YY.JOB_KEEP_WEEKS));

    var h = ['<div class="ph"><div class="t2">⧉ 前に使った工事</div>' +
      '<div class="s2">' + from.range + ' 〜 ' + YY.weekLabel(S.prevMondayKey).range +
      ' に使った工事から選びます。選んだ工事は ' + lb.range + ' の表に出ます</div></div>'];

    if (!P.rows.length) {
      h.push('<div class="pb"><div class="none2">前の週に使った工事は、すべて今週の表に出ています<br>' +
        '<span style="font-size:13px">ほかの工事を出すときは「すべて」に切り替えてください</span></div></div>');
      h.push('<div class="pf"><button id="pclose">とじる</button></div>');
      pop.innerHTML = h.join('');
      $('pclose').addEventListener('click', closePastPop);
      return;
    }

    h.push('<div class="pbar">' +
      '<button id="pall">全部つける</button>' +
      '<button id="pnone">全部はずす</button>' +
      '<span class="cnt4" id="pcnt"></span></div>');

    h.push('<div class="pb">');
    P.rows.forEach(function (x, i) {
      var j = x.job;
      var on = !!P.checked[j.id];
      h.push('<button class="prow' + (on ? ' on' : '') + '" data-i="' + i + '">' +
        '<div class="box">' + (on ? '✓' : '') + '</div>' +
        '<div><div class="jn2">' + esc(j.name) + '</div>' +
        '<div class="sub3">' + (j.no ? esc(j.no) + '・' : '') +
        YY.weekLabel(x.week).range + ' に使いました</div></div></button>');
    });
    h.push('</div>');

    h.push('<div class="pf"><button id="pcancel">やめる</button>' +
      '<button class="ok2" id="pok">決定</button></div>');
    pop.innerHTML = h.join('');

    Array.prototype.forEach.call(pop.querySelectorAll('.prow'), function (b) {
      b.addEventListener('click', function () {
        var x = P.rows[+b.getAttribute('data-i')];
        if (P.checked[x.job.id]) delete P.checked[x.job.id];
        else P.checked[x.job.id] = true;
        drawPastPop();
      });
    });
    $('pall').addEventListener('click', function () {
      P.rows.forEach(function (x) { P.checked[x.job.id] = true; });
      drawPastPop();
    });
    $('pnone').addEventListener('click', function () {
      P.checked = {};
      drawPastPop();
    });
    $('pcancel').addEventListener('click', closePastPop);
    $('pok').addEventListener('click', savePast);

    var n = Object.keys(P.checked).length;
    $('pcnt').textContent = n + '件を選んでいます';
  }

  function closePastPop() {
    S.past = null;
    $('pastpop').classList.remove('on');
    $('pastmask').classList.remove('on');
  }

  function savePast() {
    var P = S.past; if (!P) return;
    // いま出ている「今週出す工事」に、パネルで選んだものを反映します
    var next = {};
    Object.keys(S.week.show || {}).forEach(function (id) {
      // パネルに出ていない工事(今週人が入っているもの)は、そのまま残します
      var inPanel = P.rows.some(function (x) { return x.job.id === id; });
      if (!inPanel) next[id] = true;
    });
    Object.keys(P.checked).forEach(function (id) { next[id] = true; });

    var n = Object.keys(P.checked).length;
    closePastPop();
    YY.setWeekShow(S.monday, next).then(function () {
      YY.addLog(S.monday, {
        kind: '表に出す工事',
        note: n ? n + '件を今週の表に出しました' : '今週出す工事をなしにしました'
      });
      toast(n ? n + '件を今週の表に出しました' : '今週出す工事をなしにしました');
    }).catch(function (e) {
      toast('できませんでした:' + (e && e.message ? e.message : ''));
    });
  }

  /* =================================================================
     上部をたたむ(スマホだけ)
       スマホは上下の固定部分で画面の半分近くが埋まるので、
       予定を組むタブでは上のひとかたまりをまとめて隠せるようにします。
       たたんだ状態はこの端末に覚えます。
     ================================================================= */

  var FOLD_KEY = 'yotsuba.yotei.fold';

  function getFold() {
    try { return window.localStorage.getItem(FOLD_KEY) === '1'; } catch (e) { return false; }
  }
  function setFold(on) {
    try { window.localStorage.setItem(FOLD_KEY, on ? '1' : '0'); } catch (e) { /* 覚えられなくても動きます */ }
  }

  function drawFoldBar() {
    var bar = $('foldBar');
    var app = $('app');

    // 予定を組むタブだけ。ほかのタブでは出しません
    if (S.tab !== 'plan') {
      bar.classList.remove('on');
      app.classList.remove('fold');
      return;
    }
    bar.classList.add('on');
    app.classList.toggle('fold', S.fold);

    var lb = YY.weekLabel(S.monday);
    if (S.fold) {
      // たたんだとき … どの週かを出し、前後にも動けるようにします
      bar.innerHTML =
        '<button class="mv2" id="fbPrev" title="1週まえ">◀</button>' +
        '<div class="wk3">' + lb.range + '<span>' + lb.year + '</span></div>' +
        '<button class="mv2" id="fbNext" title="1週さき">▶</button>' +
        '<button class="fb" id="fbToggle">▼ ひらく</button>';
      $('fbPrev').addEventListener('click', function () { goWeek(-1); });
      $('fbNext').addEventListener('click', function () { goWeek(1); });
    } else {
      bar.innerHTML =
        '<button class="fb" id="fbToggle">▲ たたむ</button>' +
        '<div class="wk3" style="text-align:left;font-size:12px;color:var(--usu);font-weight:700">' +
        '上の週ナビ・分類・絞り込みを隠して、表を広く使えます</div>';
    }
    $('fbToggle').addEventListener('click', function () {
      S.fold = !S.fold;
      setFold(S.fold);
      drawFoldBar();
      toast(S.fold ? '上をたたみました' : '上をひらきました');
    });
  }

  /* =================================================================
     最終編集の帯と、保存に残す名前
       名前はこの端末に覚えます(localStorage)。
       保存するたび yotei/weeks/{週}/updatedAt・updatedBy が更新されます。
     ================================================================= */

  /** ミリ秒 → '8/22 14:30' */
  function stamp(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /** 最終編集の帯を書き替えます */
  function drawLastEdit() {
    var e = $('obiLast');
    // メンバータブは週と関係がないので出しません
    if (S.tab === 'members') { e.classList.remove('on'); return; }

    var w = S.week || {};
    var me = YY.getOperator();
    var body = w.updatedAt
      ? '✏ 最終編集 <span class="when">' + esc(stamp(w.updatedAt)) + '</span> ' +
        '<span class="who">' + esc(w.updatedBy || '—') + '</span>'
      : '<span class="none4">✏ この週は、まだ編集されていません</span>';

    e.innerHTML = body +
      '<button class="hist" id="btnHist">🕘 履歴</button>' +
      '<button class="me2" id="btnMe">👤 ' + esc(me || '名前を入れる') + '</button>';
    e.classList.add('on');
    $('btnHist').addEventListener('click', openLogPop);
    $('btnMe').addEventListener('click', function () { openNamePop(false); });
  }

  /** 名前を決める吹き出し。first=true は、まだ名前が無いときの初回です */
  function openNamePop(first) {
    var pop = $('namepop');
    pop.innerHTML =
      '<div class="nh"><div class="t3">👤 あなたの名前</div>' +
      '<div class="s3">予定を保存したときに「だれが編集したか」として残ります。' +
      'この端末に覚えるので、次からは聞きません</div></div>' +
      '<div class="nb">' +
      '<input id="nameIn" maxlength="' + YY.OPERATOR_MAX + '" placeholder="例:松高">' +
      '<div class="hint5">' + YY.OPERATOR_MAX + '文字まで。空にすると「事務所」で残ります</div>' +
      '</div>' +
      '<div class="nf">' +
      (first ? '' : '<button id="nameCancel">やめる</button>') +
      '<button class="ok4" id="nameOk">決定</button></div>';

    var inp = $('nameIn');
    inp.value = YY.getOperator();
    var ok = function () {
      YY.setOperator(inp.value);
      closeNamePop();
      drawLastEdit();
      var v = YY.getOperator();
      toast(v ? '「' + v + '」で保存します' : '「事務所」で保存します');
    };
    $('nameOk').addEventListener('click', ok);
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); ok(); }
      if (ev.key === 'Escape' && !first) { ev.preventDefault(); closeNamePop(); }
    });
    var c = $('nameCancel');
    if (c) c.addEventListener('click', closeNamePop);

    $('namemask').classList.add('on');
    pop.classList.add('on');
    setTimeout(function () { inp.focus(); inp.select(); }, 50);
  }

  function closeNamePop() {
    $('namepop').classList.remove('on');
    $('namemask').classList.remove('on');
  }

  /* =================================================================
     編集履歴
       いま見ている週から何週かぶんを読み、週ごとに分けて新しい順に出します。
       全部の週を一度に読むと重いので、まず6週ぶん読んで、
       足りなければ「さらに前を見る」で6週ずつ足します。
     ================================================================= */

  var LOG_STEP = 6;                 // 一度に読む週の数

  function openLogPop() {
    S.log = { weeks: [], rows: {}, span: 0, loading: false };
    $('logmask').classList.add('on');
    $('logpop').classList.add('on');
    drawLogPop();
    loadMoreLogs();
  }

  function closeLogPop() {
    S.log = null;
    $('logpop').classList.remove('on');
    $('logmask').classList.remove('on');
  }

  /** さらに LOG_STEP 週ぶん、古いほうへ読み進めます */
  function loadMoreLogs() {
    var L = S.log; if (!L || L.loading) return;
    L.loading = true;
    drawLogPop();

    var add = [];
    for (var i = 0; i < LOG_STEP; i++) add.push(YY.addWeeks(S.monday, -(L.span + i)));
    L.span += LOG_STEP;

    Promise.all(add.map(function (wk) {
      return YY.loadLogs(wk).then(function (rows) { return { wk: wk, rows: rows }; });
    })).then(function (list) {
      if (S.log !== L) return;              // 待っている間に閉じられた
      list.forEach(function (x) {
        if (L.weeks.indexOf(x.wk) < 0) L.weeks.push(x.wk);
        L.rows[x.wk] = x.rows;
      });
      L.loading = false;
      drawLogPop();
    }).catch(function () {
      if (S.log !== L) return;
      L.loading = false;
      drawLogPop();
    });
  }

  /** 1787376578264 → '8/22 16:23' */
  function logTime(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function drawLogPop() {
    var L = S.log; if (!L) return;
    var pop = $('logpop');

    var h = ['<div class="lh"><div><div class="t4">🕘 編集履歴</div>' +
      '<div class="s4">だれが・いつ・どこを変えたかの記録です</div></div>' +
      '<button class="x2" id="logClose">✕ 閉じる</button></div>'];

    h.push('<div class="lb" id="logBody">');
    var total = 0;
    L.weeks.forEach(function (wk) {
      var rows = L.rows[wk] || [];
      if (!rows.length) return;
      total += rows.length;
      var lb = YY.weekLabel(wk);
      h.push('<div class="wk">' + lb.range + ' の週<span>' + rows.length + '件</span></div>');
      rows.forEach(function (r) {
        h.push(logRowHTML(r));
      });
    });
    if (!total) {
      h.push('<div class="none5">' + (L.loading
        ? '読み込んでいます…'
        : 'この' + L.span + '週ぶんには、記録がありませんでした') + '</div>');
    }
    h.push('</div>');

    var from = YY.weekLabel(YY.addWeeks(S.monday, -(L.span - 1)));
    h.push('<div class="lf">' +
      '<button id="logMore"' + (L.loading ? ' disabled' : '') + '>' +
      (L.loading ? '読み込み中…' : '⏪ さらに' + LOG_STEP + '週前まで') + '</button>' +
      '<span class="cnt5">' + from.range + ' の週まで / ' + total + '件</span></div>');

    var keep = (pop.querySelector('.lb') || {}).scrollTop || 0;
    pop.innerHTML = h.join('');
    var b = pop.querySelector('.lb');
    if (b && keep) b.scrollTop = keep;
    $('logClose').addEventListener('click', closeLogPop);
    $('logMore').addEventListener('click', loadMoreLogs);
  }

  /** 履歴1件の見た目 */
  function logRowHTML(r) {
    var cell = (r.from !== undefined || r.to !== undefined);
    var h = ['<div class="lg">'];

    h.push('<div class="l1"><b>' + esc(logTime(r.at)) + '</b> ' +
      esc(r.by || '—') +
      '<span class="kd' + (cell ? ' cell' : '') + '">' + esc(r.kind || '') + '</span></div>');

    var head = [];
    if (r.date) head.push('<span class="dt">' + esc(YY.dayLabel(r.date)) + '</span>');
    if (r.jn) head.push(esc(r.jn));
    if (head.length) h.push('<div class="l2">' + head.join('') + '</div>');

    if (cell) {
      h.push('<div class="l3"><span class="fr">' + esc(r.from || '(なし)') + '</span>' +
        '<span class="ar">→</span><span class="to">' + esc(r.to || '(なし)') + '</span></div>');
    }
    if (r.note) h.push('<div class="note2">' + esc(r.note) + '</div>');

    h.push('</div>');
    return h.join('');
  }

  /* =================================================================
     PC版ツールバー
     ================================================================= */

  /* --- 元請けに送る Excel -------------------------------------------
     用途:1週間ぶんの工事件名とメンバーを元請けに渡し、
           元請けが各現場の入場申請に使います。
       ・① 東レ工事だけ
       ・その週にメンバーが入っている工事だけ(空の工事は出しません)
       ・名前は省略せず全員
       ・期間は、いま画面に出ている1週間
     「休み」と「余」は社内の話なので入れません。
     ------------------------------------------------------------------- */

  /** 出す工事(① 東レ工事 かつ その週に1人でも入っているもの) */
  function exportJobs() {
    var used = usedJobIds();
    var days = YY.weekDates(S.monday);
    return YY.jobsByCat(1, used).filter(function (j) {
      return days.some(function (d) { return YY.displayCell(S.week, j.id, d).count > 0; });
    });
  }

  function ymdText(dateKey) {
    var d = YY.parseKey(dateKey);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  /**
   * Excel の列幅の目安。全角は2文字ぶんとして数えます。
   * 中身を実測して幅を決めるので、あとから手で直さなくても収まります。
   */
  function wchOf(str) {
    var n = 0;
    String(str == null ? '' : str).split('').forEach(function (c) {
      n += /[\x00-\x7f\uff61-\uff9f]/.test(c) ? 1 : 2;   // 半角は1、全角は2
    });
    return n;
  }
  function maxWch(list, min) {
    var w = min || 0;
    list.forEach(function (x) { w = Math.max(w, wchOf(x)); });
    return w + 3;                                        // 余白ぶん
  }

  /* --- Excel の部品(ExcelJS)------------------------------------------
     罫線・背景色・折り返し・縦位置を書き出せるのが、前に使っていた
     SheetJS 無料版との違いです(あちらは書式が落ちてしまいます)。
     1MBほどあるので、あらかじめ読まず、書き出すときに読みます。
     ------------------------------------------------------------------- */
  var EXCELJS_URL = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
  var exceljsLoading = null;

  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (exceljsLoading) return exceljsLoading;
    exceljsLoading = new Promise(function (ok, ng) {
      var sc = document.createElement('script');
      sc.src = EXCELJS_URL;
      sc.onload = function () {
        if (window.ExcelJS) ok(window.ExcelJS);
        else { exceljsLoading = null; ng(new Error('部品が見つかりません')); }
      };
      sc.onerror = function () { exceljsLoading = null; ng(new Error('読み込めません')); };
      document.head.appendChild(sc);
    });
    return exceljsLoading;
  }

  /* 色と罫線。画面の配色に合わせています */
  var XC = {
    midori: 'FF1C4B34',      // 見出しの背景
    midori2: 'FF2F6B4C',     // 見出しのうち土日
    keisen: 'FFD9D3C4',      // 罫線
    donichi: 'FFF2EFE4',     // 土日の列
    shukei: 'FFEEF3EE',      // いちばん下の集計行
    usu: 'FF8A877C'
  };
  function xBox() {
    var t = { style: 'thin', color: { argb: XC.keisen } };
    return { top: t, left: t, bottom: t, right: t };
  }

  /**
   * 元請けに送るブックを組み立てます。
   *   1枚目「週間表」 … 工事 × 月〜日。1マスに複数名を折り返しで入れ、罫線で囲みます
   *   2枚目「入場者一覧」… 1人1行。入場申請にそのまま使えます
   */
  function buildBook(E, jobs) {
    var days = YY.weekDates(S.monday);
    var now = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    var wb = new E.Workbook();
    wb.creator = 'よつば建設工業';
    wb.created = now;

    /* ===== 先に中身を集めて、列幅を決めます ===== */
    var blocks = [], allNames = [];
    jobs.forEach(function (j) {
      var cols = days.map(function (d) {
        var c = YY.displayCell(S.week, j.id, d);
        return c.rows.map(YY.nameWithMarks).concat(c.extras);
      });
      var n = cols.reduce(function (m, x) { return Math.max(m, x.length); }, 0);
      if (!n) return;
      cols.forEach(function (list) { list.forEach(function (x) { allNames.push(x); }); });
      blocks.push({ job: j, cols: cols, n: n });
    });

    var jobW = Math.min(46, maxWch(blocks.map(function (b) { return b.job.name; }), 18));
    var noW = maxWch(blocks.map(function (b) { return b.job.no || ''; }), 6);
    var nameW = maxWch(allNames, 9);

    /* ===== 1枚目:週間表 ===== */
    var ws = wb.addWorksheet('週間表', {
      views: [{ state: 'frozen', xSplit: 2, ySplit: 5 }],
      pageSetup: {
        paperSize: 9, orientation: 'landscape',          // A4 よこ
        fitToPage: true, fitToWidth: 1, fitToHeight: 0,  // よこ1枚に収めます
        margins: { left: .3, right: .3, top: .4, bottom: .4, header: .2, footer: .2 }
      }
    });
    ws.getColumn(1).width = jobW;
    ws.getColumn(2).width = noW;
    for (var k = 0; k < 7; k++) ws.getColumn(3 + k).width = nameW;

    // 表題
    ws.mergeCells(1, 1, 1, 9);
    var t1 = ws.getCell(1, 1);
    t1.value = 'よつば建設工業 週間予定(① 東レ工事)';
    t1.font = { bold: true, size: 14, color: { argb: XC.midori } };
    t1.alignment = { vertical: 'middle' };
    ws.getRow(1).height = 26;

    var dow0 = YY.DOW[0], dow6 = YY.DOW[6];
    ws.getCell(2, 1).value = '期間';
    ws.getCell(2, 2).value = ymdText(days[0]) + '(' + dow0 + ') 〜 ' + ymdText(days[6]) + '(' + dow6 + ')';
    ws.getCell(3, 1).value = '作成';
    ws.getCell(3, 2).value = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() +
      ' ' + p(now.getHours()) + ':' + p(now.getMinutes());
    [2, 3].forEach(function (r) {
      ws.getCell(r, 1).font = { bold: true, color: { argb: XC.usu } };
      ws.getCell(r, 1).alignment = { horizontal: 'left' };
    });

    // 見出し行(5行目)
    var head = ['工事名', '注番'];
    days.forEach(function (d, i) {
      var dt = YY.parseKey(d);
      head.push(YY.DOW[i] + '\n' + (dt.getMonth() + 1) + '/' + dt.getDate());
    });
    var hr = ws.getRow(5);
    head.forEach(function (v, i) {
      var c = hr.getCell(i + 1);
      c.value = v;
      c.font = { bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
      c.fill = {
        type: 'pattern', pattern: 'solid',
        fgColor: { argb: (i >= 7) ? XC.midori2 : XC.midori }   // 土日は少し明るく
      };
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      c.border = xBox();
    });
    hr.height = 34;

    // 工事の行。1行が1工事で、名前は折り返して縦に並びます
    var dayCount = days.map(function () { return 0; });
    var r = 6;
    blocks.forEach(function (bk) {
      var row = ws.getRow(r);

      var cn = row.getCell(1);
      cn.value = bk.job.name;
      cn.font = { bold: true };
      cn.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };

      var cno = row.getCell(2);
      cno.value = bk.job.no || '';
      cno.alignment = { horizontal: 'center', vertical: 'middle' };

      bk.cols.forEach(function (list, i) {
        var c = row.getCell(3 + i);
        c.value = list.join('\n');
        c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        if (i >= 5) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.donichi } };
        dayCount[i] += list.length;
      });

      // 高さは「いちばん人数の多い日」と「工事名の折り返し行数」の大きいほうに合わせます
      var nameLines = Math.max(1, Math.ceil(wchOf(bk.job.name) / (jobW - 1)));
      row.height = Math.max(22, Math.max(bk.n, nameLines) * 15 + 8);

      for (var i2 = 1; i2 <= 9; i2++) row.getCell(i2).border = xBox();
      r++;
    });

    // いちばん下:日ごとの人数
    var fr = ws.getRow(r);
    fr.getCell(1).value = '日ごとの人数';
    fr.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
    dayCount.forEach(function (n, i) {
      var c = fr.getCell(3 + i);
      c.value = n ? n + '名' : '';
      c.alignment = { horizontal: 'center', vertical: 'middle' };
    });
    for (var i3 = 1; i3 <= 9; i3++) {
      fr.getCell(i3).border = xBox();
      fr.getCell(i3).font = { bold: true, color: { argb: XC.midori } };
      fr.getCell(i3).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.shukei } };
    }
    fr.height = 22;

    /* ===== 2枚目:入場者一覧(1人1行)===== */
    var list = sheetList(jobs);
    var ws2 = wb.addWorksheet('入場者一覧', { views: [{ state: 'frozen', ySplit: 1 }] });
    list.forEach(function (row2, i) {
      var rr = ws2.getRow(i + 1);
      row2.forEach(function (v, k) {
        var c = rr.getCell(k + 1);
        c.value = v;
        c.border = xBox();
        c.alignment = { vertical: 'middle' };
        if (i === 0) {
          c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
          c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.midori } };
          c.alignment = { horizontal: 'center', vertical: 'middle' };
        }
      });
    });
    ws2.autoFilter = { from: { row: 1, column: 1 }, to: { row: list.length, column: 7 } };
    [12, 6, jobW, noW, 16, 12, 8].forEach(function (w, i) { ws2.getColumn(i + 1).width = w; });

    return wb.xlsx.writeBuffer();
  }

  function sheetList(jobs) {
    var days = YY.weekDates(S.monday);
    var rows = [['日付', '曜日', '工事名', '注番', '氏名', '区分', 'しるし']];
    days.forEach(function (d, i) {
      var ymd = ymdText(d);
      jobs.forEach(function (j) {
        var c = YY.displayCell(S.week, j.id, d);
        if (!c.count) return;
        c.rows.forEach(function (x) {
          rows.push([ymd, YY.DOW[i], j.name, j.no || '', x.name,
            x.coop ? '協力会社' : '自社', x.mark || '']);
        });
        c.extras.forEach(function (x) {
          rows.push([ymd, YY.DOW[i], j.name, j.no || '', x, '名簿外', '']);
        });
      });
    });
    return rows;
  }

  function csvText(rows) {
    return rows.map(function (r) {
      return r.map(function (c) {
        var v = String(c == null ? '' : c);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\r\n');
  }

  function exportExcel() {
    var jobs = exportJobs();
    if (!jobs.length) {
      toast('この週は、① 東レ工事にメンバーが入っていません');
      return;
    }
    var days = YY.weekDates(S.monday);
    var name = 'よつば_週間予定_東レ工事_' + days[0] + '_' + days[6];
    var btn = $('btnXls');

    btn.disabled = true;
    toast('Excelを作っています…');

    loadExcelJS().then(function (E) {
      return buildBook(E, jobs);
    }).then(function (buf) {
      download(new Blob([buf], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      }), name + '.xlsx');
      var list = sheetList(jobs);
      toast('東レ工事 ' + jobs.length + '件 / のべ ' + (list.length - 1) + '人日を書き出しました');
    }).catch(function (e) {
      // 部品を読めないときは、中身だけ CSV で出します(書式は付きません)
      console.warn('[Excel]', e);
      var csv = csvText(sheetList(jobs));
      download(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), name + '.csv');
      toast('Excelの部品を読み込めなかったので、CSVで書き出しました');
    }).then(function () {
      btn.disabled = false;
    });
  }

  function download(blob, filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* --- LINE用にコピー(曜日を選んでから) --------------------------- */

  function openDayPop(anchor) {
    var pop = $('daypop');
    pop.innerHTML = '';
    pop.appendChild(el('div', 'arrow', ''));

    var inr = el('div', 'in', '<div class="ttl2">どの日をコピーしますか?</div>');
    var row = el('div', 'row2', '');
    YY.weekDates(S.monday).forEach(function (d, i) {
      var dt = YY.parseKey(d);
      var st = YY.computeDay(S.week, d);
      var b = document.createElement('button');
      if (YY.isToday(d)) b.className = 'today';
      b.innerHTML = '<span class="w">' + YY.DOW[i] + '</span>' +
        '<span class="d">' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</span>' +
        '<span class="n2">' + (st.placedCount ? st.placedCount + '名' : '—') + '</span>';
      b.addEventListener('click', function () { copyDay(d); });
      row.appendChild(b);
    });
    inr.appendChild(row);
    inr.appendChild(el('div', 'hint3', '配信タブと同じ文面をコピーします'));
    pop.appendChild(inr);

    $('daymask').classList.add('on');
    pop.classList.add('on');

    var a = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth, pad = 12;
    var ph2 = pop.offsetHeight;
    pop.style.top = Math.max(pad, Math.min(a.bottom + 8, window.innerHeight - ph2 - pad)) + 'px';
    var sf = safeLR();
    var left = Math.min(a.left, window.innerWidth - pw - pad - sf.r);
    pop.style.left = Math.max(pad + sf.l, left) + 'px';
    var ar = pop.querySelector('.arrow');
    if (ar) {
      var cx = a.left + a.width / 2 - Math.max(pad + sf.l, left) - 6;
      ar.style.left = Math.max(12, Math.min(pw - 24, cx)) + 'px';
    }
  }

  function closeDayPop() {
    $('daypop').classList.remove('on');
    $('daymask').classList.remove('on');
  }

  function copyDay(dateKey) {
    var text = YY.lineText(S.week, dateKey);
    var lbl = YY.dayLabel(dateKey);

    var done = function () {
      closeDayPop();
      toast('✅ ' + lbl + 'をコピーしました。LINEに貼ってください');
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var okd = false;
      try { okd = document.execCommand('copy'); } catch (e) { okd = false; }
      document.body.removeChild(ta);
      if (okd) { done(); return; }

      // 自動でコピーできない端末では、配信タブを開いて手で取れるようにします
      closeDayPop();
      S.pickDate = dateKey;
      S.tab = 'line';
      Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
        x.classList.toggle('on', x.getAttribute('data-tab') === 'line');
      });
      render();
      toast('この端末では自動でコピーできません。配信タブを開きました');
    }
  }

  /* =================================================================
     小道具
     ================================================================= */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  }

  boot();
})();
</script>
</body>
</html>
