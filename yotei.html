<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4b34">
<title>よつば週間予定</title>
<!-- ホーム画面に追加したときの設定。iPhone はホーム画面から開いたときだけ通知が届くので、
     ファイルとして置いた manifest と PNG のアイコンを使います(車両管理アプリと同じ) -->
<link rel="manifest" href="yotei.webmanifest">
<link rel="apple-touch-icon" href="icons/yotei-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="よつば予定">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<!-- Firebase の部品の版。下の MESSAGING_SDK(通知の部品)と必ず同じ版にします。
     通知の部品は、同じ住所(github.io)のほかのアプリと端末の中の置き場を共有します。
     向こうが新しい版で置き場を作り直すと、古い版のこちらは開けなくなる(VersionError)ので、
     向こうと同じか、より新しい版にしておきます。12.14 から置き場が「版2」になりました -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

<link rel="stylesheet" href="hyou.css">

<style>
/* =====================================================================
   確認用アプリだけのスタイル
     表まわり(週ナビ・カテゴリ・絞り込み・表・下タブなど)は、
     編集アプリと同じ見た目にするため hyou.css から読んでいます。
     ここに書くのは「じぶん」タブと「名前えらび」だけです。
   ===================================================================== */

/* 上部の「なまえを変える」 */
.head .chg{
  min-height:40px;padding:0 14px;border-radius:20px;
  border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;
  font-size:14px;font-weight:700;
}

/* ---- 名前の帯 ---- */
.mebar{
  padding:12px 14px;background:#fff;border-bottom:1px solid var(--keisen);
  display:flex;align-items:center;gap:10px;
}
.mebar .nm{font-size:21px;font-weight:900}
.mebar .nm.coop{color:var(--kyoryoku)}

/* ---- じぶんのカード ---- */
.days{display:flex;flex-direction:column;gap:10px;padding:14px 12px}
.daycard{
  background:#fff;border:1px solid var(--keisen);border-radius:12px;
  padding:14px 16px;position:relative;
}
.daycard .top{display:flex;align-items:center;gap:14px}
.daycard .dw{width:60px;flex-shrink:0;text-align:center;line-height:1.2}
.daycard .dw .w{font-size:17px;font-weight:700}
.daycard .dw .d{font-size:14px;color:var(--usu)}
.daycard .dw .w.sat{color:var(--kyoryoku)}
.daycard .dw .w.sun{color:var(--aka)}
.daycard .jobs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.daycard .j{font-size:20px;font-weight:900;line-height:1.35;word-break:break-all}
.daycard .j .mk{color:var(--shokucho);font-weight:900;margin-right:2px;font-size:.85em}
.daycard .j .no{font-size:13px;color:var(--usu);font-weight:400;margin-left:6px}
.daycard.today{border:3px solid var(--midori)}
.daycard.today .badge{
  position:absolute;top:-11px;left:14px;background:var(--midori);color:#fff;
  border-radius:10px;padding:2px 12px;font-size:13px;font-weight:900;
}
.daycard.today .dw .w,.daycard.today .dw .d{color:var(--midori);font-weight:900}
.daycard.rest{background:var(--yasumi)}
.daycard.rest .j{color:var(--usu)}
.daycard .mitei{font-size:17px;font-weight:400;color:#b9b3a2}
/* 一緒に行く人 */
.daycard .more{
  margin-top:10px;width:100%;min-height:48px;border-radius:10px;
  border:1px solid var(--keisen);background:var(--kinari);
  color:var(--midori);font-size:15px;font-weight:700;
}
.daycard .more.open{background:var(--kyo);border-color:var(--midori)}
.mates{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.mates .grp{background:var(--kinari);border:1px solid var(--keisen2);border-radius:10px;padding:10px 12px}
.mates .gt{font-size:13px;font-weight:700;color:var(--usu2);margin-bottom:6px}
.mates .names{font-size:17px;font-weight:600;line-height:1.9;word-break:break-all}
.mates .cnt{font-size:12px;color:var(--usu);font-weight:400;margin-top:2px}


/* 自分の名前は目立たせます */
.nm.me{background:#fff6b8;border-radius:4px;padding:0 3px;font-weight:900}

/* ---- 名前を選ぶ ---- */
.pick{padding:16px 12px 24px}
.pick .lead{font-size:17px;font-weight:700;text-align:center;margin-bottom:6px}
.pick .sub{font-size:14px;color:var(--usu);text-align:center;margin-bottom:14px}
.pick input{
  width:100%;min-height:52px;border:1px solid var(--keisen);border-radius:12px;
  padding:0 14px;font-size:17px;background:#fff;margin-bottom:12px;
}
.pick .list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick .list button{
  min-height:60px;border:1px solid var(--keisen);background:#fff;border-radius:12px;
  font-size:19px;font-weight:700;padding:8px 10px;line-height:1.3;
}
.pick .list button.coop{color:var(--kyoryoku)}
.pick .list button .s{display:block;font-size:12px;color:var(--usu);font-weight:600}
.pick .none{padding:30px 10px;text-align:center;color:var(--usu);font-size:15px}


/* ---- 通知(車両管理アプリと同じ見た目)---- */
.pushbar{padding:12px 12px 0}
.pushbtn{
  display:block;width:100%;min-height:52px;margin:0;border:2px solid var(--midori);border-radius:14px;
  background:#fff;color:var(--midori);font-size:17px;font-weight:900;
}
.pushbtn:disabled{opacity:.6}
.pushnote{
  margin:8px 0 0;color:var(--usu);font-size:14px;text-align:center;line-height:1.6;
  word-break:break-all;overflow-wrap:anywhere;     /* body は keep-all なので、途中でも折り返せるように */
}
.pushnote a{color:var(--midori);font-weight:700}
/* 押してうまくいかなかったときの理由(次に押すまで出しておきます) */
.pushnote.ng{
  color:var(--aka);font-weight:700;text-align:left;background:#fff;
  border:1.5px solid var(--aka);border-radius:10px;padding:8px 12px;
}

/* ---- 通知を押して開いたときの「変更のお知らせ」---- */
.notice{margin:12px 12px 0;background:var(--kiji);border:2px solid var(--kiwaku);border-radius:12px;padding:10px 12px 12px}
.notice .nh{display:flex;align-items:center;gap:10px}
.notice .nh b{flex:1;font-size:16px;font-weight:900;color:var(--ki)}
.notice .nx{
  min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--kiwaku);
  background:#fff;font-size:14px;font-weight:700;color:var(--usu2);
}
.notice .nl{
  display:flex;align-items:baseline;gap:10px;width:100%;margin-top:8px;padding:10px 12px;min-height:48px;
  text-align:left;white-space:normal;background:#fff;border:1px solid var(--kiwaku);border-radius:10px;color:var(--moji);
}
.notice .nl .d{flex-shrink:0;font-size:16px;font-weight:900}
.notice .nl .ft{flex:1;min-width:0;font-size:16px;line-height:1.5;word-break:break-all;overflow-wrap:anywhere}
.notice .nl .fr{color:var(--usu)}
.notice .nl .ft b{font-weight:900}
.notice .nl .go{flex-shrink:0;color:var(--ki);font-weight:900}
/* 変わった日のカード(「きょう」の札は左上、「変更」の札は右上) */
.daycard.changed{border:3px solid var(--ki)}
.daycard .chgbadge{
  position:absolute;top:-11px;right:14px;background:var(--ki);color:#fff;
  border-radius:10px;padding:2px 12px;font-size:13px;font-weight:900;
}

/* ---- 大きい画面では中央に寄せます ---- */
@media (min-width:700px){
  .pick .list{grid-template-columns:repeat(3,1fr)}
}

/* ---- スマホを横向きにしたとき ---- */
@media (max-width:1023px) and (orientation:landscape){
  .mebar{padding:6px 14px}
  .mebar .nm{font-size:18px}
  .head .chg{min-height:32px;padding:0 12px;font-size:13px;border-radius:16px}

  /* ---- カードを2列に。見出しだけは横いっぱいに置きます ---- */
  .days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start;padding:10px 12px}

  /* ---- 名前えらびは4列に ---- */
  .pick{padding:10px 12px 18px}
  .pick .list{grid-template-columns:repeat(4,1fr)}

  /* ノッチよけ */
  .mebar{padding-left:calc(14px + var(--sal));padding-right:calc(14px + var(--sar))}
  .pushbar{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
  .notice{margin-left:calc(12px + var(--sal));margin-right:calc(12px + var(--sar))}
  .days{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
  .pick{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
}
</style>
</head>
<body>

<div id="app">
  <div class="head">
    <div class="t" id="headTitle">👤 じぶん</div>
    <button class="chg" id="btnChange" style="display:none">なまえを変える</button>
  </div>

  <div class="foldbar" id="foldBar"></div>

  <div class="obi offline" id="obiOffline">電波が届いていません</div>
  <div class="obi last" id="obiLast"></div>

  <div id="body"></div>

  <div class="tabs" id="tabs">
    <button data-tab="me" class="on"><div class="i">👤</div><div class="l">じぶん</div></button>
    <button data-tab="plan"><div class="i">📅</div><div class="l">予定表</div></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
/* =====================================================================
   確認用アプリ。
   ★ このファイルには予定を書きこむコードがありません。
      common.js の saveCell / addJob / addMember などは一切呼びません。
      読むのは subscribeWeek / subscribeJobs / subscribeMembers だけです。
      書くのは、通知を許可した端末の控え(yotei/notify/tokens)と、
      通知をオンにできなかった理由の記録(yotei/notify/fails)だけです。
   ===================================================================== */
(function () {
  'use strict';

  var ME_KEY = 'yotsuba-yotei-me';    // 選んだ名前を端末におぼえます

  var S = {
    tab: 'me',
    monday: YY.thisMonday(),
    week: { assign: {} },
    me: null,
    picking: false,
    pickQ: '',
    openMates: {},      // じぶん画面で「一緒に行く人」を開いている日
    cat: 1,             // 予定表のカテゴリ(編集アプリと同じ既定)
    onlyUsed: true,     // その週に人が入っている工事だけ出すか
    fold: false,        // スマホで上部をたたんでいるか
    restOpen: false,    // 「休み」行をひらいているか(既定はたたんだ状態)
    yoOpen: false,      // 「余」行をひらいているか(既定はたたんだ状態)
    openCells: {},      // 「+ほか○名」を開いたマス
    viewKey: '',        // 画面を最後に描いたときの「どの一覧か」。スクロール位置を戻す判定に使います
    online: true,
    nearBase: null,
    nearWeeks: {},      // 直近4週ぶん(最後に人が入った日を調べます)
    nearLoaded: false,
    unsubWeek: null,
    notifyOn: false,    // 事務所がこの人の通知をオンにしているか
    unsubNotify: null,
    pushBusy: false,    // 「通知を許可する」を押して、保存しているあいだ
    pushFail: '',       // 押してうまくいかなかった理由(YY.NOTIFY_FAIL_LABELS のどれか)。次に押すまで出します
    notice: []          // 通知を押して開いたときの「変更のお知らせ」[{ date, from, to }]。閉じると空
  };

  var $ = function (id) { return document.getElementById(id); };
  var isPC = function () { return window.matchMedia('(min-width:1024px)').matches; };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  };
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  }

  /* =================================================================
     起動
     ================================================================= */
  function boot() {
    // タブのアイコン(編集用と見分けられるよう、生成り地のほう)。
    // ホーム画面のアイコンと manifest は、ファイルとして <head> に書いてあります
    var l2 = document.createElement('link');
    l2.rel = 'icon'; l2.href = YY.iconDataUri(64, true);
    document.head.appendChild(l2);

    YY.init();
    S.fold = getFold();          // 前に閉じたときの状態を思い出します

    try { S.me = localStorage.getItem(ME_KEY) || null; } catch (e) { S.me = null; }

    // 通知を押して開いたときは、変わった日の週と「変更のお知らせ」を出します(yotei.html?week=月曜&chg=…)
    var opened = noticeFromUrl();
    if (opened.week) S.monday = opened.week;
    S.notice = opened.notice;
    // すでに開いていた画面で通知を押したときは、sw.js から週と変更の中身が届きます
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.type === 'openWeek') openWeek(d.week, d.chg);
      });
    }
    // 端末の設定で通知を許可して戻ってきたときに、案内を出し直します
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && S.tab === 'me') render();
    });
    watchNotify();
    // 許可ずみの端末は、開くたびにトークンを取り直して保存します(変わっていたり、無効として消されていても戻る)
    if (S.me && pushState() === 'on') saveToken().catch(function (e) { console.warn(e); });

    YY.onConnection(function (on) {
      S.online = on;
      $('obiOffline').classList.toggle('on', !on);
    });

    // 読むだけ。事務所が直したら、この画面もすぐ変わります
    YY.subscribeJobs(function () { render(); });
    YY.subscribeMembers(function () { render(); });
    watchWeek();

    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.addEventListener('click', function () {
        S.tab = b.getAttribute('data-tab');
        S.picking = false;
        Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
          x.classList.toggle('on', x === b);
        });
        render();
      });
    });

    $('btnChange').addEventListener('click', function () {
      S.picking = true; S.pickQ = ''; render();
    });

    render();
  }

  function watchWeek() {
    if (S.unsubWeek) S.unsubWeek();
    S.unsubWeek = YY.subscribeWeek(S.monday, function (w) { S.week = w; render(); });

    // 直近の週も1回だけ読みます(最後に人が入った日を調べるため)
    var base = S.monday;
    var keys = [];
    for (var i = 1; i <= YY.JOB_KEEP_WEEKS; i++) keys.push(YY.addWeeks(base, -i));
    S.nearBase = base;
    S.nearWeeks = {};
    S.nearLoaded = false;
    Promise.all(keys.map(function (k) {
      return YY.loadWeek(k).then(function (w) { return { k: k, w: w }; });
    })).then(function (list) {
      if (S.nearBase !== base) return;
      var m = {};
      list.forEach(function (x) { m[x.k] = x.w; });
      S.nearWeeks = m;
      S.nearLoaded = true;
      render();
    });
  }

  /** 判定に使う週のまとまり(表示中の週 + 直近の週) */
  function nearWeeksAll() {
    var m = {};
    Object.keys(S.nearWeeks || {}).forEach(function (k) { m[k] = S.nearWeeks[k]; });
    m[S.monday] = S.week;
    return m;
  }

  function goWeek(n) {
    S.monday = (n === 0) ? YY.thisMonday() : YY.addWeeks(S.monday, n);
    S.openMates = {};
    S.openCells = {};        // 「+ほか○名」で開いていたマスは閉じます
    watchWeek();
    render();
  }

  /** 前月(-1)・翌月(+1)の第1週(1日を含む週)へ飛びます */
  function goMonth(step) {
    S.monday = YY.moveMonth(S.monday, step);
    S.openMates = {};
    S.openCells = {};
    watchWeek();
    render();
  }

  /* =================================================================
     描き分け
     ================================================================= */
  function render() {
    $('headTitle').textContent = (S.tab === 'me') ? '👤 じぶん' : '📅 予定表';
    drawLastEdit();
    drawFoldBar();
    $('btnChange').style.display = (S.tab === 'me' && S.me && !S.picking) ? '' : 'none';

    var b = $('body');

    /* スクロール位置を覚えておきます。
       中身を作り直す(innerHTML を空にする)と、そのままでは必ず先頭に戻ってしまうため、
       表の下のほうで「+ほか○名」を押しただけでも画面が飛んでいました。
       同じ一覧(同じ週・カテゴリ・絞り込み)を描き直すときだけ、見ていた場所に戻します。
       週やカテゴリを変えたときは、今までどおり先頭から見せます。
       予定表は表そのもの(.gridwrap)が、じぶんタブは #body が動くので、両方とも覚えます。
       横の位置も残すので、スマホで横スワイプした先で押しても月曜まで巻き戻りません。 */
    var vKey = (S.tab === 'plan')
      ? 'plan|' + S.monday + '|' + S.cat + '|' + S.onlyUsed
      : 'me|' + S.monday + '|' + S.me + '|' + S.picking;
    var gwOld = b.querySelector('.gridwrap');
    var keep = (vKey === S.viewKey)
      ? {
          body: b.scrollTop,
          top: gwOld ? gwOld.scrollTop : 0,
          left: gwOld ? gwOld.scrollLeft : 0
        }
      : null;
    S.viewKey = vKey;

    b.className = (S.tab === 'plan') ? 'plan' : '';
    b.innerHTML = '';
    if (S.tab === 'me') {
      if (!S.me || S.picking) renderPick(b);
      else renderMe(b);
    } else {
      renderPlan(b);
    }

    // 覚えておいた場所に戻します(中身が短くなっていれば、そのぶん詰めて表示されます)
    if (keep) {
      b.scrollTop = keep.body;
      var gwNew = b.querySelector('.gridwrap');
      if (gwNew) { gwNew.scrollTop = keep.top; gwNew.scrollLeft = keep.left; }
    }
  }

  function weekNav() {
    var lb = YY.weekLabel(S.monday);
    var w = el('div', 'weeknav',
      '<button data-w="-1" title="1週まえ">◀</button>' +
      '<button class="mv" data-m="-1" title="前の月の1日がある週へ">前月</button>' +
      '<button class="now" data-w="0">今週</button>' +
      '<button class="mv" data-m="1" title="次の月の1日がある週へ">翌月</button>' +
      '<div class="lbl"><b>' + lb.range + '</b><span>' + lb.year + '</span></div>' +
      '<button data-w="1" title="1週さき">▶</button>');
    Array.prototype.forEach.call(w.querySelectorAll('button'), function (b) {
      var m = b.getAttribute('data-m');
      b.addEventListener('click', function () {
        if (m !== null) goMonth(+m); else goWeek(+b.getAttribute('data-w'));
      });
    });
    return w;
  }

  /** 名前の並び。◎が先頭、あとは選んだ順。自分の名前は目立たせます */
  function namesHTML(rows, extras) {
    var out = rows.map(function (r) {
      var me = (r.name === S.me) ? ' me' : '';
      return '<span class="nm' + (r.coop ? ' coop' : '') + '">' +
        (r.mark ? '<span class="sc">' + esc(r.mark) + '</span>' : '') +
        '<span class="nm' + me + '">' + esc(r.name) + '</span></span>';
    }).concat((extras || []).map(function (x) {
      return '<span class="nm">' + esc(x) + '</span>';
    }));
    return out.join('<span class="sep">・</span>');
  }

  /* =================================================================
     名前を選ぶ(初回と「なまえを変える」)
     ================================================================= */
  function renderPick(b) {
    var box = el('div', 'pick', '');
    box.appendChild(el('div', 'lead', S.me ? 'なまえを選びなおしてください' : 'あなたの なまえを えらんでください'));
    box.appendChild(el('div', 'sub', 'この端末におぼえます。あとから変えられます'));

    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = '名前でさがす';
    inp.value = S.pickQ;
    inp.addEventListener('input', function () { S.pickQ = inp.value; draw(); });
    box.appendChild(inp);

    var list = el('div', 'list', '');
    box.appendChild(list);
    b.appendChild(box);

    function draw() {
      list.innerHTML = '';
      var q = S.pickQ.trim();
      var ws = YY.master.workers.filter(function (w) {
        if (!w.active) return false;
        if (!q) return true;
        return w.name.indexOf(q) >= 0 || (w.shozoku || '').indexOf(q) >= 0;
      });
      if (!YY.master.workers.length) {
        list.innerHTML = '<div class="none" style="grid-column:1/-1">' +
          '名簿がまだ登録されていません<br>事務所にお問い合わせください</div>';
        return;
      }
      if (!ws.length) {
        list.innerHTML = '<div class="none" style="grid-column:1/-1">見つかりませんでした</div>';
        return;
      }
      ws.forEach(function (w) {
        var bt = document.createElement('button');
        bt.className = w.coop ? 'coop' : '';
        bt.innerHTML = esc(w.name) + (w.shozoku ? '<span class="s">' + esc(w.shozoku) + '</span>' : '');
        bt.addEventListener('click', function () {
          S.me = w.name;
          try { localStorage.setItem(ME_KEY, w.name); } catch (e) { }
          S.picking = false;
          watchNotify();
          // この端末の通知を、新しい名前にひもづけ直します
          if (pushState() === 'on') saveToken().catch(function (e) { console.warn(e); });
          render();
        });
        list.appendChild(bt);
      });
    }
    draw();
  }

  /* =================================================================
     画面1「じぶん」
     ================================================================= */

  /** その人のその日。休みかどうかと、入っている工事(複数可) */
  function myDay(dateKey) {
    var day = YY.computeDay(S.week, dateKey);
    var where = day.placements[S.me] || [];
    var rest = where.indexOf(YY.REST_KEY) >= 0;
    var jobs = where.filter(function (k) { return k !== YY.REST_KEY; }).map(function (k) {
      var lab = YY.jobLabel(k);
      var c = YY.cellOf(S.week, k, dateKey);
      return { id: k, name: lab.name, no: lab.sub,
               mark: YY.effectiveMark(S.me, (c.members[S.me] || {}).mark || '') };
    });
    return { rest: rest, jobs: jobs };
  }

  function renderMe(b) {
    // 通知を押して開いたときは、いちばん上に「変更のお知らせ」
    if (S.notice.length) b.appendChild(noticeBox());
    b.appendChild(weekNav());

    var w = YY.master.workerByName[S.me];
    b.appendChild(el('div', 'mebar',
      '<div class="nm' + (w && w.coop ? ' coop' : '') + '">' + esc(S.me) + ' さん</div>'));
    var pb = pushBar();
    if (pb) b.appendChild(pb);

    var days = YY.weekDates(S.monday);
    var box = el('div', 'days', '');

    days.forEach(function (d, i) {
      var m = myDay(d);
      var today = YY.isToday(d);
      var dt = YY.parseKey(d);
      var changed = S.notice.some(function (n) { return n.date === d; });

      var card = el('div', 'daycard' +
        (today ? ' today' : '') +
        (m.rest && !m.jobs.length ? ' rest' : '') +
        (changed ? ' changed' : ''), '');
      card.setAttribute('data-date', d);
      if (today) card.appendChild(el('span', 'badge', 'きょう'));
      if (changed) card.appendChild(el('span', 'chgbadge', '変更'));

      var top = el('div', 'top', '');
      top.appendChild(el('div', 'dw',
        '<div class="w' + (i === 5 ? ' sat' : i === 6 ? ' sun' : '') + '">' + YY.DOW[i] + '</div>' +
        '<div class="d">' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</div>'));

      var jb = el('div', 'jobs', '');
      if (m.jobs.length) {
        // 同じ日に2つ以上入っていれば、全部並べます
        m.jobs.forEach(function (j) {
          jb.appendChild(el('div', 'j',
            (j.mark ? '<span class="mk">' + esc(j.mark) + '</span>' : '') +
            esc(j.name) + (j.no ? '<span class="no">' + esc(j.no) + '</span>' : '')));
        });
        if (m.rest) jb.appendChild(el('div', 'j', '<span style="color:var(--usu)">休み</span>'));
      } else if (m.rest) {
        jb.appendChild(el('div', 'j', '休み'));
      } else {
        jb.appendChild(el('div', 'mitei', '(まだ決まっていません)'));
      }
      top.appendChild(jb);
      card.appendChild(top);

      /* 一緒に行く人。はじめは畳んでいます */
      if (m.jobs.length) {
        var open = !!S.openMates[d];
        var btn = document.createElement('button');
        btn.className = 'more' + (open ? ' open' : '');
        btn.textContent = open ? '一緒に行く人 ▴' : '一緒に行く人 ▾';
        btn.addEventListener('click', function () {
          S.openMates[d] = !open;
          render();
        });
        card.appendChild(btn);

        if (open) {
          var mates = el('div', 'mates', '');
          m.jobs.forEach(function (j) {
            var c = YY.displayCell(S.week, j.id, d);
            var g = el('div', 'grp', '');
            // 工事が1つだけなら見出しは省きます
            if (m.jobs.length > 1) g.appendChild(el('div', 'gt', esc(j.name)));
            g.appendChild(el('div', 'names', namesHTML(c.rows, c.extras)));
            g.appendChild(el('div', 'cnt', c.count + '名'));
            mates.appendChild(g);
          });
          card.appendChild(mates);
        }
      }

      box.appendChild(card);
    });

    b.appendChild(box);

    if (!YY.master.workerByName[S.me]) {
      b.appendChild(el('div', 'pick',
        '<div class="none">「' + esc(S.me) + '」は いまの名簿にありません。<br>' +
        '「なまえを変える」から選びなおしてください</div>'));
    }
  }

  /* =================================================================
     画面2「予定表」= 全体の予定(見るだけ)
       スマホでは横に7日並べると読めないので、
       【日を選んで、その日の工事を縦に並べる】形にしています。
     ================================================================= */
  /* =================================================================
     画面2「予定表」= 編集アプリとまったく同じ表(見るだけ)
       ・表の形・色・固定・たたむ機能は、編集アプリと同じ hyou.css と
         同じ組み立て方をそのまま使っています。
       ・ちがうのは「押しても編集できない」ことだけです。
         マスを押しても選択シートは開かず、工事名を押しても編集画面は
         開きません。「前に使った工事」「＋工事を追加」もありません。
       ・「+ほか○名」だけは押すと全員出ます(見るためなので)。
     ================================================================= */

  function renderPlan(b) {
    b.appendChild(weekNav());
    b.appendChild(catTabs());
    b.appendChild(filterBar());

    var days = YY.weekDates(S.monday);
    var st = {};
    days.forEach(function (d) { st[d] = YY.computeDay(S.week, d); });

    var g = el('div', 'grid', '');
    var today = YY.todayKey();

    /* 見出し行 */
    g.appendChild(el('div', 'corner', '工事' + (isPC() ? '(注番)' : '')));
    days.forEach(function (d, i) {
      var c = 'hd' + (d === today ? ' today' : '') + (i === 5 ? ' sat' : i === 6 ? ' sun' : '');
      var dt = YY.parseKey(d);
      g.appendChild(el('div', c, '<b>' + YY.DOW[i] + '</b> <span>' +
        (dt.getMonth() + 1) + '/' + dt.getDate() + '</span>'));
    });

    /* 休み行(いちばん上に固定)。たためます */
    var rh = el('div', 'rest resthd', '<span>休み</span>');
    rh.appendChild(rowToggle(S.restOpen, '休みの人', function () {
      S.restOpen = !S.restOpen; render();
    }));
    g.appendChild(rh);
    days.forEach(function (d) { g.appendChild(restCell(d, st[d])); });

    /* 🟡 余 行(計算で出すだけ)。たためます */
    var yh = el('div', 'yohd', '<span>🟡 余</span>');
    yh.appendChild(rowToggle(S.yoOpen, '余っている人', function () {
      S.yoOpen = !S.yoOpen; render();
    }));
    g.appendChild(yh);
    days.forEach(function (d) { g.appendChild(yoCell(st[d])); });

    /* 工事の行 */
    var used = usedJobIds();
    var cats = (S.cat === 'all') ? YY.ALL_TAB_ORDER : [S.cat];
    var any = false;
    cats.forEach(function (cat) {
      var jobs = YY.jobsByCat(cat, used);
      if (S.onlyUsed) jobs = jobs.filter(function (j) { return jobInUse(j, used); });
      if (!jobs.length) return;
      if (S.cat === 'all') {
        g.appendChild(el('div', 'cathd', esc(YY.CATEGORIES.labels[cat])));
      }
      jobs.forEach(function (j, idx) {
        any = true;
        g.appendChild(jobCell(j, used, idx, jobs.length));
        days.forEach(function (d) { g.appendChild(planCell(j.id, d, st[d])); });
      });
    });

    var wrap = el('div', 'gridwrap', '');
    wrap.appendChild(g);
    b.appendChild(wrap);

    if (!any) {
      b.appendChild(el('div', 'nodata',
        'この週に出す工事がありません<br>' +
        '<span style="font-size:13px">「すべての工事」に切り替えると、ほかの工事も出ます</span>'));
    }

    if (!isPC()) b.appendChild(el('div', 'guide', '◀ 横にスワイプで 木・金・土・日 ▶'));
    b.appendChild(el('div', 'legend',
      '<span style="color:var(--shokucho)">◎=職長</span>' +
      '<span style="color:var(--moji)">■ 自社</span>' +
      '<span style="color:var(--kyoryoku)">■ 協力会社</span>'));
  }

  /** 行をたたむ・ひらくボタン(休み行と余行で共通) */
  function rowToggle(open, what, onClick) {
    var b = document.createElement('button');
    b.className = 'tg';
    b.textContent = open ? '▴' : '▾';
    b.title = what + (open ? 'をたたむ' : 'をひらく');
    b.addEventListener('click', function (e) { e.stopPropagation(); onClick(); });
    return b;
  }

  /** 工事名のマス。押しても編集画面は開きません(見るだけ) */
  function jobCell(j, used, idx, total) {
    var c = el('div', 'job', '');
    var waiting = !(used || {})[j.id] && YY.jobStartsInWeek(j, S.monday);
    c.setAttribute('data-job', j.id);

    c.innerHTML = '<div class="n">' + esc(j.name) + '</div>' +
      (j.no ? '<div class="no">' + esc(j.no) + '</div>' : '') +
      (!j.active ? '<div class="kept"><div class="badge">⊘ 隠す設定・予定あり</div></div>' : '') +
      (waiting ? '<div class="waiting">' + esc(mdLabel(j.start)) + ' 開始・まだ人なし</div>' : '');
    c.title = j.name + (j.no ? '(' + j.no + ')' : '');
    return c;
  }

  /** その日の「休み」。たたんでいるときは人数だけ */
  function restCell(dateKey, day) {
    var b = document.createElement('div');
    b.className = 'cell rest' + (YY.isToday(dateKey) ? ' today' : '') +
      (S.restOpen ? '' : ' closed');
    var d = YY.displayCell(S.week, YY.REST_KEY, dateKey);

    if (!S.restOpen) {
      b.innerHTML = d.count
        ? '<div class="big">' + d.count + '名</div>'
        : '<div class="none">—</div>';
      b.title = d.count ? d.rows.map(YY.nameWithMarks).concat(d.extras).join('・') : '';
      return b;
    }
    if (d.count === 0) {
      b.classList.add('empty');
      b.textContent = '—';
      return b;
    }
    b.innerHTML = joinNames(d.rows.map(function (r) { return nameHTML(r, day, YY.REST_KEY); })
      .concat(d.extras.map(function (x) { return '<span class="nm">' + esc(x) + '</span>'; }))) +
      '<div class="cnt">' + d.count + '名</div>';
    return b;
  }

  /** 余の行に出す人数の上限(編集アプリと同じ) */
  var YO_LIMIT = 8;

  function yoCell(day) {
    var d = document.createElement('div');
    var names = day.free;

    if (!S.yoOpen) {
      d.className = 'yo closed';
      d.innerHTML = names.length
        ? '<div class="big">' + names.length + '名</div>'
        : '<div class="none">—</div>';
      d.title = names.length ? names.join('・') : '';
      return d;
    }
    d.className = 'yo';
    if (!names.length) { d.innerHTML = '<div class="none">—</div>'; return d; }

    var shown = names.slice(0, YO_LIMIT);
    var more = names.length - shown.length;
    d.innerHTML = joinNames(shown.map(function (n) {
      return '<span class="nm' + (YY.isCoop(n) ? ' coop' : '') + '">' + esc(n) + '</span>';
    })) +
      (more > 0 ? '<span class="more2">ほか' + more + '名</span>' : '') +
      '<div class="cnt">' + names.length + '名</div>';
    d.title = names.join('・');
    return d;
  }

  /* セルに出す人数の上限(編集アプリと同じ) */
  var CELL_LIMIT = 5;
  var CELL_LIMIT_WEEKEND = 3;

  /**
   * 予定のマス。押しても選択シートは開きません。
   * 「+ほか○名」が出ているときだけ、押すと全員出ます(見るためです)。
   */
  function planCell(jobKey, dateKey, day) {
    var b = document.createElement('div');
    var key = jobKey + '|' + dateKey;
    b.className = 'cell' + (YY.isToday(dateKey) ? ' today' : '') +
      (YY.hasPlan(S.week, jobKey, dateKey) ? ' planned' : '');
    var d = YY.displayCell(S.week, jobKey, dateKey);

    if (d.count === 0) {
      b.classList.add('empty');
      b.innerHTML = '·';
      return b;
    }

    var all = d.rows.map(function (r) { return nameHTML(r, day, jobKey); })
      .concat(d.extras.map(function (x) { return '<span class="nm">' + esc(x) + '</span>'; }));
    var lim = (isPC() && YY.isWeekend(dateKey)) ? CELL_LIMIT_WEEKEND : CELL_LIMIT;
    var open = !!S.openCells[key];
    var shown = open ? all : all.slice(0, lim);
    var more = all.length - shown.length;

    b.innerHTML = joinNames(shown) +
      (more > 0 ? '<div class="more">+ほか' + more + '名</div>' : '') +
      (open && all.length > lim ? '<div class="more">▲ とじる</div>' : '') +
      '<div class="cnt">' + d.count + '名</div>';

    // 隠れている人がいるマスだけ、押すと全員出ます
    if (all.length > lim) {
      b.classList.add('canopen');
      b.title = '押すと全員出ます';
      b.addEventListener('click', function () {
        if (S.openCells[key]) delete S.openCells[key]; else S.openCells[key] = true;
        render();
      });
    }
    return b;
  }

  /** 1人ぶんの表示。しるしは名前の直前に、色付きで出します */
  function nameHTML(row, day, jobKey) {
    var dup = day && day.placements[row.name] && day.placements[row.name].length >= 2;
    var mk = row.mark ? '<span class="sc">' + esc(row.mark) + '</span>' : '';
    var me = (row.name === S.me) ? ' me' : '';
    return '<span class="nm' + (row.coop ? ' coop' : '') + '">' + mk +
      '<span class="' + (dup ? 'nm dup' : '') + me + '">' + esc(row.name) + '</span></span>';
  }

  /** 名前をつなぎます(編集アプリと同じ) */
  function joinNames(list) {
    return list.join(isPC() ? '<span class="sep">・</span><wbr>' : '<br>');
  }

  /** カテゴリタブ(編集アプリと同じ4つ) */
  function catTabs() {
    var c = el('div', 'cats', '');
    var list = [];
    YY.CATEGORIES.order.forEach(function (n) {
      list.push({ k: n, l: YY.CATEGORIES.labels[n] });
    });
    list.push({ k: 'all', l: '週のすべて' });
    list.forEach(function (it) {
      var b = document.createElement('button');
      b.textContent = it.l;
      if (S.cat === it.k) b.className = 'on';
      b.addEventListener('click', function () { S.cat = it.k; render(); });
      c.appendChild(b);
    });
    return c;
  }

  /** 「使う工事だけ / すべての工事」。編集アプリと同じ(前に使った工事は出しません) */
  function filterBar() {
    var used = usedJobIds();
    var cats = (S.cat === 'all') ? YY.ALL_TAB_ORDER : [S.cat];
    var shown = 0, hidden = 0;
    cats.forEach(function (cat) {
      YY.jobsByCat(cat, used).forEach(function (j) {
        if (jobInUse(j, used)) shown++; else hidden++;
      });
    });

    var bar = el('div', 'filterbar', '');
    var seg = el('div', 'seg', '');
    [{ k: true, l: '使う工事だけ' }, { k: false, l: 'すべての工事' }].forEach(function (it) {
      var b = document.createElement('button');
      b.textContent = it.l;
      if (S.onlyUsed === it.k) b.className = 'on';
      b.addEventListener('click', function () { S.onlyUsed = it.k; render(); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);

    var msg = el('div', 'fmsg', '');
    msg.innerHTML = S.onlyUsed
      ? (hidden ? '<b>' + hidden + '件</b>を隠しています(この週は誰も入っていません)'
                : 'この週に使う工事だけ出ています')
      : '全' + (shown + hidden) + '件を出しています' +
        (shown ? '(この週に人が入っているのは ' + shown + '件)' : '');
    bar.appendChild(msg);
    return bar;
  }

  /* --- 上部をたたむ(スマホだけ)。編集アプリと同じ --- */
  var FOLD_KEY = 'yotsuba.yotei.fold.view';

  function getFold() {
    try { return window.localStorage.getItem(FOLD_KEY) === '1'; } catch (e) { return false; }
  }
  function setFold(on) {
    try { window.localStorage.setItem(FOLD_KEY, on ? '1' : '0'); } catch (e) { /* 覚えられなくても動きます */ }
  }

  function drawFoldBar() {
    var bar = $('foldBar');
    var app = $('app');
    if (S.tab !== 'plan') {
      bar.classList.remove('on');
      app.classList.remove('fold');

        '<button class="fb" id="fbToggle">▼ ひらく</button>';

      $('fbNext').addEventListener('click', function () { goWeek(1); });
    } else {
      bar.innerHTML =
        '<button class="fb" id="fbToggle">▲ たたむ</button>' +
        '<div class="wk3" style="text-align:left;font-size:12px;color:var(--usu);font-weight:700">' +
        '上の週ナビ・分類・絞り込みを隠して、表を広く使えます</div>';
    }
    $('fbToggle').addEventListener('click', function () {
      S.fold = !S.fold;
      setFold(S.fold);
      drawFoldBar();
    });
  }

  /** ミリ秒 → '8/22 14:30' */
  function stamp(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /** 最終編集の帯。見るだけなので「名前を変える」は出しません */
  function drawLastEdit() {
    var e = $('obiLast');
    if (S.tab !== 'plan') { e.classList.remove('on'); return; }
    var w = S.week || {};
    e.innerHTML = w.updatedAt
      ? '✏ 最終編集 <span class="when">' + esc(stamp(w.updatedAt)) + '</span> ' +
        '<span class="who">' + esc(w.updatedBy || '—') + '</span>'
      : '<span class="none4">✏ この週は、まだ編集されていません</span>';
    e.classList.add('on');
  }



  /** 「使う工事だけ」で出す条件。編集アプリとまったく同じ見かたです */
  function jobInUse(j, used) {
    return YY.jobVisible(j, {
      usedNow: !!(used || usedJobIds())[j.id],
      usedPrev: !!prevUsed()[j.id],
      shown: !!(S.week.show || {})[j.id],
      monday: S.monday
    });
  }

  /** 先週に人が入っていた工事id */
  function prevUsed() {
    var pm = YY.addWeeks(S.monday, -1);
    var w = (S.nearWeeks || {})[pm];
    return w ? YY.usedJobsInWeek(w) : {};
  }

  /** 2026-09-01 → 9/1 */
  function mdLabel(dateKey) {
    if (!dateKey) return '';
    var d = YY.parseKey(dateKey);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  /** 予定に出てくる工事id(隠した工事でも、人が入っていれば出すため) */
  function usedJobIds() {
    var u = {};
    var a = S.week.assign || {};
    Object.keys(a).forEach(function (id) {
      var days = a[id] || {};
      var has = Object.keys(days).some(function (d) {
        var c = days[d] || {};
        return Object.keys(c.members || {}).length > 0 || (c.extras || []).length > 0;
      });
      if (has) u[id] = true;
    });
    return u;
  }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  /* =================================================================
     通知を押して開いたとき
       ・変わった日の週の「じぶん」を出します
       ・いちばん上に「変更のお知らせ」(何日の、どこからどこへ)。「閉じる」で消えます
       ・変わった日のカードは、枠の色を変えて「変更」の札を付けます
     ================================================================= */

  /** yotei.html?week=2026-10-12&chg=… を読みます。読んだら URL からは消します(読み込み直しで戻らないように) */
  function noticeFromUrl() {
    var out = { week: null, notice: [] };
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return out; }
    var wk = q.get('week'), chg = q.get('chg');
    if (!wk && !chg) return out;
    if (/^\d{4}-\d{2}-\d{2}$/.test(wk || '')) out.week = YY.toKey(YY.mondayOf(wk));
    out.notice = parseNotice(chg);
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { }
    return out;
  }

  /** 変更の中身 [[日付, 前の行き先, 今の行き先], …] を読みます(functions/lib.js の changePayload)。形がおかしいものは捨てます */
  function parseNotice(s) {
    var a;
    try { a = JSON.parse(s || '[]'); } catch (e) { return []; }
    if (!Array.isArray(a)) return [];
    return a.filter(function (x) {
      return Array.isArray(x) && /^\d{4}-\d{2}-\d{2}$/.test(x[0]) &&
        typeof x[1] === 'string' && typeof x[2] === 'string';
    }).slice(0, 20).map(function (x) { return { date: x[0], from: x[1], to: x[2] }; });
  }

  /** 行き先 '工事id|REST' → '○○工事・休み'。空なら '未定'(通知の文面と同じ見せ方。工事名はいまの一覧から出します) */
  function stateLabel(s) {
    if (!s) return '未定';
    return s.split('|')
      .sort(function (a, b) { return (a === YY.REST_KEY) - (b === YY.REST_KEY); })   // 工事が先、休みは後ろ
      .map(function (id) { return YY.jobLabel(id).name; })
      .join('・');
  }

  /** 「変更のお知らせ」。1日1行で全部並べます。押すとその日のカードへ */
  function noticeBox() {
    var box = el('div', 'notice', '');
    var head = el('div', 'nh', '<b>🔔 変更のお知らせ</b>');
    var x = document.createElement('button');
    x.className = 'nx';
    x.textContent = '閉じる';
    x.addEventListener('click', function () { S.notice = []; render(); });
    head.appendChild(x);
    box.appendChild(head);
    S.notice.forEach(function (n) {
      var other = YY.toKey(YY.mondayOf(n.date)) !== S.monday;   // ほかの週の日
      var ln = document.createElement('button');
      ln.className = 'nl';
      ln.innerHTML = '<span class="d">' + esc(YY.dayLabel(n.date)) + '</span>' +
        '<span class="ft"><span class="fr">' + esc(stateLabel(n.from)) + '</span> → <b>' +
        esc(stateLabel(n.to)) + '</b></span>' +
        (other ? '<span class="go">›</span>' : '');
      ln.addEventListener('click', function () { showDay(n.date); });
      box.appendChild(ln);
    });
    return box;
  }

  /** その日のカードを出します(ほかの週なら、その週へ移ってから) */
  function showDay(date) {
    var mon = YY.toKey(YY.mondayOf(date));
    if (mon !== S.monday) {
      S.monday = mon;
      S.openMates = {};
      S.openCells = {};
      watchWeek();
      render();
    }
    var c = document.querySelector('.daycard[data-date="' + date + '"]');
    if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' });
  }

  /** すでに開いていた画面で通知を押したとき:その週の「じぶん」と「変更のお知らせ」を出します */
  function openWeek(week, chg) {
    S.tab = 'me';
    S.picking = false;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-tab') === 'me');
    });
    var n = parseNotice(chg);
    if (n.length) S.notice = n;
    if (/^\d{4}-\d{2}-\d{2}$/.test(week || '')) S.monday = YY.toKey(YY.mondayOf(week));
    S.openMates = {};
    S.openCells = {};
    watchWeek();
    render();
  }

  /* =================================================================
     プッシュ通知(車両管理アプリと同じ仕組み)
       ・届ける人は、事務所が編集アプリの「メンバー → 🔔 通知」で選びます(最初は全員オフ)
       ・ここでするのは、この端末で通知を許可して「じぶん」の名前とひもづけることだけです
       ・送るのは Cloud Functions(functions/index.js)、表示するのは sw.js です
     ================================================================= */
  var TOKEN_KEY = 'yotsuba-yotei-push-token';      // この端末の通知トークン
  var GUIDE_KEY = 'yotsuba-yotei-push-guide';      // 記録した「ボタンを出せない理由」(同じ名前・同じ理由は1回だけ記録します)
  var MESSAGING_SDK = 'https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging-compat.js';  // <head> の Firebase と同じ版に
  // 待つ長さの上限(電波が弱いと、返事が来ないまま止まることがあるので、ここで打ち切ります)
  var WAIT_PERM = 60000, WAIT_SDK = 20000, WAIT_SW = 20000, WAIT_TOKEN = 30000, WAIT_SAVE = 20000;

  function isStandalone() {
    return navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) {
    try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { }
  }

  /** この端末・この開き方で、通知を受け取れるか { os, code }(common.js の pushEnv) */
  function pushEnv() {
    return YY.pushEnv(navigator.userAgent, {
      ipad: navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1,
      standalone: isStandalone(),
      notification: 'Notification' in window,
      serviceWorker: 'serviceWorker' in navigator,
      pushManager: 'PushManager' in window
    });
  }
  function platform() { return pushEnv().os; }
  function isOnline() { return navigator.onLine !== false && S.online !== false; }

  /**
   * この端末の通知の状態
   *   'off' … まだ準備できていない(公開鍵が入っていない)
   *   'on'  … 許可ずみ / 'ask' … まだ許可していない(「🔔 通知を許可する」を出す)
   *   それ以外は、ボタンを出せない理由('line' LINE の中 / 'inapp' ほかのアプリの中 /
   *   'ios-browser' ホーム画面から開いていない / 'ios-old' iOS が古い / 'unsupported' ブラウザが対応していない /
   *   'blocked' 通知が止められている)
   */
  function pushState() {
    if (!YY.VAPID_KEY) return 'off';
    var c = pushEnv().code;
    if (c) return c;
    if (Notification.permission === 'denied') return 'blocked';
    return (Notification.permission === 'granted' && lsGet(TOKEN_KEY)) ? 'on' : 'ask';
  }

  /** 事務所がこの人の通知をオンにしているかを見張ります(名前を選び直したら付け替えます) */
  function watchNotify() {
    if (S.unsubNotify) { S.unsubNotify(); S.unsubNotify = null; }
    S.notifyOn = false;
    S.pushFail = '';
    if (!YY.VAPID_KEY || !S.me) return;
    S.unsubNotify = YY.subscribeNotifyMe(S.me, function (on) { S.notifyOn = on; render(); });
  }

  /* ---- 失敗したとき ----
     どこで止まったかを { yyStep, err } の形で投げ、最後に理由(YY.NOTIFY_FAIL_LABELS)に直します */
  function stepFail(step) {
    return function (err) { throw (err && err.yyStep) ? err : { yyStep: step, err: err }; };
  }
  /** p が ms ミリ秒たっても終わらなければ、時間切れ(err.timeout)にします */
  function inTime(p, ms) {
    return new Promise(function (ok, ng) {
      var t = setTimeout(function () {
        var e = new Error('時間切れ ' + (ms / 1000) + '秒'); e.timeout = true; ng(e);
      }, ms);
      Promise.resolve(p).then(function (v) { clearTimeout(t); ok(v); }, function (e) { clearTimeout(t); ng(e); });
    });
  }

  /** 通知をオンにできなかった理由を Firebase に残します(編集アプリの 🔔 通知 で見られます)。残せたら true */
  function logPushFail(code, kind, detail) {
    if (!S.me) return Promise.resolve(false);
    return YY.logNotifyFail({
      name: S.me, code: code, kind: kind, detail: detail,
      perm: ('Notification' in window) ? Notification.permission : 'none',
      platform: platform(), home: isStandalone(), ua: navigator.userAgent
    }).then(function () { return true; }, function (e) {
      console.warn('[通知] 理由を記録できませんでした', e);
      return false;
    });
  }
  /**
   * ボタンを出せない状態で開いていたことも残します(同じ名前・同じ理由は、この端末で1回だけ)。
   * 「残した」と端末におぼえるのは、保存できたときだけです(できなければ、次に開いたときにもう一度)
   */
  var guided = {};
  function guideKey(code) { return S.me + ':' + code; }
  function guideDone(k) { return !!guided[k] || lsGet(GUIDE_KEY).split('\n').indexOf(k) >= 0; }
  function rememberGuide(k) {
    guided[k] = true;
    var seen = lsGet(GUIDE_KEY).split('\n').filter(function (x) { return x && x !== k; });
    lsSet(GUIDE_KEY, seen.concat(k).slice(-30).join('\n'));
  }
  function logGuideOnce(code) {
    var k = guideKey(code);
    if (!S.me || guideDone(k)) return;
    guided[k] = true;              // この画面を開いているあいだは、描き直すたびに残さない
    logPushFail(code, 'guide', '').then(function (ok) { if (ok) rememberGuide(k); });
  }

  /** 通知の部品(Firebase Cloud Messaging)は、使うときだけ読みます */
  var sdkP = null;
  function loadSdk() {
    if (!sdkP) {
      sdkP = new Promise(function (ok, ng) {
        if (firebase.messaging) { ok(); return; }
        var s = document.createElement('script');
        s.src = MESSAGING_SDK;
        s.onload = function () { ok(); };
        s.onerror = function () {
          sdkP = null;               // 次に押したときに、もう一度読みます
          s.remove();
          ng(new Error('通知の部品を読めません ' + MESSAGING_SDK));
        };
        document.head.appendChild(s);
      });
    }
    return sdkP;
  }
  function getMessaging() {
    return inTime(loadSdk(), WAIT_SDK).catch(stepFail('sdk')).then(function () {
      return Promise.resolve(firebase.messaging.isSupported());
    }).then(function (ok) {
      if (!ok) throw { yyStep: 'support', err: new Error('messaging.isSupported() が false') };
      return firebase.app().messaging();
    }).catch(stepFail('support'));
  }

  /**
   * この端末の通知トークンを取り、「じぶん」の名前とひもづけて保存します(前のトークンは片づけます)。
   * 失敗したときは { yyStep, err } で終わります
   */
  function saveToken() {
    var me = S.me;
    if (!me) return Promise.reject({ yyStep: 'save', err: new Error('名前を選んでいません') });
    return getMessaging().then(function (m) {
      return inTime(navigator.serviceWorker.register('./sw.js').then(function () {
        return navigator.serviceWorker.ready;       // 動き出してからでないとトークンを取れません
      }), WAIT_SW).catch(stepFail('sw')).then(function (reg) {
        return inTime(m.getToken({ vapidKey: YY.VAPID_KEY, serviceWorkerRegistration: reg }), WAIT_TOKEN)
          .catch(stepFail('token'));
      });
    }).then(function (token) {
      if (!token) throw { yyStep: 'token', err: new Error('トークンが空でした') };
      return inTime(YY.saveNotifyToken(token, me, platform(), lsGet(TOKEN_KEY)), WAIT_SAVE)
        .catch(stepFail('save'))
        .then(function () { lsSet(TOKEN_KEY, token); });
    });
  }

  /** 「🔔 通知を許可する」。iPhone では、押した直後に許可のダイアログを出す必要があります(先に何かを待たない) */
  function enablePush() {
    if (S.pushBusy) return;
    var t0 = Date.now(), ask;
    try {
      ask = (Notification.permission === 'granted') ? 'granted' : Notification.requestPermission();
    } catch (e) { ask = Promise.reject({ yyStep: 'perm', err: e }); }
    S.pushBusy = true;
    S.pushFail = '';
    render();
    inTime(ask, WAIT_PERM).then(function (p) {
      p = p || Notification.permission;
      if (p === 'granted') return saveToken();
      // すぐに断られたときは、確認が出ていません(前に「許可しない」を押した・端末の設定で止めている など)
      var ms = Date.now() - t0;
      throw {
        yyStep: 'perm', code: p === 'denied' ? (ms < 800 ? 'blocked' : 'deny') : 'dismiss',
        err: new Error('許可の結果 ' + p + '(' + ms + 'ミリ秒)')
      };
    }, function (e) {
      // 許可の確認に答えないまま時間がたった(確認が小さく出て気づかなかった など)
      throw (e && e.yyStep) ? e : { yyStep: 'perm', code: 'dismiss', err: e };
    }).then(function () {
      S.pushBusy = false;
      toast('通知をオンにしました');
      render();
    }, function (f) {
      S.pushBusy = false;
      if (!f || !f.yyStep) f = { yyStep: 'error', err: f };
      var code = f.code || YY.pushFailCode(f.yyStep, f.err, isOnline());
      console.error('[通知] オンにできませんでした:', code, f.yyStep, f.err);
      S.pushFail = code;
      // 「許可しない」のときは、このあと出る「止まっています」を重ねて残しません
      var stop = (code === 'deny' || code === 'blocked') ? guideKey('blocked') : '';
      if (stop) guided[stop] = true;
      logPushFail(code, 'press', f.yyStep + ': ' + YY.errText(f.err)).then(function (ok) {
        if (ok && stop) rememberGuide(stop);
      });
      toast(code === 'deny' || code === 'blocked' || code === 'dismiss'
        ? '通知は許可されませんでした' : '通知をオンにできませんでした');
      render();
    });
  }

  /**
   * 理由ごとの、本人に見せる説明(HTML)。押す前の案内にも、押したあとの理由にも使います
   */
  function pushMsg(code) {
    var os = pushEnv().os, ios = os === 'ios', android = os === 'android';
    var retry = 'もう一度押してもだめなときは、事務所にお知らせください';
    var radio = '電波のよい所で、もう一度押してください';
    switch (code) {
      case 'line':
        return 'LINE の中では通知を受け取れません。<br>' +
          '<a href="yotei.html?openExternalBrowser=1">' + (ios ? 'Safari' : 'Chrome') + ' で開き直す</a>' +
          (ios ? 'と、ホーム画面に追加できます'
            : '<br>開かないときは、LINE の画面のメニューから「ブラウザで開く」を選んでください');
      case 'inapp':
        return 'このアプリの中では通知を受け取れません。<br>' + (ios
          ? 'Safari で開いてから、ホーム画面に追加してください'
          : 'メニューの「ブラウザで開く」などから、Chrome で開いてください');
      case 'ios-browser':
        return 'ホーム画面に追加すると通知が届きます。<br>' +
          'Safari の共有ボタン(□に↑)→「ホーム画面に追加」で置いたアイコンから開いてください。<br>' +
          '前から置いてあるアイコンで開いてもこの表示が出るときは、そのアイコンを消して、もう一度追加してください';
      case 'ios-old':
        return 'この iPhone は iOS が古いため、通知を受け取れません。<br>' +
          '設定 →「一般」→「ソフトウェアアップデート」で、iOS 16.4 以上にしてください';
      case 'unsupported':
        return 'このブラウザは通知に対応していません。<br>' +
          (ios ? 'iOS を新しくしてから、Safari でホーム画面に追加してください'
            : (android ? 'Chrome で開いてください' : 'Chrome か Edge で開いてください'));
      case 'blocked':
      case 'deny':
        return (code === 'deny' ? '「許可しない」が選ばれました。' : '前に「許可しない」を選んだため、通知が止まっています。') +
          '<br>' + (ios
            ? 'iPhone の 設定 →「通知」→「よつば予定」で「通知を許可」をオンにしてから、開き直してください'
            : (android
              ? 'Chrome の右上の︙ →「設定」→「サイトの設定」→「通知」で、このページを「許可」にしてから、開き直してください'
              : 'アドレス欄の左のマークから、通知を「許可」にしてから、開き直してください'));
      case 'dismiss':
        return '許可の確認が閉じられました。<br>もう一度押して、「許可」を選んでください';
      case 'offline':
        return '電波が届いていません。<br>' + radio;
      case 'network':
      case 'timeout':
        return '電波が弱いようです。<br>' + radio;
      case 'sdk-load':
        return '通知の部品を読みこめませんでした。<br>' + radio + '。' + retry;
      case 'push-service':
        return 'このスマホでは、通知の受け取りを始められませんでした。<br>' +
          (android ? 'Chrome 以外のブラウザで開いているときは、Chrome で開いて、もう一度押してください。' : '') + retry;
      default:
        return '通知をオンにできませんでした(' + esc(YY.NOTIFY_FAIL_LABELS[code] || code) + ')。<br>' + retry;
    }
  }

  /**
   * 名前の下に出す案内。事務所がオンにしている人にだけ出します。
   *   まだ許可していない → 「🔔 通知を許可する」(押してうまくいかなかったときは、その理由も)
   *   許可できない開き方・端末 → その理由と、どうすればよいか(Firebase にも1回だけ残します)
   */
  function pushBar() {
    if (!S.notifyOn) return null;
    var st = pushState();
    if (st === 'on' || st === 'off') return null;
    var box = el('div', 'pushbar', '');
    if (st === 'ask') {
      var bt = document.createElement('button');
      bt.className = 'pushbtn';
      bt.textContent = S.pushBusy ? '通知をオンにしています…' : '🔔 通知を許可する';
      bt.disabled = S.pushBusy;
      bt.addEventListener('click', enablePush);
      box.appendChild(bt);
      box.appendChild(S.pushFail && !S.pushBusy
        ? el('p', 'pushnote ng', pushMsg(S.pushFail))
        : el('p', 'pushnote', '予定が変わったときに、このスマホにお知らせが届きます'));
      return box;
    }
    logGuideOnce(st);
    // 押して「許可しない」になった直後は、そのことを出します(このあと開き直すと「止まっています」の案内になります)
    box.appendChild(el('p', 'pushnote', pushMsg(st === 'blocked' && S.pushFail === 'deny' ? 'deny' : st)));
    return box;
  }

  boot();
})();
</script>
</body>
</html>
